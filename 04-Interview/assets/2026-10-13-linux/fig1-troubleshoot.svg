<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" width="860" height="500" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="860" height="500" fill="#ffffff"/>
  <text x="30" y="34" font-size="17" font-weight="600" fill="#1f2937">Linux 线上排查：按症状分流的命令链</text>

  <!-- 症状入口 -->
  <rect x="340" y="52" width="180" height="40" rx="20" fill="#1f2937"/>
  <text x="430" y="78" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="600">服务出问题了</text>

  <path d="M430 92 L430 108" stroke="#9ca3af" stroke-width="1.4"/>
  <path d="M430 108 L120 108 L120 124" stroke="#9ca3af" stroke-width="1.4" fill="none"/>
  <path d="M430 108 L740 108 L740 124" stroke="#9ca3af" stroke-width="1.4" fill="none"/>
  <path d="M430 108 L430 124" stroke="#9ca3af" stroke-width="1.4"/>
  <path d="M430 108 L545 108 L545 124" stroke="#9ca3af" stroke-width="1.4" fill="none"/>

  <!-- 分支1 CPU -->
  <rect x="34" y="124" width="172" height="30" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.3"/>
  <text x="120" y="144" font-size="11.5" text-anchor="middle" fill="#991b1b" font-weight="600">CPU 打满</text>
  <g font-size="10.5" fill="#475569">
    <rect x="34" y="164" width="172" height="86" rx="6" fill="#fff7f7" stroke="#fecaca"/>
    <text x="44" y="184">1. top 找进程 PID</text>
    <text x="44" y="202">2. top -Hp PID 找线程</text>
    <text x="44" y="220">3. printf '%x' TID 转十六进制</text>
    <text x="44" y="238">4. jstack PID 搜该 TID</text>
  </g>
  <text x="44" y="268" font-size="9.5" fill="#dc2626">区分 %us/%sy/%wa/%irq</text>

  <!-- 分支2 内存 -->
  <rect x="222" y="124" width="172" height="30" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.3"/>
  <text x="308" y="144" font-size="11.5" text-anchor="middle" fill="#92400e" font-weight="600">内存异常</text>
  <g font-size="10.5" fill="#475569">
    <rect x="222" y="164" width="172" height="86" rx="6" fill="#fffdf5" stroke="#fde68a"/>
    <text x="232" y="184">1. free -h 看 available</text>
    <text x="232" y="202">2. top -o %MEM 找大户</text>
    <text x="232" y="220">3. jmap -histo:live 看对象</text>
    <text x="232" y="238">4. jmap -dump 再 MAT 分析</text>
  </g>
  <text x="232" y="268" font-size="9.5" fill="#dc2626">关键：看 available 不是 used</text>

  <!-- 分支3 磁盘 -->
  <rect x="410" y="124" width="172" height="30" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.3"/>
  <text x="496" y="144" font-size="11.5" text-anchor="middle" fill="#1e40af" font-weight="600">磁盘写满</text>
  <g font-size="10.5" fill="#475569">
    <rect x="410" y="164" width="172" height="86" rx="6" fill="#f7faff" stroke="#bfdbfe"/>
    <text x="420" y="184">1. df -h 定位分区</text>
    <text x="420" y="202">2. du -sh /* 逐层找大目录</text>
    <text x="420" y="220">3. lsof | grep deleted</text>
    <text x="420" y="238">4. 清空日志而非 rm</text>
  </g>
  <text x="420" y="268" font-size="9.5" fill="#dc2626">最常见坑：删了但句柄仍在</text>

  <!-- 分支4 网络 -->
  <rect x="598" y="124" width="228" height="30" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.3"/>
  <text x="712" y="144" font-size="11.5" text-anchor="middle" fill="#166534" font-weight="600">连不上 / 连接异常</text>
  <g font-size="10.5" fill="#475569">
    <rect x="598" y="164" width="228" height="86" rx="6" fill="#f7fdf9" stroke="#bbf7d0"/>
    <text x="608" y="184">1. telnet ip port 通不通</text>
    <text x="608" y="202">2. ss -lntp 端口在听吗</text>
    <text x="608" y="220">3. netstat 看状态分布</text>
    <text x="608" y="238">4. tcpdump 抓包确认包到了</text>
  </g>
  <text x="608" y="268" font-size="9.5" fill="#dc2626">CLOSE_WAIT 堆积 = 应用没关连接</text>

  <!-- 三大陷阱 -->
  <line x1="30" y1="292" x2="830" y2="292" stroke="#e5e7eb"/>
  <text x="30" y="318" font-size="13.5" font-weight="600" fill="#1f2937">三个最容易被追问的陷阱</text>

  <rect x="30" y="332" width="256" height="70" rx="7" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/>
  <text x="46" y="354" font-size="11.5" font-weight="600" fill="#92400e">① buff/cache 是假内存占用</text>
  <text x="46" y="374" font-size="10.5" fill="#475569">它是可回收的页缓存，判断内存是否</text>
  <text x="46" y="391" font-size="10.5" fill="#475569">紧张要看 available，不是 used。</text>

  <rect x="302" y="332" width="256" height="70" rx="7" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="318" y="354" font-size="11.5" font-weight="600" fill="#991b1b">② 删文件空间不释放</text>
  <text x="318" y="374" font-size="10.5" fill="#475569">进程仍持有已删文件的句柄，句柄不</text>
  <text x="318" y="391" font-size="10.5" fill="#475569">关空间就不还。应清空而非 rm。</text>

  <rect x="574" y="332" width="256" height="70" rx="7" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="590" y="354" font-size="11.5" font-weight="600" fill="#1e40af">③ inode 用完也会写不进</text>
  <text x="590" y="374" font-size="10.5" fill="#475569">df -h 显示有空间，但大量小文件耗</text>
  <text x="590" y="391" font-size="10.5" fill="#475569">尽 inode，建新文件照样失败。</text>

  <!-- 信号 -->
  <line x1="30" y1="418" x2="830" y2="418" stroke="#e5e7eb"/>
  <text x="30" y="444" font-size="13" font-weight="600" fill="#1f2937">停止服务的信号选择</text>
  <text x="30" y="468" font-size="11.5" fill="#475569">kill -15（SIGTERM）优雅退出，能给进程机会关连接、刷盘 —— <tspan fill="#059669" font-weight="600">线上优先</tspan></text>
  <text x="30" y="488" font-size="11.5" fill="#475569">kill -9（SIGKILL）强杀，不可捕获、资源不释放、可能丢数据 —— <tspan fill="#dc2626" font-weight="600">万不得已才用</tspan></text>
</svg>
