<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="800" height="420" fill="#ffffff"/>
  <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">CAP 的正确读法：无分区时 C 与 A 可兼得；分区时的取舍是 C 还是 L</text>

  <!-- 三圆韦恩 -->
  <circle cx="200" cy="150" r="86" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.6"/>
  <circle cx="300" cy="150" r="86" fill="#dcfce7" stroke="#22c55e" stroke-width="1.6"/>
  <circle cx="250" cy="228" r="86" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.6"/>
  <text x="150" y="112" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">C</text>
  <text x="350" y="112" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">A</text>
  <text x="250" y="278" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">P</text>
  <text x="250" y="180" text-anchor="middle" font-size="10.5" fill="#334155">CA</text>
  <text x="196" y="216" text-anchor="middle" font-size="10.5" fill="#334155">CP</text>
  <text x="306" y="216" text-anchor="middle" font-size="10.5" fill="#334155">AP</text>

  <text x="200" y="316" text-anchor="middle" font-size="10.5" fill="#64748b">「三选二」是被误读的说法</text>

  <!-- 正确表述 -->
  <rect x="420" y="60" width="340" height="112" rx="5" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="436" y="84" font-size="12.5" font-weight="600" fill="#1e40af">Brewer 2012 原文修正</text>
  <text x="436" y="106" font-size="10.5" fill="#1e3a8a">分区（P）不是「选项」，是网络的事实</text>
  <text x="436" y="126" font-size="10.5" fill="#1e3a8a">无分区时 → 可同时给 C 和 A</text>
  <text x="436" y="146" font-size="10.5" fill="#1e3a8a">有分区时 → 必须在 C 与 A 之间选</text>
  <text x="436" y="166" font-size="10.5" font-weight="600" fill="#1d4ed8">所以真正的取舍是 C vs A，不是「3 选 2」</text>

  <!-- PACELC -->
  <rect x="420" y="184" width="340" height="180" rx="5" fill="#f0fdf4" stroke="#6ee7b7"/>
  <text x="436" y="208" font-size="12.5" font-weight="600" fill="#065f46">PACELC（Abadi 2012）：补上正常态</text>
  <text x="436" y="230" font-size="11" fill="#064e3b">if (P) then A or C</text>
  <text x="436" y="252" font-size="11" fill="#064e3b">else     then L or C</text>
  <text x="436" y="278" font-size="10.5" fill="#047857">无分区（E, else）时也要取舍：</text>
  <text x="436" y="298" font-size="10.5" fill="#047857">要低延迟 L，还是强一致 C</text>
  <text x="436" y="322" font-size="10.5" fill="#047857">例：Dynamo/ Cassandra → PA / EL</text>
  <text x="436" y="344" font-size="10.5" fill="#047857">　　：MongoDB / HBase → PC / EC</text>

  <!-- 一致性强度阶梯 -->
  <rect x="40" y="336" width="360" height="70" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="56" y="358" font-size="12" font-weight="600" fill="#334155">一致性强度阶梯（可组合成三种模型）</text>
  <text x="56" y="380" font-size="10.5" fill="#475569">线性一致（Linearizable）⊃ 顺序一致（Sequential）</text>
  <text x="56" y="398" font-size="10.5" fill="#475569">⊃ 因果一致（Causal）⊃ 最终一致（Eventual）</text>
</svg>
