<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="800" height="430" fill="#ffffff"/>
  <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">Raft：选主的随机超时与「提交需本轮任期」规则</text>

  <!-- 三种状态 -->
  <rect x="40" y="56" width="180" height="60" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="130" y="80" text-anchor="middle" font-size="12.5" font-weight="600" fill="#334155">Follower</text>
  <text x="130" y="100" text-anchor="middle" font-size="10" fill="#64748b">被动收心跳/日志</text>

  <rect x="310" y="56" width="180" height="60" rx="5" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="400" y="80" text-anchor="middle" font-size="12.5" font-weight="600" fill="#92400e">Candidate</text>
  <text x="400" y="100" text-anchor="middle" font-size="10" fill="#92400e">超时 → 拉票</text>

  <rect x="580" y="56" width="180" height="60" rx="5" fill="#dcfce7" stroke="#22c55e"/>
  <text x="670" y="80" text-anchor="middle" font-size="12.5" font-weight="600" fill="#166534">Leader</text>
  <text x="670" y="100" text-anchor="middle" font-size="10" fill="#166534">发心跳/复制日志</text>

  <line x1="220" y1="86" x2="310" y2="86" stroke="#64748b" stroke-width="1.6"/>
  <polygon points="310,86 300,81 300,91" fill="#64748b"/>
  <text x="265" y="78" text-anchor="middle" font-size="9.5" fill="#64748b">选举超时</text>

  <line x1="490" y1="86" x2="580" y2="86" stroke="#64748b" stroke-width="1.6"/>
  <polygon points="580,86 570,81 570,91" fill="#64748b"/>
  <text x="535" y="78" text-anchor="middle" font-size="9.5" fill="#64748b">多数票</text>

  <!-- 选举超时 -->
  <rect x="40" y="136" width="350" height="106" rx="5" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="56" y="160" font-size="12.5" font-weight="600" fill="#1e40af">选举超时：150 ~ 300ms 随机</text>
  <text x="56" y="182" font-size="10.5" fill="#1e3a8a">为什么随机？→ 避免所有 Follower 同时成为 Candidate</text>
  <text x="56" y="202" font-size="10.5" fill="#1e3a8a">（否则选票被瓜分，一直选不出 Leader）</text>
  <text x="56" y="224" font-size="10.5" fill="#1e40af">心跳间隔 &lt;&lt; 选举超时下限，避免误触发选举</text>

  <!-- 提交规则 -->
  <rect x="410" y="136" width="350" height="106" rx="5" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="426" y="160" font-size="12.5" font-weight="600" fill="#92400e">提交规则（易错点）</text>
  <text x="426" y="182" font-size="10.5" fill="#78350f">Leader 不能凭「多数已复制」直接提交</text>
  <text x="426" y="202" font-size="10.5" fill="#78350f">必须满足：log[N].term == currentTerm</text>
  <text x="426" y="222" font-size="10.5" fill="#78350f">否则「只在新任期提交时」连带提交历史条目</text>

  <!-- 安全性 -->
  <rect x="40" y="258" width="350" height="118" rx="5" fill="#f0fdf4" stroke="#6ee7b7"/>
  <text x="56" y="282" font-size="12.5" font-weight="600" fill="#065f46">两条安全性保证</text>
  <text x="56" y="304" font-size="10.5" fill="#064e3b"><tspan font-weight="600">选举限制</tspan>：日志不够新的节点不能当选</text>
  <text x="56" y="324" font-size="10.5" fill="#064e3b"><tspan font-weight="600">Leader Completeness</tspan>：已提交的条目</text>
  <text x="72" y="342" font-size="10.5" fill="#064e3b">一定出现在后续所有 Leader 的日志里</text>
  <text x="56" y="364" font-size="10.5" fill="#047857">＋ 状态机只 apply 已提交的条目</text>

  <!-- 成员变更 -->
  <rect x="410" y="258" width="350" height="118" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="426" y="282" font-size="12.5" font-weight="600" fill="#334155">集群成员变更：joint consensus</text>
  <text x="426" y="304" font-size="10.5" fill="#475569">先切到「旧配置 ∩ 新配置」的联合配置</text>
  <text x="426" y="324" font-size="10.5" fill="#475569">提交后再切到新配置</text>
  <text x="426" y="346" font-size="10.5" fill="#475569">必要性：直接从旧配置跳到新配置，</text>
  <text x="426" y="364" font-size="10.5" fill="#475569">两个不相交的多数派可能同时选出 Leader</text>

  <rect x="40" y="390" width="720" height="30" rx="5" fill="#fee2e2" stroke="#f87171"/>
  <text x="56" y="410" font-size="11" fill="#7f1d1d"><tspan font-weight="600">对比 Paxos</tspan>：Raft 把「Leader 选举 + 日志复制 + 安全性」拆成三块讲清，可理解性优先；Paxos 允许多 Proposer，证明更简洁但工程实现常退化成类似 Raft 的结构。</text>
</svg>
