<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="800" height="420" fill="#ffffff"/>
  <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">Reno 四阶段与 AIMD 锯齿：线性增、乘性减</text>

  <!-- 坐标系 -->
  <line x1="90" y1="330" x2="740" y2="330" stroke="#d3d8e0" stroke-width="1.5"/>
  <line x1="90" y1="70" x2="90" y2="330" stroke="#d3d8e0" stroke-width="1.5"/>
  <text x="415" y="366" text-anchor="middle" font-size="11.5" fill="#454b57">时间（RTT 轮次）→</text>
  <text x="46" y="200" text-anchor="middle" font-size="11.5" fill="#454b57" transform="rotate(-90 46 200)">cwnd →</text>

  <!-- ssthresh 虚线 -->
  <line x1="90" y1="150" x2="740" y2="150" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="746" y="153" font-size="10.5" fill="#b45309">ssthresh</text>

  <!-- 慢启动：指数 -->
  <path d="M 90 330 Q 130 250 155 150" fill="none" stroke="#2563eb" stroke-width="2.2"/>
  <text x="118" y="262" font-size="11" fill="#1e40af" font-weight="600">慢启动</text>
  <text x="118" y="278" font-size="10" fill="#1e40af">指数（每 RTT 翻倍）</text>

  <!-- 拥塞避免：线性上升 -->
  <path d="M 155 150 L 300 96" fill="none" stroke="#2563eb" stroke-width="2.2"/>
  <text x="196" y="132" font-size="11" fill="#1e40af" font-weight="600">拥塞避免（加性增）</text>
  <text x="200" y="118" font-size="10" fill="#1e40af">每 RTT +1 MSS</text>

  <!-- 丢包点 1：乘性减 -->
  <circle cx="300" cy="96" r="4" fill="#dc2626"/>
  <text x="288" y="84" font-size="10.5" fill="#b91c1c" font-weight="600">丢包</text>
  <line x1="300" y1="96" x2="300" y2="188" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="3 3"/>
  <text x="308" y="200" font-size="10.5" fill="#b91c1c" font-weight="600">cwnd 减半（乘性减）</text>

  <!-- 第二段锯齿 -->
  <path d="M 300 188 L 470 132" fill="none" stroke="#2563eb" stroke-width="2.2"/>
  <circle cx="470" cy="132" r="4" fill="#dc2626"/>
  <line x1="470" y1="132" x2="470" y2="220" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="3 3"/>
  <path d="M 470 220 L 620 172" fill="none" stroke="#2563eb" stroke-width="2.2"/>
  <circle cx="620" cy="172" r="4" fill="#dc2626"/>
  <line x1="620" y1="172" x2="620" y2="252" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="3 3"/>
  <path d="M 620 252 L 730 212" fill="none" stroke="#2563eb" stroke-width="2.2"/>

  <!-- 锯齿标注 -->
  <text x="640" y="300" font-size="11" fill="#454b57">锯齿 = AIMD 的必然形状</text>

  <!-- 结论区 -->
  <rect x="90" y="378" width="650" height="34" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="106" y="399" font-size="11" fill="#334155">AIMD 被证明（Chiu &amp; Jain, 1989）能让多条竞争流收敛到公平共享带宽 —— 是设计，不是缺陷。</text>
</svg>
