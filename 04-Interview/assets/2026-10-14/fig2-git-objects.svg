<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="800" height="400" fill="#ffffff"/>
  <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">Git 对象模型：blob / tree / commit 三层，分支只是「指向 commit 的引用」</text>

  <!-- 对象 -->
  <rect x="40" y="60" width="180" height="72" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="130" y="84" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">blob</text>
  <text x="56" y="106" font-size="10.5" fill="#1e3a8a">文件内容（不含文件名）</text>
  <text x="56" y="124" font-size="10" fill="#64748b">内容相同 → 共享同一 blob</text>

  <rect x="250" y="60" width="180" height="72" rx="5" fill="#dcfce7" stroke="#22c55e"/>
  <text x="340" y="84" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">tree</text>
  <text x="266" y="106" font-size="10.5" fill="#14532d">目录：文件名 + 模式</text>
  <text x="266" y="124" font-size="10" fill="#64748b">指向 blob / 子 tree</text>

  <rect x="460" y="60" width="300" height="72" rx="5" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="610" y="84" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">commit</text>
  <text x="476" y="106" font-size="10.5" fill="#78350f">tree 哈希 + 父 commit 哈希 + 作者 + message</text>
  <text x="476" y="124" font-size="10" fill="#64748b">父指针形成 DAG（有向无环图）</text>

  <line x1="220" y1="96" x2="250" y2="96" stroke="#64748b" stroke-width="1.6"/>
  <polygon points="250,96 240,91 240,101" fill="#64748b"/>
  <line x1="430" y1="96" x2="460" y2="96" stroke="#64748b" stroke-width="1.6"/>
  <polygon points="460,96 450,91 450,101" fill="#64748b"/>

  <!-- 引用 -->
  <text x="40" y="172" font-size="12.5" font-weight="600" fill="#1e40af">引用：分支和 HEAD 都是「指针」</text>

  <rect x="40" y="186" width="230" height="60" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="155" y="208" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">refs/heads/master</text>
  <text x="155" y="230" text-anchor="middle" font-size="10.5" fill="#64748b">内容是一个 40 位 commit 哈希</text>

  <rect x="290" y="186" width="230" height="60" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="405" y="208" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">HEAD</text>
  <text x="405" y="230" text-anchor="middle" font-size="10.5" fill="#64748b">内容: "ref: refs/heads/master"</text>

  <rect x="540" y="186" width="220" height="60" rx="5" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="650" y="208" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e40af">切分支 = 改 HEAD</text>
  <text x="650" y="230" text-anchor="middle" font-size="10.5" fill="#1e3a8a">成本极低，与工作区大小无关</text>

  <line x1="270" y1="216" x2="290" y2="216" stroke="#64748b" stroke-width="1.4"/>
  <polygon points="290,216 281,212 281,220" fill="#64748b"/>
  <line x1="520" y1="216" x2="540" y2="216" stroke="#64748b" stroke-width="1.4"/>
  <polygon points="540,216 531,212 531,220" fill="#64748b"/>

  <!-- 三棵树 -->
  <text x="40" y="282" font-size="12.5" font-weight="600" fill="#92400e">reset 的本质：移动分支 ref，再按 mode 决定后两棵树</text>
  <rect x="40" y="296" width="740" height="92" rx="5" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="56" y="318" font-size="10.5" fill="#78350f">git reset &lt;mode&gt; &lt;commit&gt;　移动的是「当前分支这个 ref 指向的 commit」</text>
  <text x="56" y="340" font-size="10.5" fill="#78350f">--soft　：只动分支指针　　　　暂存区不变　　　工作区不变</text>
  <text x="56" y="358" font-size="10.5" fill="#78350f">--mixed：再重置暂存区（默认）改动退回未暂存　工作区不变</text>
  <text x="56" y="376" font-size="10.5" fill="#b91c1c">--hard　：再重置工作区　　　　未提交改动**直接丢失**（危险）</text>
</svg>
