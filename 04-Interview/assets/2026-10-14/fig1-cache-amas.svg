<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="800" height="430" fill="#ffffff"/>
  <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">Cache 地址划分、64 字节伪共享粒度与多级 AMAT 展开</text>

  <!-- 地址划分 -->
  <text x="40" y="60" font-size="12.5" font-weight="600" fill="#1e40af">32 位地址 · 64KB Cache · 64B 块 · 4 路组相联</text>
  <rect x="40" y="72" width="290" height="38" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="185" y="96" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e40af">标记 18 位（bit 31–14）</text>
  <rect x="330" y="72" width="150" height="38" rx="4" fill="#dcfce7" stroke="#22c55e"/>
  <text x="405" y="96" text-anchor="middle" font-size="11.5" font-weight="600" fill="#166534">组号 8 位</text>
  <rect x="480" y="72" width="150" height="38" rx="4" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="555" y="96" text-anchor="middle" font-size="11.5" font-weight="600" fill="#92400e">块内 6 位</text>

  <rect x="40" y="124" width="590" height="66" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="56" y="146" font-size="11" fill="#334155">块内位 = log₂(64) = 6　｜　组数 = 64KB / (64B × 4) = 256　→　组号 = 8</text>
  <text x="56" y="166" font-size="11" fill="#334155">标记位 = 32 − 6 − 8 = <tspan font-weight="600" fill="#1d4ed8">18</tspan>　　（若改直接映射：行号 10 位 → 标记 32−6−10 = <tspan font-weight="600" fill="#dc2626">16</tspan>）</text>
  <text x="56" y="184" font-size="10.5" fill="#64748b">标记位的变化说明：直接映射少了「路内选择」的位，全部挪去做标记</text>

  <!-- 伪共享 -->
  <text x="40" y="228" font-size="12.5" font-weight="600" fill="#92400e">伪共享：cache line 是 64 字节，两个变量落同一行就互相拖累</text>
  <rect x="40" y="240" width="330" height="58" rx="4" fill="#fee2e2" stroke="#f87171"/>
  <text x="56" y="262" font-size="11" font-weight="600" fill="#7f1d1d">线程 A 写 x ｜ 线程 B 写 y（同一 line）</text>
  <text x="56" y="282" font-size="10.5" fill="#7f1d1d">line 在两核间反复失效/重取 → ping-pong</text>

  <rect x="390" y="240" width="370" height="58" rx="4" fill="#f0fdf4" stroke="#6ee7b7"/>
  <text x="406" y="262" font-size="11" font-weight="600" fill="#065f46">解法：padding 到 64 字节边界</text>
  <text x="406" y="282" font-size="10.5" fill="#064e3b">Java `@Contended`（ConcurrentHashMap / Thread 已用）</text>

  <!-- AMAT -->
  <text x="40" y="330" font-size="12.5" font-weight="600" fill="#1e40af">多级 Cache 的 AMAT 逐级展开</text>
  <rect x="40" y="342" width="720" height="76" rx="5" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="56" y="364" font-size="11" fill="#1e3a8a">AMAT = L1 命中时间 + L1 缺失率 × ( L2 命中时间 + L2 局部缺失率 × 主存代价 )</text>
  <text x="56" y="386" font-size="11" fill="#1e3a8a">例：1 + 0.05 × ( 10 + 0.20 × 100 ) = 1 + 0.05 × 30 = <tspan font-weight="600">2.5 周期</tspan></text>
  <text x="56" y="406" font-size="10.5" font-weight="600" fill="#b91c1c">易错：L2 缺失率是「局部缺失率」（到达 L2 的访问中的比例），不是全局缺失率</text>
</svg>
