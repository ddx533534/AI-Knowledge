<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="800" height="400" fill="#ffffff"/>
  <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">malloc 的 128KB 分流与 fork 的 COW 真实代价</text>

  <!-- malloc -->
  <text x="40" y="62" font-size="13" font-weight="600" fill="#1e40af">malloc：DEFAULT_MMAP_THRESHOLD = 128 * 1024（glibc malloc/malloc.c）</text>

  <rect x="40" y="76" width="160" height="64" rx="5" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="120" y="102" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e40af">请求 size</text>
  <text x="120" y="124" text-anchor="middle" font-size="10.5" fill="#1e3a8a">一次 malloc 调用</text>

  <line x1="200" y1="94" x2="252" y2="94" stroke="#64748b" stroke-width="1.6"/>
  <polygon points="252,94 242,89 242,99" fill="#64748b"/>
  <text x="226" y="86" text-anchor="middle" font-size="10" fill="#64748b">&lt; 128KB</text>
  <line x1="200" y1="122" x2="252" y2="122" stroke="#64748b" stroke-width="1.6"/>
  <polygon points="252,122 242,117 242,127" fill="#64748b"/>
  <text x="226" y="140" text-anchor="middle" font-size="10" fill="#64748b">≥ 128KB</text>

  <rect x="256" y="76" width="228" height="64" rx="5" fill="#dcfce7" stroke="#22c55e"/>
  <text x="270" y="98" font-size="11.5" font-weight="600" fill="#166534">brk / sbrk：扩展堆顶</text>
  <text x="270" y="118" font-size="10" fill="#14532d">单指针只能连续增长</text>
  <text x="270" y="134" font-size="10" fill="#14532d">释放只能收缩堆顶 → 中间空洞无法归还</text>

  <rect x="496" y="76" width="264" height="64" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="510" y="98" font-size="11.5" font-weight="600" fill="#1e40af">mmap：独立匿名映射</text>
  <text x="510" y="118" font-size="10" fill="#1e3a8a">munmap 可立即归还内核</text>
  <text x="510" y="134" font-size="10" fill="#1e3a8a">代价：每次映射有页表/缺页开销</text>

  <!-- fork COW -->
  <text x="40" y="184" font-size="13" font-weight="600" fill="#92400e">fork：只复制页表 + 建 task_struct（man fork.2 原文），物理页 COW 共享</text>

  <rect x="60" y="200" width="150" height="80" rx="5" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="135" y="224" text-anchor="middle" font-size="12" font-weight="600" fill="#78350f">父进程页表</text>
  <text x="135" y="246" text-anchor="middle" font-size="10.5" fill="#92400e">PTE → 物理页 P</text>
  <text x="135" y="266" text-anchor="middle" font-size="10.5" fill="#92400e">标记：只读</text>

  <line x1="210" y1="240" x2="286" y2="240" stroke="#64748b" stroke-width="1.6"/>
  <polygon points="286,240 276,235 276,245" fill="#64748b"/>
  <text x="248" y="232" text-anchor="middle" font-size="10" fill="#64748b">fork()</text>

  <rect x="290" y="200" width="150" height="80" rx="5" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="365" y="224" text-anchor="middle" font-size="12" font-weight="600" fill="#78350f">子进程页表</text>
  <text x="365" y="246" text-anchor="middle" font-size="10.5" fill="#92400e">PTE → 同一物理页 P</text>
  <text x="365" y="266" text-anchor="middle" font-size="10.5" fill="#92400e">标记：只读</text>

  <rect x="470" y="200" width="290" height="80" rx="5" fill="#f0fdf4" stroke="#6ee7b7"/>
  <text x="484" y="222" font-size="11.5" font-weight="600" fill="#065f46">任一方写入 → 触发缺页</text>
  <text x="484" y="243" font-size="10.5" fill="#064e3b">内核才复制那一页，改成可写</text>
  <text x="484" y="264" font-size="10.5" fill="#064e3b">代价是「延后」的：写得多，COW 复制多</text>

  <!-- 底部结论 -->
  <rect x="40" y="300" width="720" height="36" rx="5" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="56" y="323" font-size="11" fill="#1e40af"><tspan font-weight="600">为什么 fork 快</tspan>：省掉了复制物理内存，只复制页表（数量级更小）。Redis bgsave 敢用 fork 的底气；但 fork 后大量写入会让内存翻倍。</text>

  <rect x="40" y="344" width="720" height="36" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="56" y="367" font-size="11" fill="#334155"><tspan font-weight="600">glibc fork 的真相</tspan>：不是裸系统调用，而是 clone(SIGCHLD)；线程是 clone(CLONE_VM|...)。差异只在标志位——这是「线程＝轻量级进程」的源码级证据。</text>
</svg>
