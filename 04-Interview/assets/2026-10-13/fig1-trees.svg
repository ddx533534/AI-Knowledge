<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="860" height="420" fill="#ffffff"/>
  <text x="30" y="34" font-size="17" font-weight="600" fill="#1f2937">四种平衡/索引树的结构与关键代价对比</text>

  <!-- ============ 1. BST ============ -->
  <text x="30" y="72" font-size="14" font-weight="600" fill="#2563eb">二叉搜索树 BST</text>
  <text x="30" y="92" font-size="11.5" fill="#6b7280">无序插入最坏退化成链表 O(n)</text>

  <line x1="95" y1="118" x2="65" y2="152" stroke="#cbd5e1" stroke-width="1.4"/>
  <line x1="95" y1="118" x2="127" y2="152" stroke="#cbd5e1" stroke-width="1.4"/>
  <line x1="65" y1="152" x2="42" y2="186" stroke="#cbd5e1" stroke-width="1.4"/>
  <line x1="65" y1="152" x2="90" y2="186" stroke="#cbd5e1" stroke-width="1.4"/>
  <line x1="127" y1="152" x2="140" y2="186" stroke="#cbd5e1" stroke-width="1.4"/>

  <circle cx="95" cy="118" r="17" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.4"/>
  <text x="95" y="123" font-size="12" text-anchor="middle" fill="#1e40af">8</text>
  <circle cx="65" cy="152" r="17" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.4"/>
  <text x="65" y="157" font-size="12" text-anchor="middle" fill="#1e40af">3</text>
  <circle cx="127" cy="152" r="17" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.4"/>
  <text x="127" y="157" font-size="12" text-anchor="middle" fill="#1e40af">10</text>
  <circle cx="42" cy="186" r="17" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.4"/>
  <text x="42" y="191" font-size="12" text-anchor="middle" fill="#1e40af">1</text>
  <circle cx="90" cy="186" r="17" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.4"/>
  <text x="90" y="191" font-size="12" text-anchor="middle" fill="#1e40af">6</text>
  <circle cx="140" cy="186" r="17" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.4"/>
  <text x="140" y="191" font-size="12" text-anchor="middle" fill="#1e40af">14</text>

  <text x="30" y="228" font-size="11.5" fill="#334155">查找 O(log n) 期望 / O(n) 最坏</text>

  <!-- ============ 2. 红黑树 ============ -->
  <text x="235" y="72" font-size="14" font-weight="600" fill="#b45309">红黑树 RB-Tree</text>
  <text x="235" y="92" font-size="11.5" fill="#6b7280">弱平衡，旋转少，增删更快</text>

  <line x1="305" y1="118" x2="270" y2="152" stroke="#cbd5e1" stroke-width="1.4"/>
  <line x1="305" y1="118" x2="340" y2="152" stroke="#cbd5e1" stroke-width="1.4"/>
  <line x1="270" y1="152" x2="248" y2="186" stroke="#cbd5e1" stroke-width="1.4"/>
  <line x1="340" y1="152" x2="362" y2="186" stroke="#cbd5e1" stroke-width="1.4"/>

  <circle cx="305" cy="118" r="17" fill="#1f2937" stroke="#111827" stroke-width="1.4"/>
  <text x="305" y="123" font-size="12" text-anchor="middle" fill="#ffffff">8</text>
  <circle cx="270" cy="152" r="17" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.4"/>
  <text x="270" y="157" font-size="12" text-anchor="middle" fill="#92400e">3</text>
  <circle cx="340" cy="152" r="17" fill="#1f2937" stroke="#111827" stroke-width="1.4"/>
  <text x="340" y="157" font-size="12" text-anchor="middle" fill="#ffffff">10</text>
  <circle cx="248" cy="186" r="17" fill="#1f2937" stroke="#111827" stroke-width="1.4"/>
  <text x="248" y="191" font-size="12" text-anchor="middle" fill="#ffffff">1</text>
  <circle cx="362" cy="186" r="17" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.4"/>
  <text x="362" y="191" font-size="12" text-anchor="middle" fill="#92400e">14</text>

  <text x="235" y="228" font-size="11.5" fill="#334155">查找稳定 O(log n)，任意路径长度差 ≤1 倍</text>

  <!-- ============ 3. B+ 树 ============ -->
  <text x="470" y="72" font-size="14" font-weight="600" fill="#047857">B+ 树（数据库索引）</text>
  <text x="470" y="92" font-size="11.5" fill="#6b7280">非叶只存键，叶子存数据并串成链表</text>

  <rect x="540" y="108" width="80" height="30" rx="4" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.4"/>
  <text x="580" y="128" font-size="12" text-anchor="middle" fill="#065f46">10 | 20 | 30</text>
  <line x1="580" y1="138" x2="530" y2="168" stroke="#cbd5e1" stroke-width="1.4"/>
  <line x1="580" y1="138" x2="580" y2="168" stroke="#cbd5e1" stroke-width="1.4"/>
  <line x1="580" y1="138" x2="632" y2="168" stroke="#cbd5e1" stroke-width="1.4"/>

  <rect x="490" y="168" width="72" height="26" rx="4" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.4"/>
  <text x="526" y="185" font-size="11" text-anchor="middle" fill="#065f46">5 | 8</text>
  <rect x="544" y="168" width="72" height="26" rx="4" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.4"/>
  <text x="580" y="185" font-size="11" text-anchor="middle" fill="#065f46">10 | 15</text>
  <rect x="596" y="168" width="72" height="26" rx="4" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.4"/>
  <text x="632" y="185" font-size="11" text-anchor="middle" fill="#065f46">20 | 25</text>

  <rect x="490" y="200" width="72" height="26" rx="4" fill="#d1fae5" stroke="#34d399" stroke-width="1.2"/>
  <text x="526" y="217" font-size="11" text-anchor="middle" fill="#065f46">3 · 5 · 8</text>
  <rect x="544" y="200" width="72" height="26" rx="4" fill="#d1fae5" stroke="#34d399" stroke-width="1.2"/>
  <text x="580" y="217" font-size="11" text-anchor="middle" fill="#065f46">10·11·15</text>
  <rect x="596" y="200" width="72" height="26" rx="4" fill="#d1fae5" stroke="#34d399" stroke-width="1.2"/>
  <text x="632" y="217" font-size="11" text-anchor="middle" fill="#065f46">20·25·30</text>

  <path d="M562 213 L572 213" stroke="#059669" stroke-width="1.6"/>
  <path d="M616 213 L626 213" stroke="#059669" stroke-width="1.6"/>
  <path d="M570 213 l-3 -3 v6 z" fill="#059669"/>
  <path d="M624 213 l-3 -3 v6 z" fill="#059669"/>

  <text x="470" y="242" font-size="11.5" fill="#334155">查找稳定 O(log n)，范围查询走叶子链表</text>

  <!-- ============ 4. 跳表 ============ -->
  <text x="700" y="72" font-size="14" font-weight="600" fill="#7c3aed">跳表 Skip List</text>
  <text x="700" y="92" font-size="11.5" fill="#6b7280">Redis ZSet 底层，实现比红黑树简单</text>

  <text x="690" y="124" font-size="10.5" fill="#6b7280">L3</text>
  <line x1="712" y1="120" x2="840" y2="120" stroke="#e9d5ff" stroke-width="1"/>
  <rect x="726" y="112" width="30" height="16" rx="3" fill="#ede9fe" stroke="#a78bfa" stroke-width="1.3"/>
  <text x="741" y="124" font-size="10" text-anchor="middle" fill="#5b21b6">1</text>
  <rect x="796" y="112" width="30" height="16" rx="3" fill="#ede9fe" stroke="#a78bfa" stroke-width="1.3"/>
  <text x="811" y="124" font-size="10" text-anchor="middle" fill="#5b21b6">9</text>

  <text x="690" y="150" font-size="10.5" fill="#6b7280">L2</text>
  <line x1="712" y1="146" x2="840" y2="146" stroke="#e9d5ff" stroke-width="1"/>
  <rect x="726" y="138" width="30" height="16" rx="3" fill="#ede9fe" stroke="#a78bfa" stroke-width="1.3"/>
  <text x="741" y="150" font-size="10" text-anchor="middle" fill="#5b21b6">1</text>
  <rect x="764" y="138" width="30" height="16" rx="3" fill="#ede9fe" stroke="#a78bfa" stroke-width="1.3"/>
  <text x="779" y="150" font-size="10" text-anchor="middle" fill="#5b21b6">5</text>
  <rect x="796" y="138" width="30" height="16" rx="3" fill="#ede9fe" stroke="#a78bfa" stroke-width="1.3"/>
  <text x="811" y="150" font-size="10" text-anchor="middle" fill="#5b21b6">9</text>

  <text x="690" y="176" font-size="10.5" fill="#6b7280">L1</text>
  <line x1="712" y1="172" x2="840" y2="172" stroke="#e9d5ff" stroke-width="1"/>
  <rect x="726" y="164" width="30" height="16" rx="3" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.3"/>
  <text x="741" y="176" font-size="10" text-anchor="middle" fill="#5b21b6">1</text>
  <rect x="764" y="164" width="30" height="16" rx="3" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.3"/>
  <text x="779" y="176" font-size="10" text-anchor="middle" fill="#5b21b6">5</text>
  <rect x="796" y="164" width="30" height="16" rx="3" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.3"/>
  <text x="811" y="176" font-size="10" text-anchor="middle" fill="#5b21b6">9</text>

  <text x="700" y="212" font-size="11.5" fill="#334155">查找 O(log n) 期望，层高掷硬币决定</text>

  <!-- ============ 底部对比条 ============ -->
  <line x1="30" y1="264" x2="830" y2="264" stroke="#e5e7eb" stroke-width="1"/>
  <text x="30" y="290" font-size="12.5" font-weight="600" fill="#1f2937">一句话取舍</text>

  <rect x="30" y="304" width="192" height="86" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="46" y="326" font-size="12" font-weight="600" fill="#2563eb">BST / AVL</text>
  <text x="46" y="347" font-size="11" fill="#475569">AVL 平衡最严格，查询最快</text>
  <text x="46" y="365" font-size="11" fill="#475569">但插入删除旋转成本最高</text>
  <text x="46" y="383" font-size="11" fill="#6b7280">适合读多写少的场景</text>

  <rect x="238" y="304" width="192" height="86" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="254" y="326" font-size="12" font-weight="600" fill="#b45309">红黑树</text>
  <text x="254" y="347" font-size="11" fill="#475569">读写更均衡，工程实现主流</text>
  <text x="254" y="365" font-size="11" fill="#475569">Java TreeMap / C++ map /</text>
  <text x="254" y="383" font-size="11" fill="#6b7280">Linux 内核 CFS 调度器</text>

  <rect x="446" y="304" width="192" height="86" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="462" y="326" font-size="12" font-weight="600" fill="#047857">B / B+ 树</text>
  <text x="462" y="347" font-size="11" fill="#475569">多叉矮胖树，减少磁盘 IO 次数</text>
  <text x="462" y="365" font-size="11" fill="#475569">3~4 层即可索引千万级数据</text>
  <text x="462" y="383" font-size="11" fill="#6b7280">MySQL InnoDB / 文件系统</text>

  <rect x="654" y="304" width="176" height="86" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="670" y="326" font-size="12" font-weight="600" fill="#7c3aed">跳表</text>
  <text x="670" y="347" font-size="11" fill="#475569">链表 + 多级索引，范围查询友好</text>
  <text x="670" y="365" font-size="11" fill="#475569">并发实现简单</text>
  <text x="670" y="383" font-size="11" fill="#6b7280">Redis ZSet / LevelDB MemTable</text>
</svg>
