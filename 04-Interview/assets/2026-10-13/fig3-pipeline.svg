<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="860" height="470" fill="#ffffff"/>
  <text x="30" y="34" font-size="17" font-weight="600" fill="#1f2937">五级流水线、三种冒险与转发机制</text>

  <!-- 五级流水线 -->
  <text x="30" y="70" font-size="13.5" font-weight="600" fill="#1f2937">经典五级流水（MIPS / RISC）</text>

  <g font-size="11">
    <rect x="40" y="84" width="130" height="34" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.3"/>
    <text x="105" y="106" font-size="12" text-anchor="middle" fill="#1e40af">IF 取指</text>
    <text x="105" y="130" font-size="10" text-anchor="middle" fill="#6b7280">Instruction Fetch</text>

    <rect x="180" y="84" width="130" height="34" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1.3"/>
    <text x="245" y="106" font-size="12" text-anchor="middle" fill="#166534">ID 译码</text>
    <text x="245" y="130" font-size="10" text-anchor="middle" fill="#6b7280">Instruction Decode</text>

    <rect x="320" y="84" width="130" height="34" rx="4" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.3"/>
    <text x="385" y="106" font-size="12" text-anchor="middle" fill="#92400e">EX 执行</text>
    <text x="385" y="130" font-size="10" text-anchor="middle" fill="#6b7280">Execute / ALU</text>

    <rect x="460" y="84" width="130" height="34" rx="4" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.3"/>
    <text x="525" y="106" font-size="12" text-anchor="middle" fill="#6d28d9">MEM 访存</text>
    <text x="525" y="130" font-size="10" text-anchor="middle" fill="#6b7280">Memory Access</text>

    <rect x="600" y="84" width="130" height="34" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.3"/>
    <text x="665" y="106" font-size="12" text-anchor="middle" fill="#991b1b">WB 写回</text>
    <text x="665" y="130" font-size="10" text-anchor="middle" fill="#6b7280">Write Back</text>
  </g>

  <path d="M170 101 L178 101" stroke="#9ca3af" stroke-width="1.4"/>
  <path d="M310 101 L318 101" stroke="#9ca3af" stroke-width="1.4"/>
  <path d="M450 101 L458 101" stroke="#9ca3af" stroke-width="1.4"/>
  <path d="M590 101 L598 101" stroke="#9ca3af" stroke-width="1.4"/>

  <!-- 流水线时空图 -->
  <text x="30" y="172" font-size="13.5" font-weight="600" fill="#1f2937">理想流水线时空图：每周期完成一条指令</text>

  <g font-size="10.5" fill="#6b7280">
    <text x="34" y="200">I1</text><text x="34" y="224">I2</text><text x="34" y="248">I3</text>
    <text x="34" y="272">I4</text><text x="34" y="296">I5</text>
  </g>

  <g>
    <!-- 周期刻度 -->
    <g font-size="10" fill="#9ca3af">
      <text x="86" y="186">C1</text><text x="138" y="186">C2</text><text x="190" y="186">C3</text>
      <text x="242" y="186">C4</text><text x="294" y="186">C5</text><text x="346" y="186">C6</text>
      <text x="398" y="186">C7</text><text x="450" y="186">C8</text><text x="502" y="186">C9</text>
    </g>
    <!-- 网格 -->
    <g stroke="#e5e7eb" stroke-width="1">
      <line x1="60" y1="192" x2="60" y2="306"/><line x1="112" y1="192" x2="112" y2="306"/>
      <line x1="164" y1="192" x2="164" y2="306"/><line x1="216" y1="192" x2="216" y2="306"/>
      <line x1="268" y1="192" x2="268" y2="306"/><line x1="320" y1="192" x2="320" y2="306"/>
      <line x1="372" y1="192" x2="372" y2="306"/><line x1="424" y1="192" x2="424" y2="306"/>
      <line x1="476" y1="192" x2="476" y2="306"/><line x1="528" y1="192" x2="528" y2="306"/>
    </g>
    <!-- I1 -->
    <rect x="60" y="192" width="52" height="20" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="86" y="206" font-size="10" text-anchor="middle" fill="#1e40af">IF</text>
    <rect x="112" y="192" width="52" height="20" fill="#dcfce7" stroke="#86efac"/>
    <text x="138" y="206" font-size="10" text-anchor="middle" fill="#166534">ID</text>
    <rect x="164" y="192" width="52" height="20" fill="#fef3c7" stroke="#fbbf24"/>
    <text x="190" y="206" font-size="10" text-anchor="middle" fill="#92400e">EX</text>
    <rect x="216" y="192" width="52" height="20" fill="#f3e8ff" stroke="#c4b5fd"/>
    <text x="242" y="206" font-size="10" text-anchor="middle" fill="#6d28d9">MEM</text>
    <rect x="268" y="192" width="52" height="20" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="294" y="206" font-size="10" text-anchor="middle" fill="#991b1b">WB</text>
    <!-- I2 -->
    <rect x="112" y="216" width="52" height="20" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="138" y="230" font-size="10" text-anchor="middle" fill="#1e40af">IF</text>
    <rect x="164" y="216" width="52" height="20" fill="#dcfce7" stroke="#86efac"/>
    <text x="190" y="230" font-size="10" text-anchor="middle" fill="#166534">ID</text>
    <rect x="216" y="216" width="52" height="20" fill="#fef3c7" stroke="#fbbf24"/>
    <text x="242" y="230" font-size="10" text-anchor="middle" fill="#92400e">EX</text>
    <rect x="268" y="216" width="52" height="20" fill="#f3e8ff" stroke="#c4b5fd"/>
    <text x="294" y="230" font-size="10" text-anchor="middle" fill="#6d28d9">MEM</text>
    <rect x="320" y="216" width="52" height="20" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="346" y="230" font-size="10" text-anchor="middle" fill="#991b1b">WB</text>
    <!-- I3 -->
    <rect x="164" y="240" width="52" height="20" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="190" y="254" font-size="10" text-anchor="middle" fill="#1e40af">IF</text>
    <rect x="216" y="240" width="52" height="20" fill="#dcfce7" stroke="#86efac"/>
    <text x="242" y="254" font-size="10" text-anchor="middle" fill="#166534">ID</text>
    <rect x="268" y="240" width="52" height="20" fill="#fef3c7" stroke="#fbbf24"/>
    <text x="294" y="254" font-size="10" text-anchor="middle" fill="#92400e">EX</text>
    <rect x="320" y="240" width="52" height="20" fill="#f3e8ff" stroke="#c4b5fd"/>
    <text x="346" y="254" font-size="10" text-anchor="middle" fill="#6d28d9">MEM</text>
    <rect x="372" y="240" width="52" height="20" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="398" y="254" font-size="10" text-anchor="middle" fill="#991b1b">WB</text>
    <!-- I4 -->
    <rect x="216" y="264" width="52" height="20" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="242" y="278" font-size="10" text-anchor="middle" fill="#1e40af">IF</text>
    <rect x="268" y="264" width="52" height="20" fill="#dcfce7" stroke="#86efac"/>
    <text x="294" y="278" font-size="10" text-anchor="middle" fill="#166534">ID</text>
    <rect x="320" y="264" width="52" height="20" fill="#fef3c7" stroke="#fbbf24"/>
    <text x="346" y="278" font-size="10" text-anchor="middle" fill="#92400e">EX</text>
    <rect x="372" y="264" width="52" height="20" fill="#f3e8ff" stroke="#c4b5fd"/>
    <text x="398" y="278" font-size="10" text-anchor="middle" fill="#6d28d9">MEM</text>
    <rect x="424" y="264" width="52" height="20" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="450" y="278" font-size="10" text-anchor="middle" fill="#991b1b">WB</text>
  </g>

  <text x="560" y="216" font-size="11.5" fill="#475569">理想吞吐率：</text>
  <text x="560" y="238" font-size="11.5" font-weight="600" fill="#059669">每条指令 1 个周期</text>
  <text x="560" y="262" font-size="11.5" fill="#475569">k 级流水加速比上限 = k</text>
  <text x="560" y="284" font-size="11.5" fill="#6b7280">实际受冒险限制，达不到 k</text>

  <!-- 三种冒险 -->
  <line x1="30" y1="326" x2="830" y2="326" stroke="#e5e7eb"/>
  <text x="30" y="352" font-size="13.5" font-weight="600" fill="#1f2937">三种流水线冒险与对策</text>

  <rect x="30" y="366" width="252" height="90" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="46" y="388" font-size="12.5" font-weight="600" fill="#991b1b">① 结构冒险 Structural</text>
  <text x="46" y="408" font-size="11" fill="#475569">多条指令同时抢同一个硬件部件</text>
  <text x="46" y="426" font-size="11" fill="#475569">例：取值与取数共用一条访存通路</text>
  <text x="46" y="446" font-size="11" fill="#059669">对策：指令/数据 Cache 分离，资源加倍</text>

  <rect x="294" y="366" width="252" height="90" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/>
  <text x="310" y="388" font-size="12.5" font-weight="600" fill="#92400e">② 数据冒险 Data</text>
  <text x="310" y="408" font-size="11" fill="#475569">后一条指令要用前一条还没写回的结果</text>
  <text x="310" y="426" font-size="11" fill="#475569">load-use 是最典型的一类</text>
  <text x="310" y="446" font-size="11" fill="#059669">对策：转发 Forwarding + 必要时插入 1 拍气泡</text>

  <rect x="558" y="366" width="272" height="90" rx="6" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.2"/>
  <text x="574" y="388" font-size="12.5" font-weight="600" fill="#6d28d9">③ 控制冒险 Control</text>
  <text x="574" y="408" font-size="11" fill="#475569">分支指令未判定前，下一条取什么</text>
  <text x="574" y="426" font-size="11" fill="#475569">分支预测错误要清空流水线</text>
  <text x="574" y="446" font-size="11" fill="#059669">对策：分支预测 + 延迟槽 + 预测错误冲刷</text>
</svg>
