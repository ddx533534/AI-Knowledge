<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="800" height="430" fill="#ffffff"/>
  <text x="400" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">select / poll 与 epoll 的事件通知机制对比</text>

  <!-- select/poll -->
  <rect x="30" y="48" width="350" height="300" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.4"/>
  <text x="205" y="72" text-anchor="middle" font-size="13" font-weight="600" fill="#991b1b">select / poll（O(n) 线性遍历）</text>

  <text x="46" y="96" font-size="11" fill="#7f1d1d">每次调用都要把整个 fd 集合从用户态拷贝到内核</text>

  <g font-size="10.5">
    <rect x="46" y="110" width="80" height="24" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="86" y="126" text-anchor="middle" fill="#991b1b">fd1</text>
    <rect x="130" y="110" width="80" height="24" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="170" y="126" text-anchor="middle" fill="#991b1b">fd2</text>
    <rect x="214" y="110" width="80" height="24" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="254" y="126" text-anchor="middle" fill="#991b1b">fd3</text>
    <rect x="298" y="110" width="66" height="24" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="331" y="126" text-anchor="middle" fill="#991b1b">… fdN</text>
  </g>

  <line x1="205" y1="142" x2="205" y2="168" stroke="#dc2626" stroke-width="1.4"/>
  <polygon points="205,172 201,162 209,162" fill="#dc2626"/>
  <text x="215" y="160" font-size="10" fill="#dc2626">内核轮询每一个 fd 的状态</text>

  <g font-size="10.5">
    <rect x="46" y="176" width="80" height="24" fill="#ffffff" stroke="#fca5a5"/>
    <text x="86" y="192" text-anchor="middle" fill="#6b7280">无事件</text>
    <rect x="130" y="176" width="80" height="24" fill="#ffffff" stroke="#fca5a5"/>
    <text x="170" y="192" text-anchor="middle" fill="#6b7280">无事件</text>
    <rect x="214" y="176" width="80" height="24" fill="#d1fae5" stroke="#34d399"/>
    <text x="254" y="192" text-anchor="middle" fill="#065f46" font-weight="600">就绪</text>
    <rect x="298" y="176" width="66" height="24" fill="#ffffff" stroke="#fca5a5"/>
    <text x="331" y="192" text-anchor="middle" fill="#6b7280">无事件</text>
  </g>

  <rect x="46" y="216" width="318" height="118" rx="4" fill="#ffffff" stroke="#fecaca"/>
  <text x="58" y="236" font-size="10.5" fill="#7f1d1d" font-weight="600">局限：</text>
  <text x="58" y="256" font-size="10" fill="#7f1d1d">• 时间复杂度 O(n)，连接数越多越慢</text>
  <text x="58" y="274" font-size="10" fill="#7f1d1d">• select 有 FD_SETSIZE 上限（通常 1024）</text>
  <text x="58" y="292" font-size="10" fill="#7f1d1d">• 每次调用全量拷贝 fd 集合</text>
  <text x="58" y="310" font-size="10" fill="#7f1d1d">• 需要用户态再次遍历找出就绪的 fd</text>
  <text x="58" y="328" font-size="10" fill="#059669">• 优点：可移植性好（POSIX 广泛支持）</text>

  <!-- epoll -->
  <rect x="420" y="48" width="350" height="300" rx="6" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.4"/>
  <text x="595" y="72" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">epoll（O(1) 就绪回调）</text>

  <text x="436" y="96" font-size="11" fill="#166534">epoll_ctl 注册时拷贝一次，后续复用</text>

  <rect x="436" y="108" width="130" height="52" rx="4" fill="#dcfce7" stroke="#86efac"/>
  <text x="501" y="128" text-anchor="middle" font-size="10.5" fill="#166534">红黑树</text>
  <text x="501" y="146" text-anchor="middle" font-size="10" fill="#15803d">管理所有注册的 fd</text>

  <rect x="600" y="108" width="154" height="52" rx="4" fill="#bbf7d0" stroke="#4ade80"/>
  <text x="677" y="128" text-anchor="middle" font-size="10.5" fill="#166534">就绪链表</text>
  <text x="677" y="146" text-anchor="middle" font-size="10" fill="#15803d">内核回调时挂入</text>

  <line x1="566" y1="134" x2="596" y2="134" stroke="#059669" stroke-width="1.4"/>
  <polygon points="600,134 590,130 590,138" fill="#059669"/>
  <text x="581" y="126" text-anchor="middle" font-size="9" fill="#059669">事件</text>

  <line x1="595" y1="164" x2="595" y2="188" stroke="#059669" stroke-width="1.4"/>
  <polygon points="595,192 591,182 599,182" fill="#059669"/>
  <text x="605" y="180" font-size="10" fill="#059669">epoll_wait 直接返回就绪链表</text>

  <g font-size="10.5">
    <rect x="436" y="196" width="100" height="24" fill="#d1fae5" stroke="#34d399"/>
    <text x="486" y="212" text-anchor="middle" fill="#065f46" font-weight="600">fd3 就绪</text>
    <rect x="546" y="196" width="100" height="24" fill="#d1fae5" stroke="#34d399"/>
    <text x="596" y="212" text-anchor="middle" fill="#065f46" font-weight="600">fd7 就绪</text>
    <text x="662" y="212" font-size="10" fill="#6b7280">（只返回这些）</text>
  </g>

  <rect x="436" y="232" width="318" height="102" rx="4" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="448" y="252" font-size="10.5" fill="#166534" font-weight="600">优势：</text>
  <text x="448" y="272" font-size="10" fill="#166534">• 只处理就绪 fd，不受总连接数影响</text>
  <text x="448" y="290" font-size="10" fill="#166534">• 无连接数上限，仅受系统 fd 限制</text>
  <text x="448" y="308" font-size="10" fill="#166534">• 支持 LT 和 ET 两种触发模式</text>
  <text x="448" y="326" font-size="10" fill="#dc2626">• Linux 特有，不可移植</text>

  <!-- 底部 -->
  <rect x="30" y="362" width="740" height="56" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="46" y="382" font-size="11" font-weight="600" fill="#1e40af">选型不是无脑选 epoll：</text>
  <text x="46" y="400" font-size="10.5" fill="#1e40af">连接数少且全部活跃时，select/poll 可能反而更快（epoll 的回调机制有额外开销）。Redis、Nginx 选 epoll 是因为场景是「连接数巨大但活跃比例低」。</text>
</svg>
