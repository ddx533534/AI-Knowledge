<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="800" height="380" fill="#ffffff"/>
  <text x="400" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">进程五态模型与状态迁移</text>

  <!-- 五个状态 -->
  <g font-size="12.5">
    <rect x="40" y="140" width="120" height="52" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
    <text x="100" y="172" text-anchor="middle" font-weight="600" fill="#334155">新建 New</text>

    <rect x="210" y="70" width="120" height="52" rx="6" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.3"/>
    <text x="270" y="102" text-anchor="middle" font-weight="600" fill="#1e40af">就绪 Ready</text>

    <rect x="400" y="70" width="120" height="52" rx="6" fill="#d1fae5" stroke="#34d399" stroke-width="1.3"/>
    <text x="460" y="102" text-anchor="middle" font-weight="600" fill="#065f46">运行 Running</text>

    <rect x="400" y="215" width="120" height="52" rx="6" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.3"/>
    <text x="460" y="247" text-anchor="middle" font-weight="600" fill="#92400e">阻塞 Blocked</text>

    <rect x="640" y="140" width="120" height="52" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.3"/>
    <text x="700" y="172" text-anchor="middle" font-weight="600" fill="#991b1b">终止 Terminated</text>
  </g>

  <!-- 箭头 -->
  <g stroke="#6b7280" stroke-width="1.3" fill="#6b7280" font-size="10">
    <line x1="160" y1="160" x2="206" y2="108"/>
    <polygon points="210,104 200,108 206,114"/>
    <text x="150" y="120" fill="#4b5563">创建</text>

    <line x1="330" y1="90" x2="396" y2="90"/>
    <polygon points="400,90 390,86 390,94"/>
    <text x="363" y="82" text-anchor="middle" fill="#4b5563">调度</text>

    <line x1="400" y1="108" x2="334" y2="108"/>
    <polygon points="330,108 340,104 340,112"/>
    <text x="367" y="126" text-anchor="middle" fill="#4b5563">时间片到 / 抢占</text>

    <line x1="440" y1="122" x2="440" y2="211"/>
    <polygon points="440,215 436,205 444,205"/>
    <text x="432" y="172" text-anchor="end" fill="#4b5563">等待 IO / 事件（阻塞）</text>

    <line x1="480" y1="215" x2="480" y2="126"/>
    <polygon points="480,122 476,132 484,132"/>
    <text x="488" y="175" fill="#4b5563">事件完成 → 回就绪队列</text>

    <line x1="520" y1="90" x2="636" y2="152"/>
    <polygon points="640,155 631,148 627,155"/>
    <text x="600" y="108" fill="#4b5563">结束</text>
  </g>

  <!-- 关键说明 -->
  <rect x="40" y="292" width="720" height="72" rx="4" fill="#fef9c3" stroke="#fde047"/>
  <text x="56" y="312" font-size="11.5" fill="#713f12" font-weight="600">关键点：</text>
  <text x="56" y="331" font-size="10.5" fill="#713f12">• 阻塞不能直接到运行，必须先回到就绪队列排队（等待被再次调度）。</text>
  <text x="56" y="349" font-size="10.5" fill="#713f12">• 运行 → 就绪是被动（时间片用完或被更高优先级抢占）；运行 → 阻塞是主动（进程自己发起 IO / 等锁）。</text>
</svg>
