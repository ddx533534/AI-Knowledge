<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 450" width="860" height="450" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="860" height="450" fill="#ffffff"/>
  <text x="30" y="34" font-size="17" font-weight="600" fill="#1f2937">存储层次金字塔：容量、速度与成本的三角权衡</text>

  <!-- 金字塔 -->
  <polygon points="430,58 250,340 610,340" fill="none" stroke="#e5e7eb" stroke-width="1"/>

  <!-- 第1层 寄存器 -->
  <polygon points="430,66 406,110 454,110" fill="#fee2e2" stroke="#f87171" stroke-width="1.3"/>
  <text x="430" y="102" font-size="9.5" text-anchor="middle" fill="#991b1b">寄存器</text>

  <!-- 第2层 L1 -->
  <polygon points="406,110 454,110 490,158 370,158" fill="#ffedd5" stroke="#fb923c" stroke-width="1.3"/>
  <text x="430" y="140" font-size="10" text-anchor="middle" fill="#9a3412">L1 Cache</text>

  <!-- 第3层 L2 -->
  <polygon points="370,158 490,158 526,206 334,206" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.3"/>
  <text x="430" y="188" font-size="10" text-anchor="middle" fill="#92400e">L2 Cache</text>

  <!-- 第4层 L3 -->
  <polygon points="334,206 526,206 562,254 298,254" fill="#fef9c3" stroke="#facc15" stroke-width="1.3"/>
  <text x="430" y="236" font-size="10" text-anchor="middle" fill="#854d0e">L3 Cache（多核共享）</text>

  <!-- 第5层 内存 -->
  <polygon points="298,254 562,254 598,302 262,302" fill="#dcfce7" stroke="#4ade80" stroke-width="1.3"/>
  <text x="430" y="284" font-size="11" text-anchor="middle" fill="#166534">主存 DRAM 内存</text>

  <!-- 第6层 外存 -->
  <polygon points="262,302 598,302 610,340 250,340" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.3"/>
  <text x="430" y="328" font-size="11" text-anchor="middle" fill="#1e40af">SSD / 磁盘 / 远程存储</text>

  <!-- 左侧：容量 -->
  <line x1="200" y1="70" x2="200" y2="336" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="196" y="76" font-size="12" text-anchor="end" font-weight="600" fill="#6b7280">容量 ↑</text>
  <path d="M200 60 L200 40" stroke="#9ca3af" stroke-width="1.2"/>
  <path d="M200 66 l-4 -7 h8 z" fill="#9ca3af" transform="translate(0,4)"/>
  <text x="196" y="344" font-size="11" text-anchor="end" fill="#9ca3af">小</text>

  <!-- 右侧：速度/成本轴 -->
  <line x1="660" y1="70" x2="660" y2="336" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="666" y="76" font-size="12" font-weight="600" fill="#6b7280">访问速度 &amp; 单位成本 ↑</text>

  <!-- 右侧标注表 -->
  <g font-size="11">
    <text x="656" y="106" text-anchor="end" fill="#991b1b">~0.3 ns</text>
    <text x="656" y="152" text-anchor="end" fill="#9a3412">~1 ns</text>
    <text x="656" y="198" text-anchor="end" fill="#92400e">~4 ns</text>
    <text x="656" y="244" text-anchor="end" fill="#854d0e">~15 ns</text>
    <text x="656" y="292" text-anchor="end" fill="#166534">~100 ns</text>
    <text x="656" y="332" text-anchor="end" fill="#1e40af">~10~100 μs</text>
  </g>

  <!-- 底部结论 -->
  <line x1="30" y1="364" x2="830" y2="364" stroke="#e5e7eb" stroke-width="1"/>
  <text x="30" y="390" font-size="13" font-weight="600" fill="#1f2937">核心结论：CPU 与内存之间有两个数量级的速度差，这是 Cache 存在的全部理由</text>
  <text x="30" y="413" font-size="11.5" fill="#475569">平均访问时间 AMAT = 命中时间 + 缺失率 × 缺失代价。每提升 1% 的命中率，整体性能都可能明显改善。</text>
  <text x="30" y="435" font-size="11.5" fill="#475569">局部性原理是全部优化的地基：时间局部性（刚访问的还会被访问）+ 空间局部性（相邻的也会被访问）。</text>
</svg>
