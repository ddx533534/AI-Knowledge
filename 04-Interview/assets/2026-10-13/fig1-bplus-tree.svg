<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" width="860" height="460" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="860" height="460" fill="#ffffff"/>
  <text x="30" y="34" font-size="17" font-weight="600" fill="#1f2937">MySQL InnoDB B+ 树索引：为什么它是磁盘场景的最优解</text>

  <!-- B+ tree structure -->
  <text x="30" y="66" font-size="13" font-weight="600" fill="#047857">① 结构：非叶节点只存键，数据全部落在叶子层</text>

  <!-- 根节点 -->
  <rect x="330" y="80" width="180" height="32" rx="4" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="420" y="101" font-size="12" text-anchor="middle" fill="#065f46">10 | 20 | 30</text>
  <text x="526" y="101" font-size="10.5" fill="#9ca3af">← 根节点（常驻内存）</text>

  <!-- 连线 -->
  <line x1="360" y1="112" x2="180" y2="150" stroke="#cbd5e1" stroke-width="1.4"/>
  <line x1="400" y1="112" x2="330" y2="150" stroke="#cbd5e1" stroke-width="1.4"/>
  <line x1="450" y1="112" x2="510" y2="150" stroke="#cbd5e1" stroke-width="1.4"/>
  <line x1="490" y1="112" x2="660" y2="150" stroke="#cbd5e1" stroke-width="1.4"/>

  <!-- 中间层 -->
  <rect x="120" y="150" width="120" height="30" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1.4"/>
  <text x="180" y="170" font-size="11.5" text-anchor="middle" fill="#166534">&lt; 10</text>
  <rect x="270" y="150" width="120" height="30" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1.4"/>
  <text x="330" y="170" font-size="11.5" text-anchor="middle" fill="#166534">10 ~ 20</text>
  <rect x="450" y="150" width="120" height="30" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1.4"/>
  <text x="510" y="170" font-size="11.5" text-anchor="middle" fill="#166534">20 ~ 30</text>
  <rect x="600" y="150" width="120" height="30" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1.4"/>
  <text x="660" y="170" font-size="11.5" text-anchor="middle" fill="#166534">&#8805; 30</text>

  <!-- 叶子层连线 -->
  <g stroke="#cbd5e1" stroke-width="1.3">
    <line x1="165" y1="180" x2="130" y2="216"/>
    <line x1="195" y1="180" x2="230" y2="216"/>
    <line x1="315" y1="180" x2="280" y2="216"/>
    <line x1="345" y1="180" x2="380" y2="216"/>
    <line x1="495" y1="180" x2="460" y2="216"/>
    <line x1="525" y1="180" x2="560" y2="216"/>
    <line x1="645" y1="180" x2="610" y2="216"/>
    <line x1="675" y1="180" x2="710" y2="216"/>
  </g>

  <!-- 叶子层 -->
  <g font-size="11" text-anchor="middle">
    <rect x="80" y="216" width="100" height="34" rx="4" fill="#d1fae5" stroke="#34d399" stroke-width="1.5"/>
    <text x="130" y="231" fill="#065f46" font-weight="600">3 · 5 · 8</text>
    <text x="130" y="245" fill="#047857" font-size="9.5">row / pk</text>

    <rect x="230" y="216" width="100" height="34" rx="4" fill="#d1fae5" stroke="#34d399" stroke-width="1.5"/>
    <text x="280" y="231" fill="#065f46" font-weight="600">10·12·15</text>
    <text x="280" y="245" fill="#047857" font-size="9.5">row / pk</text>

    <rect x="380" y="216" width="100" height="34" rx="4" fill="#d1fae5" stroke="#34d399" stroke-width="1.5"/>
    <text x="430" y="231" fill="#065f46" font-weight="600">20·22·25</text>
    <text x="430" y="245" fill="#047857" font-size="9.5">row / pk</text>

    <rect x="530" y="216" width="100" height="34" rx="4" fill="#d1fae5" stroke="#34d399" stroke-width="1.5"/>
    <text x="580" y="231" fill="#065f46" font-weight="600">30·33·35</text>
    <text x="580" y="245" fill="#047857" font-size="9.5">row / pk</text>

    <rect x="680" y="216" width="100" height="34" rx="4" fill="#d1fae5" stroke="#34d399" stroke-width="1.5"/>
    <text x="730" y="231" fill="#065f46" font-weight="600">40·42·45</text>
    <text x="730" y="245" fill="#047857" font-size="9.5">row / pk</text>
  </g>

  <!-- 叶子链表 -->
  <g stroke="#059669" stroke-width="1.6" fill="#059669">
    <path d="M182 233 L228 233"/><path d="M224 233 l-6 -3.5 v7 z"/>
    <path d="M332 233 L378 233"/><path d="M374 233 l-6 -3.5 v7 z"/>
    <path d="M482 233 L528 233"/><path d="M524 233 l-6 -3.5 v7 z"/>
    <path d="M632 233 L678 233"/><path d="M674 233 l-6 -3.5 v7 z"/>
  </g>
  <text x="440" y="272" font-size="11" text-anchor="middle" fill="#047857">叶子节点用双向链表串联 → 范围查询顺序扫描，不用回树</text>
  <text x="440" y="290" font-size="11" text-anchor="middle" fill="#6b7280">ORDER BY / BETWEEN / &gt;= 全部走这条链表，这是 B+ 树胜过 B 树的关键</text>

  <!-- 底部三个对比 -->
  <line x1="30" y1="312" x2="830" y2="312" stroke="#e5e7eb"/>

  <text x="30" y="338" font-size="13" font-weight="600" fill="#1f2937">② 为什么不用其他结构做索引</text>

  <rect x="30" y="352" width="192" height="94" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="46" y="374" font-size="12" font-weight="600" fill="#dc2626">哈希表</text>
  <text x="46" y="395" font-size="10.5" fill="#475569">等值查询 O(1)，很强</text>
  <text x="46" y="413" font-size="10.5" fill="#475569">但不支持范围查询，</text>
  <text x="46" y="431" font-size="10.5" fill="#6b7280">也无法利用最左前缀</text>

  <rect x="238" y="352" width="192" height="94" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="254" y="374" font-size="12" font-weight="600" fill="#dc2626">二叉树 / 红黑树</text>
  <text x="254" y="395" font-size="10.5" fill="#475569">树太高，千万级数据</text>
  <text x="254" y="413" font-size="10.5" fill="#475569">有 20+ 层，每层一次</text>
  <text x="254" y="431" font-size="10.5" fill="#6b7280">磁盘 IO，慢到不可用</text>

  <rect x="446" y="352" width="192" height="94" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="462" y="374" font-size="12" font-weight="600" fill="#d97706">B 树</text>
  <text x="462" y="395" font-size="10.5" fill="#475569">非叶也存数据，</text>
  <text x="462" y="413" font-size="10.5" fill="#475569">单节点扇出小、树更高，</text>
  <text x="462" y="431" font-size="10.5" fill="#6b7280">范围查询要反复回到上层</text>

  <rect x="654" y="352" width="176" height="94" rx="6" fill="#ecfdf5" stroke="#34d399" stroke-width="1.4"/>
  <text x="670" y="374" font-size="12" font-weight="600" fill="#047857">B+ 树 ✓</text>
  <text x="670" y="395" font-size="10.5" fill="#166534">扇出大 → 树矮，</text>
  <text x="670" y="413" font-size="10.5" fill="#166534">3~4 层索引千万行，</text>
  <text x="670" y="431" font-size="10.5" fill="#047857">范围查询走叶子链表</text>
</svg>
