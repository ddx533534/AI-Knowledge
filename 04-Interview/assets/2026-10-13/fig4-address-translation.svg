<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="800" height="430" fill="#ffffff"/>
  <text x="400" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">虚拟地址翻译：TLB → 多级页表 → 物理地址</text>

  <!-- 虚拟地址 -->
  <rect x="30" y="50" width="740" height="46" rx="5" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="46" y="70" font-size="11.5" font-weight="600" fill="#1e40af">虚拟地址（x86-64，48 位有效）</text>
  <g font-size="10.5">
    <rect x="330" y="58" width="80" height="30" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="370" y="77" text-anchor="middle" fill="#1e40af">PGD 9位</text>
    <rect x="412" y="58" width="80" height="30" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="452" y="77" text-anchor="middle" fill="#1e40af">PUD 9位</text>
    <rect x="494" y="58" width="80" height="30" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="534" y="77" text-anchor="middle" fill="#1e40af">PMD 9位</text>
    <rect x="576" y="58" width="80" height="30" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="616" y="77" text-anchor="middle" fill="#1e40af">PTE 9位</text>
    <rect x="658" y="58" width="100" height="30" fill="#d1fae5" stroke="#34d399"/>
    <text x="708" y="77" text-anchor="middle" fill="#065f46">页内偏移 12位</text>
  </g>

  <!-- TLB -->
  <rect x="30" y="118" width="250" height="86" rx="6" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.4"/>
  <text x="155" y="140" text-anchor="middle" font-size="12.5" font-weight="600" fill="#92400e">TLB（快表）</text>
  <text x="155" y="160" text-anchor="middle" font-size="10.5" fill="#78350f">MMU 内部缓存最近用过的页表项</text>
  <text x="155" y="178" text-anchor="middle" font-size="10.5" fill="#78350f">命中率通常 &gt; 99%</text>
  <text x="155" y="196" text-anchor="middle" font-size="10.5" fill="#78350f">命中 → 一次访存直接得物理地址</text>

  <!-- 多级页表 -->
  <rect x="310" y="118" width="300" height="86" rx="6" fill="#f3e8ff" stroke="#d8b4fe" stroke-width="1.4"/>
  <text x="460" y="140" text-anchor="middle" font-size="12.5" font-weight="600" fill="#6b21a8">多级页表（按需分配）</text>
  <text x="460" y="160" text-anchor="middle" font-size="10.5" fill="#581c87">4 级树状结构，未用到的层级不分配物理页</text>
  <text x="460" y="178" text-anchor="middle" font-size="10.5" fill="#581c87">稀疏地址空间只为实际触及部分付费</text>
  <text x="460" y="196" text-anchor="middle" font-size="10.5" fill="#581c87">TLB 未命中 → 走页表遍历（多次访存）</text>

  <!-- 物理地址 -->
  <rect x="640" y="118" width="130" height="86" rx="6" fill="#d1fae5" stroke="#34d399" stroke-width="1.4"/>
  <text x="705" y="146" text-anchor="middle" font-size="12.5" font-weight="600" fill="#065f46">物理地址</text>
  <text x="705" y="168" text-anchor="middle" font-size="10.5" fill="#065f46">物理页框号</text>
  <text x="705" y="186" text-anchor="middle" font-size="10.5" fill="#065f46">+ 页内偏移</text>

  <g stroke="#6b7280" stroke-width="1.3" fill="#6b7280">
    <line x1="280" y1="161" x2="306" y2="161"/>
    <polygon points="310,161 300,157 300,165"/>
    <line x1="610" y1="161" x2="636" y2="161"/>
    <polygon points="640,161 630,157 630,165"/>
  </g>
  <text x="293" y="152" text-anchor="middle" font-size="9.5" fill="#dc2626">未命中</text>

  <!-- 缺页 -->
  <rect x="30" y="222" width="740" height="76" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.4"/>
  <text x="46" y="244" font-size="12.5" font-weight="600" fill="#991b1b">缺页中断（Page Fault）——页不在物理内存</text>
  <text x="46" y="264" font-size="10.5" fill="#7f1d1d">① 检查虚拟地址合法性 → ② 找空闲页框（没有则置换） → ③ 脏页写回磁盘 → ④ 从磁盘读入目标页</text>
  <text x="46" y="284" font-size="10.5" fill="#7f1d1d">⑤ 更新页表项标记存在 → ⑥ 返回用户态，重新执行引发缺页的那条指令</text>

  <!-- 辨析表 -->
  <rect x="30" y="314" width="740" height="102" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="46" y="334" font-size="12" font-weight="600" fill="#334155">本质辨析（高频考点）</text>
  <line x1="46" y1="344" x2="754" y2="344" stroke="#cbd5e1"/>
  <g font-size="10.5">
    <text x="46" y="362" font-weight="600" fill="#1e40af">TLB Miss</text>
    <text x="160" y="362" fill="#475569">页表项不在 TLB，但页在内存里 → 硬件走页表遍历，填回 TLB（开销小）</text>
    <text x="46" y="386" font-weight="600" fill="#991b1b">Page Fault</text>
    <text x="160" y="386" fill="#475569">页不在物理内存 → 陷入内核，从磁盘调入，可能触发页面置换（开销大）</text>
    <text x="46" y="408" font-size="10" fill="#6b7280">顺序访问对每一层都友好：Cache 预取、TLB 覆盖、硬件预取器、readahead 全都奖励连续性。</text>
  </g>
</svg>
