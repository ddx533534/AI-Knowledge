<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="860" height="420" fill="#ffffff"/>
  <text x="30" y="34" font-size="17" font-weight="600" fill="#1f2937">动态规划四步法：以「最长递增子序列」为例</text>

  <!-- 四步卡片 -->
  <rect x="30" y="56" width="190" height="94" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.3"/>
  <text x="46" y="80" font-size="12.5" font-weight="600" fill="#1e40af">① 定义状态</text>
  <text x="46" y="102" font-size="11" fill="#334155">dp[i] 表示以 nums[i]</text>
  <text x="46" y="120" font-size="11" fill="#334155">结尾的最长递增</text>
  <text x="46" y="138" font-size="11" fill="#334155">子序列长度</text>

  <rect x="236" y="56" width="190" height="94" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.3"/>
  <text x="252" y="80" font-size="12.5" font-weight="600" fill="#166534">② 找出转移</text>
  <text x="252" y="102" font-size="11" fill="#334155">dp[i] = max(dp[j]) + 1</text>
  <text x="252" y="120" font-size="11" fill="#334155">要求 j &lt; i 且</text>
  <text x="252" y="138" font-size="11" fill="#334155">nums[j] &lt; nums[i]</text>

  <rect x="442" y="56" width="190" height="94" rx="6" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.3"/>
  <text x="458" y="80" font-size="12.5" font-weight="600" fill="#92400e">③ 确定初始</text>
  <text x="458" y="102" font-size="11" fill="#334155">dp[i] = 1</text>
  <text x="458" y="120" font-size="11" fill="#334155">每个元素自身就是</text>
  <text x="458" y="138" font-size="11" fill="#334155">长度 1 的子序列</text>

  <rect x="648" y="56" width="182" height="94" rx="6" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.3"/>
  <text x="664" y="80" font-size="12.5" font-weight="600" fill="#6d28d9">④ 递推求答案</text>
  <text x="664" y="102" font-size="11" fill="#334155">从小到大填表，</text>
  <text x="664" y="120" font-size="11" fill="#334155">答案是 max(dp[0..n-1])</text>
  <text x="664" y="138" font-size="11" fill="#334155">而不是 dp[n-1]</text>

  <!-- 填表过程 -->
  <text x="30" y="188" font-size="13" font-weight="600" fill="#1f2937">填表过程（nums = [10, 9, 2, 5, 3, 7, 101, 18]）</text>

  <g font-size="11">
    <text x="30" y="218" fill="#6b7280">index</text>
    <text x="30" y="248" fill="#6b7280">nums</text>
    <text x="30" y="278" fill="#6b7280">dp</text>
  </g>

  <g font-size="12" text-anchor="middle">
    <!-- 表头 -->
    <g fill="#334155" font-size="11">
      <text x="110" y="218">0</text><text x="176" y="218">1</text><text x="242" y="218">2</text>
      <text x="308" y="218">3</text><text x="374" y="218">4</text><text x="440" y="218">5</text>
      <text x="506" y="218">6</text><text x="572" y="218">7</text>
    </g>
    <!-- nums -->
    <rect x="88" y="230" width="44" height="24" rx="3" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="110" y="247" fill="#334155">10</text>
    <rect x="154" y="230" width="44" height="24" rx="3" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="176" y="247" fill="#334155">9</text>
    <rect x="220" y="230" width="44" height="24" rx="3" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="242" y="247" fill="#334155">2</text>
    <rect x="286" y="230" width="44" height="24" rx="3" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="308" y="247" fill="#334155">5</text>
    <rect x="352" y="230" width="44" height="24" rx="3" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="374" y="247" fill="#334155">3</text>
    <rect x="418" y="230" width="44" height="24" rx="3" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="440" y="247" fill="#334155">7</text>
    <rect x="484" y="230" width="44" height="24" rx="3" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="506" y="247" fill="#334155">101</text>
    <rect x="550" y="230" width="44" height="24" rx="3" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="572" y="247" fill="#334155">18</text>
    <!-- dp -->
    <rect x="88" y="260" width="44" height="24" rx="3" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="110" y="277" fill="#1e40af" font-weight="600">1</text>
    <rect x="154" y="260" width="44" height="24" rx="3" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="176" y="277" fill="#1e40af" font-weight="600">1</text>
    <rect x="220" y="260" width="44" height="24" rx="3" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="242" y="277" fill="#1e40af" font-weight="600">1</text>
    <rect x="286" y="260" width="44" height="24" rx="3" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="308" y="277" fill="#1e40af" font-weight="600">2</text>
    <rect x="352" y="260" width="44" height="24" rx="3" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="374" y="277" fill="#1e40af" font-weight="600">2</text>
    <rect x="418" y="260" width="44" height="24" rx="3" fill="#bfdbfe" stroke="#3b82f6"/>
    <text x="440" y="277" fill="#1e40af" font-weight="600">3</text>
    <rect x="484" y="260" width="44" height="24" rx="3" fill="#93c5fd" stroke="#2563eb"/>
    <text x="506" y="277" fill="#1e3a8a" font-weight="600">4</text>
    <rect x="550" y="260" width="44" height="24" rx="3" fill="#93c5fd" stroke="#2563eb"/>
    <text x="572" y="277" fill="#1e3a8a" font-weight="600">4</text>
  </g>

  <!-- 箭头说明 -->
  <path d="M242 300 L300 300" stroke="#059669" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="248" y="314" font-size="10.5" fill="#059669">2 &lt; 5，可接在后面</text>
  <path d="M176 322 L432 322" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="290" y="336" font-size="10.5" fill="#dc2626">9 与 10 比 nums[5]=7 大，不能接，dp 保持 1 的影响</text>

  <line x1="30" y1="352" x2="830" y2="352" stroke="#e5e7eb"/>

  <text x="30" y="378" font-size="12.5" font-weight="600" fill="#1f2937">识别信号 → 用 DP 的四个特征</text>
  <text x="30" y="400" font-size="11.5" fill="#475569">① 求最值（最大/最小/最长/最短/能否）② 有重叠子问题 ③ 有最优子结构 ④ 无后效性</text>
  <text x="30" y="416" font-size="11.5" fill="#475569">优化方向：滚动数组省空间 → 单调栈/二分把 O(n²) 降到 O(n log n)，如 LIS 的 patient sorting 解法</text>
</svg>
