<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="800" height="420" fill="#ffffff"/>
  <text x="400" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">HTTP/1.1、HTTP/2、HTTP/3 的队头阻塞与多路复用</text>

  <!-- 三列 -->
  <g>
    <!-- HTTP/1.1 -->
    <rect x="30" y="52" width="230" height="330" rx="6" fill="#fafafa" stroke="#e5e7eb"/>
    <text x="145" y="74" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2937">HTTP/1.1（TCP）</text>
    <text x="145" y="92" text-anchor="middle" font-size="10.5" fill="#6b7280">串行请求，前阻塞后</text>
    <rect x="50" y="106" width="190" height="26" rx="3" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="145" y="123" text-anchor="middle" font-size="10.5" fill="#1e40af">请求1 处理中</text>
    <rect x="50" y="138" width="190" height="26" rx="3" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="145" y="155" text-anchor="middle" font-size="10.5" fill="#991b1b">请求2 等待中</text>
    <rect x="50" y="170" width="190" height="26" rx="3" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="145" y="187" text-anchor="middle" font-size="10.5" fill="#991b1b">请求3 等待中</text>
    <rect x="50" y="212" width="190" height="70" rx="3" fill="#fffbeb" stroke="#fde047"/>
    <text x="60" y="232" font-size="10" fill="#713f12">应用层 HOL：</text>
    <text x="60" y="248" font-size="10" fill="#713f12">同一连接请求串行，</text>
    <text x="60" y="264" font-size="10" fill="#713f12">前面的不回来后面全等</text>

    <!-- HTTP/2 -->
    <rect x="285" y="52" width="230" height="330" rx="6" fill="#fafafa" stroke="#e5e7eb"/>
    <text x="400" y="74" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2937">HTTP/2（TCP）</text>
    <text x="400" y="92" text-anchor="middle" font-size="10.5" fill="#6b7280">单连接多路复用</text>
    <rect x="305" y="106" width="190" height="26" rx="3" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="400" y="123" text-anchor="middle" font-size="10.5" fill="#1e40af">流1 ━━━━━</text>
    <rect x="305" y="138" width="190" height="26" rx="3" fill="#d1fae5" stroke="#34d399"/>
    <text x="400" y="155" text-anchor="middle" font-size="10.5" fill="#065f46">流2 ━━━━━（并行）</text>
    <rect x="305" y="170" width="190" height="26" rx="3" fill="#f3e8ff" stroke="#d8b4fe"/>
    <text x="400" y="187" text-anchor="middle" font-size="10.5" fill="#6b21a8">流3 ━━━━━（并行）</text>
    <rect x="305" y="212" width="190" height="70" rx="3" fill="#fffbeb" stroke="#fde047"/>
    <text x="315" y="232" font-size="10" fill="#713f12">解决应用层 HOL，</text>
    <text x="315" y="248" font-size="10" fill="#713f12">但 TCP 层仍有 HOL：</text>
    <text x="315" y="264" font-size="10" fill="#713f12">丢一个包全连接卡住</text>

    <!-- HTTP/3 -->
    <rect x="540" y="52" width="230" height="330" rx="6" fill="#fafafa" stroke="#e5e7eb"/>
    <text x="655" y="74" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2937">HTTP/3（QUIC/UDP）</text>
    <text x="655" y="92" text-anchor="middle" font-size="10.5" fill="#6b7280">流级独立，互不影响</text>
    <rect x="560" y="106" width="190" height="26" rx="3" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="655" y="123" text-anchor="middle" font-size="10.5" fill="#991b1b">流1 丢包 → 仅此流等</text>
    <rect x="560" y="138" width="190" height="26" rx="3" fill="#d1fae5" stroke="#34d399"/>
    <text x="655" y="155" text-anchor="middle" font-size="10.5" fill="#065f46">流2 继续传输</text>
    <rect x="560" y="170" width="190" height="26" rx="3" fill="#d1fae5" stroke="#34d399"/>
    <text x="655" y="187" text-anchor="middle" font-size="10.5" fill="#065f46">流3 继续传输</text>
    <rect x="560" y="212" width="190" height="70" rx="3" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="570" y="232" font-size="10" fill="#065f46">1-RTT 建连（恢复 0-RTT）</text>
    <text x="570" y="248" font-size="10" fill="#065f46">Connection ID 支持连接迁移</text>
    <text x="570" y="264" font-size="10" fill="#065f46">彻底消除传输层 HOL</text>
  </g>

  <!-- 底部结论 -->
  <rect x="30" y="392" width="740" height="22" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="400" y="407" text-anchor="middle" font-size="11" fill="#1e40af">关键区分：HTTP/2 解决的是「应用层」队头阻塞，HTTP/3 才解决「传输层」队头阻塞</text>
</svg>
