<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="800" height="400" fill="#ffffff"/>
  <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">TCP 三次握手时序与状态迁移</text>

  <!-- 客户端与服务端竖线 -->
  <line x1="180" y1="70" x2="180" y2="360" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="4 3"/>
  <line x1="620" y1="70" x2="620" y2="360" stroke="#059669" stroke-width="1.6" stroke-dasharray="4 3"/>
  <rect x="105" y="46" width="150" height="26" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="180" y="64" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e40af">客户端 Client</text>
  <rect x="545" y="46" width="150" height="26" fill="#d1fae5" stroke="#34d399"/>
  <text x="620" y="64" text-anchor="middle" font-size="12.5" font-weight="600" fill="#065f46">服务端 Server</text>

  <!-- 第一次握手 -->
  <line x1="180" y1="112" x2="620" y2="112" stroke="#2563eb" stroke-width="1.6"/>
  <polygon points="620,112 610,107 610,117" fill="#2563eb"/>
  <text x="400" y="105" text-anchor="middle" font-size="12" fill="#1f2937">① SYN=1, seq=x</text>
  <!-- 第二次握手 -->
  <line x1="620" y1="180" x2="180" y2="180" stroke="#059669" stroke-width="1.6"/>
  <polygon points="180,180 190,175 190,185" fill="#059669"/>
  <text x="400" y="173" text-anchor="middle" font-size="12" fill="#1f2937">② SYN=1, ACK=1, seq=y, ack=x+1</text>
  <!-- 第三次握手 -->
  <line x1="180" y1="248" x2="620" y2="248" stroke="#2563eb" stroke-width="1.6"/>
  <polygon points="620,248 610,243 610,253" fill="#2563eb"/>
  <text x="400" y="241" text-anchor="middle" font-size="12" fill="#1f2937">③ ACK=1, seq=x+1, ack=y+1</text>

  <!-- 状态标注 -->
  <g font-size="11">
    <rect x="30" y="100" width="112" height="24" rx="3" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="86" y="116" text-anchor="middle" fill="#475569">SYN_SENT</text>
    <rect x="30" y="168" width="112" height="24" rx="3" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="86" y="184" text-anchor="middle" fill="#475569">SYN_SENT</text>
    <rect x="658" y="168" width="112" height="24" rx="3" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="714" y="184" text-anchor="middle" fill="#475569">SYN_RCVD</text>
    <rect x="658" y="100" width="112" height="24" rx="3" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="714" y="116" text-anchor="middle" fill="#475569">LISTEN</text>
  </g>

  <!-- ESTABLISHED 区域 -->
  <rect x="30" y="286" width="112" height="26" rx="3" fill="#d1fae5" stroke="#34d399"/>
  <text x="86" y="303" text-anchor="middle" font-size="11" font-weight="600" fill="#065f46">ESTABLISHED</text>
  <rect x="658" y="286" width="112" height="26" rx="3" fill="#d1fae5" stroke="#34d399"/>
  <text x="714" y="303" text-anchor="middle" font-size="11" font-weight="600" fill="#065f46">ESTABLISHED</text>
  <text x="400" y="303" text-anchor="middle" font-size="12" fill="#059669">双方进入已连接状态，可双向传输数据</text>

  <!-- 底部注解 -->
  <rect x="180" y="330" width="480" height="52" rx="4" fill="#fef9c3" stroke="#fde047"/>
  <text x="196" y="349" font-size="11.5" fill="#713f12" font-weight="600">为什么必须三次：</text>
  <text x="196" y="368" font-size="11" fill="#713f12">只有三次才能双向确认收发能力，并同步双方初始序列号（ISN）；同时防止失效的旧 SYN 建立无效连接。</text>
</svg>
