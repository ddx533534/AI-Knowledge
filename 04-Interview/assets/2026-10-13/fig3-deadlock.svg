<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="800" height="420" fill="#ffffff"/>
  <text x="400" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">死锁四个必要条件与资源等待环</text>

  <!-- 四个条件 -->
  <g font-size="11.5">
    <rect x="40" y="52" width="340" height="52" rx="5" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="56" y="72" font-size="12" font-weight="600" fill="#991b1b">① 互斥（Mutual Exclusion）</text>
    <text x="56" y="92" font-size="10.5" fill="#7f1d1d">资源一次只能被一个进程持有，不可共享</text>

    <rect x="40" y="114" width="340" height="52" rx="5" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="56" y="134" font-size="12" font-weight="600" fill="#991b1b">② 请求与保持（Hold and Wait）</text>
    <text x="56" y="154" font-size="10.5" fill="#7f1d1d">持有至少一个资源，同时请求新的资源</text>

    <rect x="40" y="176" width="340" height="52" rx="5" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="56" y="196" font-size="12" font-weight="600" fill="#991b1b">③ 不可剥夺（No Preemption）</text>
    <text x="56" y="216" font-size="10.5" fill="#7f1d1d">资源不能被强行抢走，只能由持有者主动释放</text>

    <rect x="40" y="238" width="340" height="52" rx="5" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="56" y="258" font-size="12" font-weight="600" fill="#991b1b">④ 循环等待（Circular Wait）</text>
    <text x="56" y="278" font-size="10.5" fill="#7f1d1d">进程间形成头尾相接的资源等待环</text>
  </g>

  <text x="210" y="318" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="600">四个条件必须同时满足才会死锁 → 破坏任意一个即可预防</text>

  <!-- 等待环 -->
  <text x="600" y="62" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2937">资源等待环</text>
  <g>
    <circle cx="530" cy="130" r="30" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.4"/>
    <text x="530" y="135" text-anchor="middle" font-size="12" fill="#1e40af" font-weight="600">P1</text>
    <circle cx="680" cy="130" r="30" fill="#d1fae5" stroke="#34d399" stroke-width="1.4"/>
    <text x="680" y="135" text-anchor="middle" font-size="12" fill="#065f46" font-weight="600">P2</text>
    <circle cx="530" cy="270" r="30" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.4"/>
    <text x="530" y="275" text-anchor="middle" font-size="12" fill="#1e40af" font-weight="600">P3</text>
    <circle cx="680" cy="270" r="30" fill="#d1fae5" stroke="#34d399" stroke-width="1.4"/>
    <text x="680" y="275" text-anchor="middle" font-size="12" fill="#065f46" font-weight="600">P4</text>

    <g stroke="#dc2626" stroke-width="1.6" fill="#dc2626">
      <line x1="560" y1="130" x2="646" y2="130"/>
      <polygon points="650,130 640,126 640,134"/>
      <line x1="680" y1="160" x2="680" y2="236"/>
      <polygon points="680,240 676,230 684,230"/>
      <line x1="650" y1="270" x2="564" y2="270"/>
      <polygon points="560,270 570,266 570,274"/>
      <line x1="530" y1="240" x2="530" y2="164"/>
      <polygon points="530,160 526,170 534,170"/>
    </g>
    <text x="605" y="122" text-anchor="middle" font-size="10" fill="#991b1b">等 R2</text>
    <text x="694" y="204" font-size="10" fill="#991b1b">等 R3</text>
    <text x="605" y="262" text-anchor="middle" font-size="10" fill="#991b1b">等 R4</text>
    <text x="512" y="204" font-size="10" fill="#991b1b">等 R1</text>
  </g>

  <!-- 处理策略 -->
  <rect x="440" y="318" width="330" height="86" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="456" y="338" font-size="11.5" font-weight="600" fill="#334155">四种处理策略</text>
  <text x="456" y="358" font-size="10.5" fill="#475569">预防：破坏任一条件（工程上最实用＝统一加锁顺序）</text>
  <text x="456" y="376" font-size="10.5" fill="#475569">避免：银行家算法　|　检测：等待图找环后恢复</text>
  <text x="456" y="394" font-size="10.5" fill="#475569">忽略：通用 OS 常用（死锁罕见，预防成本高）</text>
</svg>
