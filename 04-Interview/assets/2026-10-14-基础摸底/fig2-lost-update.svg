<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526b62"/></marker></defs><rect width="100%" height="100%" fill="#f7f8f4"/><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#243c34;font-size:18px}.small{font-size:15px;fill:#526b62}.title{font-size:26px;font-weight:700}.label{font-size:18px;font-weight:700}</style><text x="32" y="46" class="title">volatile count++：读写可见，不代表读改写整体原子</text><text x="32" y="82" class="small">初始 count = 3；两个线程正常读取同一个值，也可能丢失一次更新。</text><rect x="50" y="110" width="400" height="310" rx="12" fill="#fff" stroke="#cdd9d0"/><rect x="550" y="110" width="400" height="310" rx="12" fill="#fff" stroke="#cdd9d0"/><text x="80" y="148" class="label">线程 A</text><text x="580" y="148" class="label">线程 B</text><text x="80" y="204" class="">① 读取 count：3</text><text x="580" y="242" class="">② 读取 count：3</text><text x="80" y="280" class="">③ 计算局部结果：4</text><text x="580" y="318" class="">④ 计算局部结果：4</text><text x="80" y="356" class="">⑤ 写回 count = 4</text><text x="580" y="394" class="">⑥ 写回 count = 4</text><line x1="455" y1="204" x2="545" y2="242" stroke="#526b62" stroke-width="2" marker-end="url(#arrow)"/><line x1="545" y1="242" x2="455" y2="280" stroke="#526b62" stroke-width="2" marker-end="url(#arrow)"/><line x1="455" y1="280" x2="545" y2="318" stroke="#526b62" stroke-width="2" marker-end="url(#arrow)"/><line x1="545" y1="318" x2="455" y2="356" stroke="#526b62" stroke-width="2" marker-end="url(#arrow)"/><line x1="455" y1="356" x2="545" y2="394" stroke="#526b62" stroke-width="2" marker-end="url(#arrow)"/><text x="50" y="462" class="label">最终 count = 4；要保护整段读改写，两个线程必须遵循同一锁协议。</text><text x="50" y="496" class="small">A 后来的写入，不会自动修改 B 已经读入的局部计算值。</text></svg>