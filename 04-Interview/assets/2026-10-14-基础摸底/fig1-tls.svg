<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="850" viewBox="0 0 1000 850"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526b62"/></marker></defs><rect width="100%" height="100%" fill="#f7f8f4"/><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#243c34;font-size:18px}.small{font-size:15px;fill:#526b62}.title{font-size:26px;font-weight:700}.label{font-size:18px;font-weight:700}</style><text x="32" y="46" class="title">TLS：证书签发与本次握手，各用谁的密钥？</text><rect x="28" y="72" width="944" height="185" rx="12" fill="#fff" stroke="#cdd9d0"/><text x="48" y="104" class="label">上线前 · CA 签发网站证书</text><text x="48" y="144" class="">网站生成公私钥 → 提交公钥与域名 → CA 验证后签发</text><text x="48" y="181" class="">CA 私钥签名；网站私钥由网站保管，不对外发送。</text><text x="48" y="221" class="small">客户端信任库含根 CA 公钥；通常经过中间 CA 验证证书链。</text><text x="80" y="300" class="label">客户端</text><text x="810" y="300" class="label">服务器</text><line x1="130" y1="318" x2="130" y2="740" stroke="#cdd9d0"/><line x1="865" y1="318" x2="865" y2="740" stroke="#cdd9d0"/><line x1="135" y1="350" x2="860" y2="350" stroke="#526b62" stroke-width="2" marker-end="url(#arrow)"/><text x="245" y="337" class="">ClientHello：临时密钥交换公钥等</text><line x1="860" y1="414" x2="135" y2="414" stroke="#526b62" stroke-width="2" marker-end="url(#arrow)"/><text x="245" y="400" class="">ServerHello：服务器临时公钥等</text><rect x="235" y="435" width="530" height="52" rx="12" fill="#fff" stroke="#cdd9d0"/><text x="255" y="468" class="">双方计算共享秘密，派生握手密钥</text><line x1="860" y1="525" x2="135" y2="525" stroke="#526b62" stroke-width="2" marker-end="url(#arrow)"/><text x="300" y="513" class="">Certificate：网站证书与证书链</text><text x="150" y="557" class="small">客户端验证域名、有效期与 CA 签名链</text><line x1="860" y1="610" x2="135" y2="610" stroke="#526b62" stroke-width="2" marker-end="url(#arrow)"/><text x="215" y="596" class="">CertificateVerify：网站私钥对握手记录签名</text><text x="150" y="642" class="small">客户端用已验证证书中的网站公钥验签</text><line x1="860" y1="685" x2="135" y2="685" stroke="#526b62" stroke-width="2" marker-end="url(#arrow)"/><text x="340" y="673" class="">服务端 Finished</text><line x1="135" y1="729" x2="860" y2="729" stroke="#526b62" stroke-width="2" marker-end="url(#arrow)"/><text x="340" y="717" class="">客户端 Finished</text><rect x="28" y="765" width="944" height="60" rx="12" fill="#fff" stroke="#cdd9d0"/><text x="48" y="803" class="">随后使用派生的对称密钥保护 HTTP 数据；身份公钥 ≠ 临时交换公钥。</text></svg>