<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" width="860" height="500" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="860" height="500" fill="#ffffff"/>
  <text x="30" y="34" font-size="17" font-weight="600" fill="#1f2937">高可用与高性能的两条主线：冗余故障转移 vs 缓存异步</text>

  <!-- 高可用 -->
  <rect x="30" y="54" width="388" height="196" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.4"/>
  <text x="48" y="80" font-size="14" font-weight="600" fill="#1e40af">高可用 = 冗余 + 故障转移</text>

  <rect x="48" y="96" width="166" height="46" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="131" y="116" font-size="11.5" text-anchor="middle" fill="#1e40af">多副本</text>
  <text x="131" y="132" font-size="10" text-anchor="middle" fill="#6b7280">同一份数据存多份</text>

  <rect x="228" y="96" width="166" height="46" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="311" y="116" font-size="11.5" text-anchor="middle" fill="#1e40af">健康检查 + 自动切换</text>
  <text x="311" y="132" font-size="10" text-anchor="middle" fill="#6b7280">主挂了从顶上</text>

  <rect x="48" y="152" width="166" height="46" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="131" y="172" font-size="11.5" text-anchor="middle" fill="#1e40af">限流 + 熔断 + 降级</text>
  <text x="131" y="188" font-size="10" text-anchor="middle" fill="#6b7280">挡住级联雪崩</text>

  <rect x="228" y="152" width="166" height="46" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="311" y="172" font-size="11.5" text-anchor="middle" fill="#1e40af">无状态服务</text>
  <text x="311" y="188" font-size="10" text-anchor="middle" fill="#6b7280">水平扩展的前提</text>

  <text x="48" y="224" font-size="10.5" fill="#1e40af">核心指标：可用性 99.99% ≈ 全年不可用 52 分钟</text>
  <text x="48" y="242" font-size="10.5" fill="#6b7280">单点是最大的敌人，一切冗余都是为了消除单点</text>

  <!-- 高性能 -->
  <rect x="442" y="54" width="388" height="196" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.4"/>
  <text x="460" y="80" font-size="14" font-weight="600" fill="#166534">高性能 = 缓存 + 异步</text>

  <rect x="460" y="96" width="166" height="46" rx="6" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="543" y="116" font-size="11.5" text-anchor="middle" fill="#166534">多级缓存</text>
  <text x="543" y="132" font-size="10" text-anchor="middle" fill="#6b7280">越靠前越快越小</text>

  <rect x="640" y="96" width="166" height="46" rx="6" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="723" y="116" font-size="11.5" text-anchor="middle" fill="#166534">消息队列削峰</text>
  <text x="723" y="132" font-size="10" text-anchor="middle" fill="#6b7280">流量先进队列</text>

  <rect x="460" y="152" width="166" height="46" rx="6" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="543" y="172" font-size="11.5" text-anchor="middle" fill="#166534">读写分离 / 分片</text>
  <text x="543" y="188" font-size="10" text-anchor="middle" fill="#6b7280">把压力摊到多节点</text>

  <rect x="640" y="152" width="166" height="46" rx="6" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="723" y="172" font-size="11.5" text-anchor="middle" fill="#166534">CDN / 边缘计算</text>
  <text x="723" y="188" font-size="10" text-anchor="middle" fill="#6b7280">把内容推到离用户近处</text>

  <text x="460" y="224" font-size="10.5" fill="#166534">核心指标：P99 延迟比平均延迟更有意义</text>
  <text x="460" y="242" font-size="10.5" fill="#6b7280">平均 50ms 但 P99 3s，仍是严重问题</text>

  <!-- 答题模板 -->
  <line x1="30" y1="272" x2="830" y2="272" stroke="#e5e7eb"/>
  <text x="30" y="300" font-size="14" font-weight="600" fill="#1f2937">系统设计答题七步（45 分钟版）</text>

  <g font-size="11">
    <rect x="30" y="316" width="108" height="70" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="84" y="340" font-size="11.5" text-anchor="middle" fill="#1e40af" font-weight="600">① 澄清</text>
    <text x="84" y="358" font-size="9.5" text-anchor="middle" fill="#475569">功能+非功能</text>
    <text x="84" y="374" font-size="9.5" text-anchor="middle" fill="#6b7280">0–5 min</text>

    <rect x="146" y="316" width="108" height="70" rx="6" fill="#f0fdf4" stroke="#86efac"/>
    <text x="200" y="340" font-size="11.5" text-anchor="middle" fill="#166534" font-weight="600">② 估算</text>
    <text x="200" y="358" font-size="9.5" text-anchor="middle" fill="#475569">QPS/存储</text>
    <text x="200" y="374" font-size="9.5" text-anchor="middle" fill="#6b7280">5–10 min</text>

    <rect x="262" y="316" width="108" height="70" rx="6" fill="#fef3c7" stroke="#fbbf24"/>
    <text x="316" y="340" font-size="11.5" text-anchor="middle" fill="#92400e" font-weight="600">③ 接口</text>
    <text x="316" y="358" font-size="9.5" text-anchor="middle" fill="#475569">+ 数据模型</text>
    <text x="316" y="374" font-size="9.5" text-anchor="middle" fill="#6b7280">10–15 min</text>

    <rect x="378" y="316" width="108" height="70" rx="6" fill="#faf5ff" stroke="#c4b5fd"/>
    <text x="432" y="340" font-size="11.5" text-anchor="middle" fill="#6d28d9" font-weight="600">④ 架构图</text>
    <text x="432" y="358" font-size="9.5" text-anchor="middle" fill="#475569">高层+数据流</text>
    <text x="432" y="374" font-size="9.5" text-anchor="middle" fill="#6b7280">15–30 min</text>

    <rect x="494" y="316" width="108" height="70" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="548" y="340" font-size="11.5" text-anchor="middle" fill="#991b1b" font-weight="600">⑤ 深入</text>
    <text x="548" y="358" font-size="9.5" text-anchor="middle" fill="#475569">单个组件</text>
    <text x="548" y="374" font-size="9.5" text-anchor="middle" fill="#6b7280">30–40 min</text>

    <rect x="610" y="316" width="108" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="664" y="340" font-size="11.5" text-anchor="middle" fill="#334155" font-weight="600">⑥ 权衡</text>
    <text x="664" y="358" font-size="9.5" text-anchor="middle" fill="#475569">瓶颈+代价</text>
    <text x="664" y="374" font-size="9.5" text-anchor="middle" fill="#6b7280">40–45 min</text>

    <rect x="726" y="316" width="104" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="778" y="340" font-size="11.5" text-anchor="middle" fill="#334155" font-weight="600">⑦ 扩展</text>
    <text x="778" y="358" font-size="9.5" text-anchor="middle" fill="#475569">未来怎么演进</text>
    <text x="778" y="374" font-size="9.5" text-anchor="middle" fill="#6b7280">加分项</text>
  </g>

  <!-- 两条铁律 -->
  <line x1="30" y1="404" x2="830" y2="404" stroke="#e5e7eb"/>
  <text x="30" y="430" font-size="12.5" font-weight="600" fill="#1f2937">两条铁律</text>
  <text x="30" y="454" font-size="11.5" fill="#dc2626">① 必须先澄清需求再画架构（直接开画 = 在猜需求，最常见的失分点）</text>
  <text x="30" y="476" font-size="11.5" fill="#dc2626">② 每个决策都要主动说出代价（“用 Redis”后面必接“代价是一致性变弱，用……兜底”）</text>
</svg>
