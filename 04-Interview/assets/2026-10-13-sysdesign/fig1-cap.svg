<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="860" height="470" fill="#ffffff"/>
  <text x="30" y="34" font-size="17" font-weight="600" fill="#1f2937">CAP 定理：P 是必选项，真正的选择在 C 与 A 之间</text>

  <!-- CAP 三角 -->
  <polygon points="230,90 120,290 340,290" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>
  <circle cx="230" cy="90" r="34" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.6"/>
  <text x="230" y="87" font-size="13" text-anchor="middle" fill="#1e40af" font-weight="600">C</text>
  <text x="230" y="103" font-size="9" text-anchor="middle" fill="#1e40af">一致性</text>
  <circle cx="120" cy="290" r="34" fill="#dcfce7" stroke="#4ade80" stroke-width="1.6"/>
  <text x="120" y="287" font-size="13" text-anchor="middle" fill="#166534" font-weight="600">A</text>
  <text x="120" y="303" font-size="9" text-anchor="middle" fill="#166534">可用性</text>
  <circle cx="340" cy="290" r="34" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.6"/>
  <text x="340" y="287" font-size="13" text-anchor="middle" fill="#92400e" font-weight="600">P</text>
  <text x="340" y="303" font-size="9" text-anchor="middle" fill="#92400e">分区容错</text>

  <text x="230" y="200" font-size="11" text-anchor="middle" fill="#dc2626" font-weight="600">三者最多取二</text>
  <text x="230" y="220" font-size="10.5" text-anchor="middle" fill="#6b7280">网络分区无法避免</text>
  <text x="230" y="238" font-size="10.5" text-anchor="middle" fill="#6b7280">↓</text>
  <text x="230" y="258" font-size="10.5" text-anchor="middle" fill="#059669" font-weight="600">P 必选，只剩两条路</text>

  <!-- 右侧：CP vs AP -->
  <rect x="430" y="70" width="400" height="118" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.4"/>
  <text x="450" y="96" font-size="14" font-weight="600" fill="#1e40af">CP：保一致，牺牲可用</text>
  <text x="450" y="118" font-size="11.5" fill="#475569">分区时拒绝服务，宁可不可用也不返回旧数据</text>
  <text x="450" y="140" font-size="11.5" fill="#475569">适用：金融账务、分布式锁、元数据管理</text>
  <text x="450" y="162" font-size="11" fill="#6b7280">代表：ZooKeeper、etcd、HBase</text>

  <rect x="430" y="200" width="400" height="118" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.4"/>
  <text x="450" y="226" font-size="14" font-weight="600" fill="#166534">AP：保可用，牺牲一致</text>
  <text x="450" y="248" font-size="11.5" fill="#475569">分区时继续服务，可能返回旧数据，事后收敛</text>
  <text x="450" y="270" font-size="11.5" fill="#475569">适用：社交信息流、商品浏览、点赞统计</text>
  <text x="450" y="292" font-size="11" fill="#6b7280">代表：Cassandra、Eureka、DynamoDB</text>

  <!-- 反面 -->
  <rect x="430" y="334" width="400" height="52" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.3"/>
  <text x="450" y="356" font-size="12.5" font-weight="600" fill="#991b1b">✗ 常见错误回答</text>
  <text x="450" y="376" font-size="11.5" fill="#475569">「我们选了 CA」= 假设网络不会分区，概念性错误</text>

  <!-- 底部：BASE -->
  <line x1="30" y1="400" x2="830" y2="400" stroke="#e5e7eb"/>
  <text x="30" y="426" font-size="12.5" font-weight="600" fill="#1f2937">BASE：AP 系统的工程指导（ACID 的柔性替代）</text>
  <text x="30" y="450" font-size="11.5" fill="#475569">BA 基本可用（允许降级/变慢）＋ S 软状态（允许中间态）＋ E 最终一致（停止写入后收敛）</text>
</svg>
