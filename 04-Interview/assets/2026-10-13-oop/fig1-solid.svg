<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="860" height="470" fill="#ffffff"/>
  <text x="30" y="34" font-size="17" font-weight="600" fill="#1f2937">SOLID 五大原则：违反后的症状与修复方向</text>

  <!-- 表头 -->
  <rect x="30" y="52" width="800" height="30" rx="4" fill="#f1f5f9"/>
  <text x="46" y="72" font-size="12.5" font-weight="600" fill="#334155">原则</text>
  <text x="196" y="72" font-size="12.5" font-weight="600" fill="#334155">一句话</text>
  <text x="470" y="72" font-size="12.5" font-weight="600" fill="#334155">违反症状</text>
  <text x="700" y="72" font-size="12.5" font-weight="600" fill="#334155">修复方向</text>

  <g font-size="11.5">
    <!-- S -->
    <text x="46" y="106" font-weight="600" fill="#2563eb">S 单一职责</text>
    <text x="196" y="106" fill="#475569">一个类只有一个</text>
    <text x="196" y="122" fill="#475569">变化的原因</text>
    <text x="470" y="106" fill="#dc2626">改 A 功能崩了 B</text>
    <text x="700" y="106" fill="#059669">拆类，按变化点</text>
    <text x="700" y="122" fill="#059669">分离职责</text>
    <line x1="30" y1="134" x2="830" y2="134" stroke="#f1f5f9"/>

    <!-- O -->
    <text x="46" y="162" font-weight="600" fill="#2563eb">O 开闭</text>
    <text x="196" y="162" fill="#475569">对扩展开放，</text>
    <text x="196" y="178" fill="#475569">对修改关闭</text>
    <text x="470" y="162" fill="#dc2626">每加类型就要</text>
    <text x="470" y="178" fill="#dc2626">改 switch/if</text>
    <text x="700" y="162" fill="#059669">用多态/策略</text>
    <text x="700" y="178" fill="#059669">替代条件分支</text>
    <line x1="30" y1="190" x2="830" y2="190" stroke="#f1f5f9"/>

    <!-- L -->
    <text x="46" y="218" font-weight="600" fill="#2563eb">L 里氏替换</text>
    <text x="196" y="218" fill="#475569">子类可透明替换</text>
    <text x="196" y="234" fill="#475569">父类且行为不变</text>
    <text x="470" y="218" fill="#dc2626">子类抛父类没有</text>
    <text x="470" y="234" fill="#dc2626">的异常、改语义</text>
    <text x="700" y="218" fill="#059669">用组合代替继承，</text>
    <text x="700" y="234" fill="#059669">检查行为契约</text>
    <line x1="30" y1="246" x2="830" y2="246" stroke="#f1f5f9"/>

    <!-- I -->
    <text x="46" y="274" font-weight="600" fill="#2563eb">I 接口隔离</text>
    <text x="196" y="274" fill="#475569">接口拆小，别强迫</text>
    <text x="196" y="290" fill="#475569">实现用不到的方法</text>
    <text x="470" y="274" fill="#dc2626">实现类里大段</text>
    <text x="470" y="290" fill="#dc2626">空方法抛异常</text>
    <text x="700" y="274" fill="#059669">按调用方需求</text>
    <text x="700" y="290" fill="#059669">拆分接口</text>
    <line x1="30" y1="302" x2="830" y2="302" stroke="#f1f5f9"/>

    <!-- D -->
    <text x="46" y="330" font-weight="600" fill="#2563eb">D 依赖倒置</text>
    <text x="196" y="330" fill="#475569">依赖抽象，不依赖</text>
    <text x="196" y="346" fill="#475569">具体实现</text>
    <text x="470" y="330" fill="#dc2626">高层直接 new</text>
    <text x="470" y="346" fill="#dc2626">低层实现，难替换</text>
    <text x="700" y="330" fill="#059669">注入接口，</text>
    <text x="700" y="346" fill="#059669">由容器装配</text>
  </g>

  <line x1="30" y1="360" x2="830" y2="360" stroke="#e5e7eb"/>

  <text x="30" y="388" font-size="13" font-weight="600" fill="#1f2937">共同目标：高内聚、低耦合</text>
  <text x="30" y="412" font-size="11.5" fill="#475569">SOLID 是判断「这段设计好不好」的标尺；23 种模式是达到标尺的手段。</text>
  <text x="30" y="434" font-size="11.5" fill="#475569">另有两条常被一起问：迪米特法则（只和直接朋友说话）、合成复用原则（优先组合而非继承）。</text>
  <text x="30" y="456" font-size="11.5" fill="#6b7280">生产中最常落地的只有：单例、工厂、代理、装饰器、策略、观察者、模板方法、责任链。</text>
</svg>
