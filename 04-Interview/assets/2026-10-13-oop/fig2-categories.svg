<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" width="860" height="500" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="860" height="500" fill="#ffffff"/>
  <text x="30" y="34" font-size="17" font-weight="600" fill="#1f2937">23 种设计模式的三大分类（5 · 7 · 11）</text>

  <!-- 创建型 5 -->
  <rect x="30" y="56" width="252" height="230" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.4"/>
  <text x="46" y="82" font-size="13.5" font-weight="600" fill="#1e40af">创建型 · 5 种</text>
  <text x="46" y="102" font-size="11" fill="#6b7280">解决「对象怎么创建」</text>
  <g font-size="11.5" fill="#334155">
    <text x="46" y="130">单例 Singleton</text>
    <text x="240" y="130" font-size="10" fill="#059669" text-anchor="end">高频</text>
    <text x="46" y="154">工厂方法 Factory Method</text>
    <text x="240" y="154" font-size="10" fill="#059669" text-anchor="end">高频</text>
    <text x="46" y="178">抽象工厂 Abstract Factory</text>
    <text x="46" y="202">建造者 Builder</text>
    <text x="240" y="202" font-size="10" fill="#d97706" text-anchor="end">中频</text>
    <text x="46" y="226">原型 Prototype</text>
  </g>
  <line x1="46" y1="244" x2="266" y2="244" stroke="#bfdbfe"/>
  <text x="46" y="266" font-size="10.5" fill="#1e40af">例：Spring Bean、连接池、StringBuilder</text>

  <!-- 结构型 7 -->
  <rect x="304" y="56" width="252" height="230" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.4"/>
  <text x="320" y="82" font-size="13.5" font-weight="600" fill="#166534">结构型 · 7 种</text>
  <text x="320" y="102" font-size="11" fill="#6b7280">解决「类与对象怎么组合」</text>
  <g font-size="11.5" fill="#334155">
    <text x="320" y="130">代理 Proxy</text>
    <text x="514" y="130" font-size="10" fill="#059669" text-anchor="end">高频</text>
    <text x="320" y="154">装饰器 Decorator</text>
    <text x="514" y="154" font-size="10" fill="#059669" text-anchor="end">高频</text>
    <text x="320" y="178">适配器 Adapter</text>
    <text x="514" y="178" font-size="10" fill="#d97706" text-anchor="end">中频</text>
    <text x="320" y="202">外观 Facade</text>
    <text x="320" y="226">桥接 Bridge</text>
    <text x="320" y="250">组合 Composite</text>
    <text x="320" y="274">享元 Flyweight</text>
  </g>

  <!-- 行为型 11 -->
  <rect x="578" y="56" width="252" height="230" rx="8" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.4"/>
  <text x="594" y="82" font-size="13.5" font-weight="600" fill="#6d28d9">行为型 · 11 种</text>
  <text x="594" y="102" font-size="11" fill="#6b7280">解决「对象间怎么交互」</text>
  <g font-size="11.5" fill="#334155">
    <text x="594" y="130">策略 Strategy</text>
    <text x="788" y="130" font-size="10" fill="#059669" text-anchor="end">高频</text>
    <text x="594" y="154">观察者 Observer</text>
    <text x="788" y="154" font-size="10" fill="#059669" text-anchor="end">高频</text>
    <text x="594" y="178">模板方法 Template</text>
    <text x="788" y="178" font-size="10" fill="#059669" text-anchor="end">高频</text>
    <text x="594" y="202">责任链 Chain</text>
    <text x="788" y="202" font-size="10" fill="#059669" text-anchor="end">高频</text>
    <text x="594" y="226">状态 State</text>
    <text x="594" y="250">命令 Command</text>
    <text x="594" y="274">迭代器 / 中介者 / 备忘录 / 访问者 / 解释器</text>
  </g>

  <!-- 占比条 -->
  <line x1="30" y1="306" x2="830" y2="306" stroke="#e5e7eb"/>
  <text x="30" y="332" font-size="13" font-weight="600" fill="#1f2937">记忆锚点与考察权重</text>

  <rect x="30" y="348" width="800" height="24" rx="4" fill="#f1f5f9"/>
  <rect x="30" y="348" width="120" height="24" rx="4" fill="#93c5fd"/>
  <text x="90" y="365" font-size="11" text-anchor="middle" fill="#1e3a8a" font-weight="600">创建型 5</text>
  <rect x="150" y="348" width="168" height="24" rx="4" fill="#86efac"/>
  <text x="234" y="365" font-size="11" text-anchor="middle" fill="#166534" font-weight="600">结构型 7</text>
  <rect x="318" y="348" width="264" height="24" rx="4" fill="#c4b5fd"/>
  <text x="450" y="365" font-size="11" text-anchor="middle" fill="#5b21b6" font-weight="600">行为型 11</text>
  <text x="600" y="365" font-size="11" fill="#6b7280">宽度即数量占比，合计 23</text>

  <!-- 底部：易混 -->
  <line x1="30" y1="388" x2="830" y2="388" stroke="#e5e7eb"/>
  <text x="30" y="414" font-size="13" font-weight="600" fill="#1f2937">三组必背的易混模式</text>

  <rect x="30" y="428" width="256" height="58" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="46" y="448" font-size="11.5" font-weight="600" fill="#991b1b">代理 vs 装饰器</text>
  <text x="46" y="466" font-size="10.5" fill="#475569">控制访问（门卫）vs 增强功能（洋葱）</text>
  <text x="46" y="481" font-size="10.5" fill="#6b7280">一层 vs 可层层叠加</text>

  <rect x="302" y="428" width="256" height="58" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/>
  <text x="318" y="448" font-size="11.5" font-weight="600" fill="#92400e">策略 vs 状态</text>
  <text x="318" y="466" font-size="10.5" fill="#475569">客户端主动选 vs 内部事件流转</text>
  <text x="318" y="481" font-size="10.5" fill="#6b7280">算法平行 vs 状态互相转换</text>

  <rect x="574" y="428" width="256" height="58" rx="6" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.2"/>
  <text x="590" y="448" font-size="11.5" font-weight="600" fill="#6d28d9">观察者 vs 发布订阅</text>
  <text x="590" y="466" font-size="10.5" fill="#475569">目标直接通知 vs 中间多事件中心</text>
  <text x="590" y="481" font-size="10.5" fill="#6b7280">强耦合 vs 完全解耦</text>
</svg>
