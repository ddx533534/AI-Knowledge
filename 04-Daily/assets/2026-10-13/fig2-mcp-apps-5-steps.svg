<svg viewBox="0 0 680 398" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>MCP Apps 的五步流程</title>
  <desc>工具在 tools/list 里指向 ui 地址，宿主取回 HTML 资源，在沙箱 iframe 里渲染，工具调用完成后宿主把结果送进 frame，页面再通过 postMessage 上的 JSON-RPC 反向调用。</desc>

  <circle cx="62" cy="71" r="13" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="62" y="71" text-anchor="middle" font-size="12" fill="#0C447C" dominant-baseline="central">1</text>
  <rect x="88" y="44" width="512" height="54" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="106" y="64" font-size="13" font-weight="500" fill="#1c1f24" dominant-baseline="central">指路</text>
  <text x="106" y="84" font-size="12" fill="#4a5158" dominant-baseline="central">工具在 tools/list 里用 _meta.ui.resourceUri 指向一个 ui:// 地址</text>

  <circle cx="62" cy="141" r="13" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="62" y="141" text-anchor="middle" font-size="12" fill="#0C447C" dominant-baseline="central">2</text>
  <rect x="88" y="114" width="512" height="54" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="106" y="134" font-size="13" font-weight="500" fill="#1c1f24" dominant-baseline="central">取回</text>
  <text x="106" y="154" font-size="12" fill="#4a5158" dominant-baseline="central">宿主把这个 HTML 资源拉回来，类型是 text/html;profile=mcp-app</text>

  <circle cx="62" cy="211" r="13" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="62" y="211" text-anchor="middle" font-size="12" fill="#0C447C" dominant-baseline="central">3</text>
  <rect x="88" y="184" width="512" height="54" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="106" y="204" font-size="13" font-weight="500" fill="#1c1f24" dominant-baseline="central">渲染</text>
  <text x="106" y="224" font-size="12" fill="#4a5158" dominant-baseline="central">放进沙箱 iframe，CSP 很严，不允许连外部域</text>

  <circle cx="62" cy="281" r="13" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="62" y="281" text-anchor="middle" font-size="12" fill="#0C447C" dominant-baseline="central">4</text>
  <rect x="88" y="254" width="512" height="54" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="106" y="274" font-size="13" font-weight="500" fill="#1c1f24" dominant-baseline="central">回填</text>
  <text x="106" y="294" font-size="12" fill="#4a5158" dominant-baseline="central">工具调用完成后，宿主把入参和结果当通知送进这个 frame</text>

  <circle cx="62" cy="351" r="13" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="62" y="351" text-anchor="middle" font-size="12" fill="#0C447C" dominant-baseline="central">5</text>
  <rect x="88" y="324" width="512" height="54" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="106" y="344" font-size="13" font-weight="500" fill="#1c1f24" dominant-baseline="central">反向调用</text>
  <text x="106" y="364" font-size="12" fill="#4a5158" dominant-baseline="central">页面通过 postMessage 上的 JSON-RPC 调工具、发消息、写回上下文</text>
</svg>
