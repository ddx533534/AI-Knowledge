<svg viewBox="0 0 680 300" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>三条关系里，只有一条有代码</title>
  <desc>左边 AG-UI 与 A2UI 有现成的包和官方互认；右边 json-render 与 AG-UI 只在文档里见过面，全库没有依赖。下方是两边文档都落后于协议当前版本。</desc>

  <rect x="40" y="36" width="290" height="176" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="60" y="60" font-size="13" font-weight="500" fill="#085041" dominant-baseline="central">有代码：AG-UI 与 A2UI</text>
  <rect x="60" y="78" width="250" height="26" rx="6" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="70" y="91" font-size="11" fill="#085041" dominant-baseline="central">@ag-ui/a2ui-middleware 0.0.12</text>
  <rect x="60" y="112" width="250" height="26" rx="6" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="70" y="125" font-size="11" fill="#085041" dominant-baseline="central">@ag-ui/a2ui-toolkit 0.0.5</text>
  <text x="60" y="158" font-size="11" fill="#085041" dominant-baseline="central">仓库里 197 个文件提到 a2ui</text>
  <text x="60" y="180" font-size="11" fill="#085041" dominant-baseline="central">A2UI 官方把 AG-UI 标成 Stable</text>
  <text x="60" y="202" font-size="11" fill="#085041" dominant-baseline="central">两端各有一份接入指南互指</text>

  <rect x="350" y="36" width="290" height="176" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="370" y="60" font-size="13" font-weight="500" fill="#791F1F" dominant-baseline="central">只在文档：json-render 与 AG-UI</text>
  <rect x="370" y="78" width="250" height="26" rx="6" fill="#FFFFFF" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="380" y="91" font-size="11" fill="#791F1F" dominant-baseline="central">0 个 @ag-ui 依赖</text>
  <rect x="370" y="112" width="250" height="26" rx="6" fill="#FFFFFF" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="380" y="125" font-size="11" fill="#791F1F" dominant-baseline="central">AG-UI 仓库 0 处提到 json-render</text>
  <text x="380" y="158" font-size="11" fill="#791F1F" dominant-baseline="central">两页集成文档都带同一句警示：</text>
  <text x="380" y="180" font-size="11" fill="#791F1F" dominant-baseline="central">例子是说明性的，上生产可能要改</text>
  <text x="380" y="202" font-size="11" fill="#791F1F" dominant-baseline="central">core 的运行时依赖只有 zod</text>

  <rect x="40" y="232" width="600" height="52" rx="8" fill="#F7F6F3" stroke="#888780" stroke-width="0.5"/>
  <text x="56" y="250" font-size="11" fill="#4a5158" dominant-baseline="central">两边文档都落后于当前版本：</text>
  <text x="56" y="270" font-size="11" fill="#4a5158" dominant-baseline="central">json-render 的 A2UI 页用 v0.8 消息名（A2UI 当前 v0.9.1）；AG-UI 页列 12 个事件（AG-UI 1.0 有 31 个）</text>
</svg>
