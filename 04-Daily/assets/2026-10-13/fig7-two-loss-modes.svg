<svg viewBox="0 0 680 236" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>两种上下文丢失的位置不同</title>
  <desc>左边是单智能体的一条长窗口，中间部分召回变差；右边是串行子智能体，每段窗口干净，但每道交接都可能丢掉没有写下来的信息。</desc>
  <rect x="40" y="40" width="290" height="140" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="60" y="64" font-size="13" font-weight="500" fill="#0C447C" dominant-baseline="central">单智能体 · 一条长窗口</text>

  <rect x="60" y="82" width="36" height="30" rx="5" fill="#B5D4F4" stroke="#378ADD" stroke-width="0.5"/>
  <rect x="102" y="82" width="36" height="30" rx="5" fill="#B5D4F4" stroke="#378ADD" stroke-width="0.5"/>
  <rect x="144" y="82" width="36" height="30" rx="5" fill="#FFFFFF" stroke="#378ADD" stroke-width="0.5" stroke-dasharray="3 3"/>
  <rect x="186" y="82" width="36" height="30" rx="5" fill="#FFFFFF" stroke="#378ADD" stroke-width="0.5" stroke-dasharray="3 3"/>
  <rect x="228" y="82" width="36" height="30" rx="5" fill="#B5D4F4" stroke="#378ADD" stroke-width="0.5"/>
  <rect x="270" y="82" width="36" height="30" rx="5" fill="#B5D4F4" stroke="#378ADD" stroke-width="0.5"/>

  <text x="185" y="138" text-anchor="middle" font-size="12" fill="#A32D2D" dominant-baseline="central">中间两段沉下去，召回不到</text>

  <rect x="350" y="40" width="290" height="140" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="370" y="64" font-size="13" font-weight="500" fill="#085041" dominant-baseline="central">串行子智能体 · 每段一个干净窗口</text>

  <rect x="370" y="82" width="74" height="30" rx="5" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <rect x="458" y="82" width="74" height="30" rx="5" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <rect x="546" y="82" width="74" height="30" rx="5" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>

  <line x1="445" y1="97" x2="456" y2="97" stroke="#0F6E56" stroke-width="1.5" fill="none" marker-end="url(#arrowA)"/>
  <line x1="533" y1="97" x2="544" y2="97" stroke="#0F6E56" stroke-width="1.5" fill="none" marker-end="url(#arrowA)"/>

  <text x="495" y="138" text-anchor="middle" font-size="12" fill="#A32D2D" dominant-baseline="central">交接处没写下来的，下游自己补</text>

  <text x="185" y="206" text-anchor="middle" font-size="12" fill="#4a5158" dominant-baseline="central">损耗在窗口里面</text>
  <text x="495" y="206" text-anchor="middle" font-size="12" fill="#4a5158" dominant-baseline="central">损耗在交接处</text>

  <defs>
    <marker id="arrowA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
</svg>
