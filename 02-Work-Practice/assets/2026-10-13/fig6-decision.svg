<svg viewBox="0 0 680 400" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <title>三条路怎么选：按滚动发生在哪和窗口形态决定</title>
  <desc>三行决策。滚动全在 RN 渲染树内并且能开 Canary 就用 RN 官方，开不了 Canary 就用事件触发式。有原生容器滚动 RN 子树时官方看不见，用原生侧绑触发器的事件触发式。要覆盖小窗分屏沉浸式，或者不接受 Canary 依赖，维持 Recce 1.24 原生监听。底部是可选的转发路线：宿主是 RN 内部滚动时转给官方，只有原生容器滚动才退回自研。</desc>

  <text x="24" y="18" font-size="12" font-weight="500" fill="#1f2328" dominant-baseline="central">三条路怎么选</text>

  <rect x="24" y="34" width="376" height="70" rx="8" fill="#fbfcfd" stroke="#d9dde3" stroke-width="0.5"/>
  <text x="40" y="58" font-size="11.5" fill="#1f2328" dominant-baseline="central">滚动全在 RN 自己的渲染树里</text>
  <text x="40" y="78" font-size="9.5" fill="#5b6470" dominant-baseline="central">而且已经在新架构上，愿意开 Canary 通道</text>

  <line x1="404" y1="53" x2="430" y2="53" stroke="#185FA5" stroke-width="1.2" marker-end="url(#ar6)"/>
  <line x1="404" y1="87" x2="430" y2="87" stroke="#B4761D" stroke-width="1.2" marker-end="url(#ar6b)"/>

  <rect x="436" y="38" width="220" height="30" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="446" y="53" font-size="9.5" fill="#0C447C" dominant-baseline="central">开得了 Canary：用 RN 官方</text>
  <rect x="436" y="72" width="220" height="30" rx="6" fill="#FAEEDA" stroke="#B4761D" stroke-width="0.5"/>
  <text x="446" y="87" font-size="9.5" fill="#7A4E0C" dominant-baseline="central">开不了：用事件触发式</text>

  <rect x="24" y="124" width="376" height="70" rx="8" fill="#fbfcfd" stroke="#d9dde3" stroke-width="0.5"/>
  <text x="40" y="148" font-size="11.5" fill="#1f2328" dominant-baseline="central">页面上有一层原生容器在滚 RN 子树</text>
  <text x="40" y="168" font-size="9.5" fill="#5b6470" dominant-baseline="central">原生的 ScrollView、RecyclerView，或者原生页面里嵌 RN</text>

  <line x1="404" y1="159" x2="430" y2="159" stroke="#B4761D" stroke-width="1.2" marker-end="url(#ar6b)"/>

  <rect x="436" y="124" width="220" height="70" rx="8" fill="#FAEEDA" stroke="#B4761D" stroke-width="0.5"/>
  <text x="446" y="148" font-size="11" fill="#7A4E0C" dominant-baseline="central">官方看不见</text>
  <text x="446" y="168" font-size="9.5" fill="#7A4E0C" dominant-baseline="central">用事件触发式，触发器绑在原生侧</text>

  <rect x="24" y="214" width="376" height="70" rx="8" fill="#fbfcfd" stroke="#d9dde3" stroke-width="0.5"/>
  <text x="40" y="238" font-size="11.5" fill="#1f2328" dominant-baseline="central">要覆盖小窗、分屏、沉浸式</text>
  <text x="40" y="258" font-size="9.5" fill="#5b6470" dominant-baseline="central">或者三端同时可用、不接受 Canary 依赖</text>

  <line x1="404" y1="249" x2="430" y2="249" stroke="#0F6E56" stroke-width="1.2" marker-end="url(#ar6c)"/>

  <rect x="436" y="214" width="220" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="446" y="238" font-size="11" fill="#085041" dominant-baseline="central">维持 Recce 1.24 原生监听</text>
  <text x="446" y="258" font-size="9.5" fill="#085041" dominant-baseline="central">窗口形态的实测在官方文档里没有</text>

  <rect x="24" y="304" width="632" height="80" rx="8" fill="#F7F6F3" stroke="#888780" stroke-width="0.5"/>
  <text x="40" y="324" font-size="9.5" fill="#4a5158" dominant-baseline="central">这三条也能合起来用。Recce 的入参出参与 W3C 几乎一一对应，</text>
  <text x="40" y="342" font-size="9.5" fill="#4a5158" dominant-baseline="central">宿主是 RN 内部滚动时把请求转发给官方 IntersectionObserver，</text>
  <text x="40" y="360" font-size="9.5" fill="#4a5158" dominant-baseline="central">只有检测到原生容器滚动才退回自研。上游转正后，要改的只有转发层。</text>

  <defs>
    <marker id="ar6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ar6b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#B4761D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ar6c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
</svg>
