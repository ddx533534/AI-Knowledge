<svg xmlns="http://www.w3.org/2000/svg" width="960" height="428" viewBox="0 0 960 428" role="img" aria-label="TCP 字节流：长度字段决定消息体的读取范围"><rect width="100%" height="100%" fill="#fafbf9"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="32" y="46" font-size="24" fill="#172b25">TCP 字节流：长度字段决定消息体的读取范围</text><rect x="28" y="76" width="904" height="88" rx="4" fill="#ffffff" stroke="#cad5cf"/><text x="48" y="107" font-size="19" fill="#183e31">字节流：[长度 100 / 4 字节][正文 100 字节][长度 50 / 4 字节][正文 50 字节]</text><text x="48" y="139" font-size="17" fill="#44564e">readInt 消费第一个长度字段；byte[100] 的 readFully 只填入 100 字节。</text><rect x="28" y="182" width="904" height="88" rx="4" fill="#fff3eb" stroke="#cad5cf"/><text x="48" y="213" font-size="19" fill="#183e31">收到 30 / 100 字节：还需要读取 70 字节</text><text x="48" y="245" font-size="17" fill="#44564e">当前消息未完成，后续 4 字节可能仍是正文，不能当作下一个长度。</text><rect x="28" y="288" width="904" height="88" rx="4" fill="#ffffff" stroke="#cad5cf"/><text x="48" y="319" font-size="19" fill="#183e31">提前 EOF → 失败；不再发送 → 可能等待到超时</text><text x="48" y="351" font-size="17" fill="#44564e">可恢复时保留精确进度；否则关闭连接，不能靠超时重置消息边界。</text></g></svg>