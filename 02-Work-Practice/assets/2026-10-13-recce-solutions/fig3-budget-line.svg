<svg viewBox="0 0 680 336" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <title>三组选型的候选与落点，包体与依赖规范是共同的否决线</title>
  <desc>九行表格，四列是选型、候选、包体增量、多端一致性与结论。Yoga 引擎一组：直接依赖开源 yoga 被否，原因是包名与 mrn:yoga 冲突且不允许直接依赖开源组件；引入源码改包名自编译 so 入选，压缩后约增 194KB；换 Taffy 留作备选，因为缺 RTL 与 Position Static。SVG 渲染一组：RN-SVG 三端一致性高但视图节点数随子标签增长被否；androidsvg 纯原生包体最小、一致性中等而入选；rust-resvg 像素级一致但包体增加约 2.0MB 且复杂图耗时超过 1000ms 被否；thorvg 像素级一致、性能最好但增加约 600KB 被否。动画引擎一组：参考 lottie-react-native 与公司内 MRN 实现入选，按需集成；若当时与 SVG 共用 thorvg 则一致性与包体都更优，但这一条当时未评估。</desc>

  <text x="24" y="16" font-size="12" font-weight="500" fill="#1f2328" dominant-baseline="central">三组选型，一条共同的否决线</text>
  <text x="24" y="32" font-size="9" fill="#8a929c" dominant-baseline="central">结论列：绿＝入选，红＝否掉，灰＝备选或当时未评估</text>

  <rect x="24" y="44" width="632" height="24" rx="6" fill="#f2f4f7" stroke="#d9dde3" stroke-width="0.5"/>
  <text x="32" y="56" font-size="10" font-weight="500" fill="#5b6470" dominant-baseline="central">选型</text>
  <text x="120" y="56" font-size="10" font-weight="500" fill="#5b6470" dominant-baseline="central">候选</text>
  <text x="326" y="56" font-size="10" font-weight="500" fill="#5b6470" dominant-baseline="central">包体增量</text>
  <text x="424" y="56" font-size="10" font-weight="500" fill="#5b6470" dominant-baseline="central">多端一致性</text>
  <text x="512" y="56" font-size="10" font-weight="500" fill="#5b6470" dominant-baseline="central">结论</text>

  <rect x="24" y="68" width="632" height="168" fill="#fbfcfd" stroke="#d9dde3" stroke-width="0.5"/>
  <rect x="24" y="68" width="88" height="168" fill="#FDF3E7" stroke="#E8C79B" stroke-width="0.5"/>
  <text x="68" y="152" font-size="10" font-weight="500" fill="#8A4B00" text-anchor="middle" dominant-baseline="central">布局引擎</text>
  <line x1="112" y1="92" x2="656" y2="92" stroke="#eceff3" stroke-width="0.5"/>
  <line x1="112" y1="116" x2="656" y2="116" stroke="#eceff3" stroke-width="0.5"/>
  <line x1="112" y1="164" x2="656" y2="164" stroke="#eceff3" stroke-width="0.5"/>
  <line x1="112" y1="188" x2="656" y2="188" stroke="#eceff3" stroke-width="0.5"/>
  <line x1="112" y1="212" x2="656" y2="212" stroke="#eceff3" stroke-width="0.5"/>
  <text x="120" y="80" font-size="8.5" fill="#5b6470" dominant-baseline="central">直接依赖 com.facebook.yoga:yoga:3.2.1</text>
  <text x="326" y="80" font-size="8.5" fill="#5b6470" dominant-baseline="central">增量约 0</text>
  <text x="424" y="80" font-size="8.5" fill="#5b6470" dominant-baseline="central">高</text>
  <text x="512" y="80" font-size="8.5" fill="#C0392B" dominant-baseline="central">否 · 包名冲突且不许直依赖</text>
  <text x="120" y="104" font-size="8.5" fill="#5b6470" dominant-baseline="central">引入源码改包名，自编译 so</text>
  <text x="326" y="104" font-size="8.5" fill="#5b6470" dominant-baseline="central">+194KB（压缩后）</text>
  <text x="424" y="104" font-size="8.5" fill="#5b6470" dominant-baseline="central">高</text>
  <text x="512" y="104" font-size="8.5" fill="#1F7A3D" dominant-baseline="central">入选 · 与 mrn:yoga 共存</text>
  <text x="120" y="128" font-size="8.5" fill="#5b6470" dominant-baseline="central">换成 Taffy</text>
  <text x="326" y="128" font-size="8.5" fill="#5b6470" dominant-baseline="central">需重写布局引擎</text>
  <text x="424" y="128" font-size="8.5" fill="#5b6470" dominant-baseline="central">高</text>
  <text x="512" y="128" font-size="8.5" fill="#5b6470" dominant-baseline="central">备选 · 缺 RTL 与 Static</text>

  <rect x="24" y="152" width="88" height="168" fill="#EAF2FB" stroke="#B9D4F0" stroke-width="0.5"/>
  <text x="68" y="236" font-size="10" font-weight="500" fill="#1B5FA8" text-anchor="middle" dominant-baseline="central">SVG 渲染</text>
  <text x="120" y="152" font-size="8.5" fill="#5b6470" dominant-baseline="central">RN-SVG（recce-ui 解析生成节点）</text>
  <text x="326" y="152" font-size="8.5" fill="#5b6470" dominant-baseline="central">视图节点随子标签涨</text>
  <text x="424" y="152" font-size="8.5" fill="#5b6470" dominant-baseline="central">高</text>
  <text x="512" y="152" font-size="8.5" fill="#C0392B" dominant-baseline="central">否 · 开发成本与渲染性能</text>
  <text x="120" y="176" font-size="8.5" fill="#5b6470" dominant-baseline="central">androidsvg 纯原生</text>
  <text x="326" y="176" font-size="8.5" fill="#5b6470" dominant-baseline="central">最小</text>
  <text x="424" y="176" font-size="8.5" fill="#5b6470" dominant-baseline="central">中</text>
  <text x="512" y="176" font-size="8.5" fill="#1F7A3D" dominant-baseline="central">入选 · 用一致性换包体</text>
  <text x="120" y="200" font-size="8.5" fill="#5b6470" dominant-baseline="central">rust-resvg</text>
  <text x="326" y="200" font-size="8.5" fill="#5b6470" dominant-baseline="central">+2.0MB（保留文本）</text>
  <text x="424" y="200" font-size="8.5" fill="#5b6470" dominant-baseline="central">像素级</text>
  <text x="512" y="200" font-size="8.5" fill="#C0392B" dominant-baseline="central">否 · 包体与复杂图耗时</text>
  <text x="120" y="224" font-size="8.5" fill="#5b6470" dominant-baseline="central">thorvg（C++）</text>
  <text x="326" y="224" font-size="8.5" fill="#5b6470" dominant-baseline="central">+600KB</text>
  <text x="424" y="224" font-size="8.5" fill="#5b6470" dominant-baseline="central">像素级</text>
  <text x="512" y="224" font-size="8.5" fill="#C0392B" dominant-baseline="central">否 · 包体</text>

  <rect x="24" y="236" width="88" height="72" fill="#EEF5FC" stroke="#C9DFF2" stroke-width="0.5"/>
  <text x="68" y="272" font-size="10" font-weight="500" fill="#1B5FA8" text-anchor="middle" dominant-baseline="central">动画引擎</text>
  <text x="120" y="248" font-size="8.5" fill="#5b6470" dominant-baseline="central">参考 lottie-react-native 与公司内 MRN</text>
  <text x="326" y="248" font-size="8.5" fill="#5b6470" dominant-baseline="central">新增 module</text>
  <text x="424" y="248" font-size="8.5" fill="#5b6470" dominant-baseline="central">中</text>
  <text x="512" y="248" font-size="8.5" fill="#1F7A3D" dominant-baseline="central">入选 · 按需集成</text>
  <text x="120" y="284" font-size="8.5" fill="#5b6470" dominant-baseline="central">若与 SVG 共用 thorvg</text>
  <text x="326" y="284" font-size="8.5" fill="#5b6470" dominant-baseline="central">+600KB（一次）</text>
  <text x="424" y="284" font-size="8.5" fill="#5b6470" dominant-baseline="central">高</text>
  <text x="512" y="284" font-size="8.5" fill="#8a929c" dominant-baseline="central">当时未评估</text>

  <rect x="24" y="308" width="632" height="24" rx="6" fill="#FDF3E7" stroke="#E8C79B" stroke-width="0.5"/>
  <text x="32" y="320" font-size="8.5" fill="#8A4B00" dominant-baseline="central">包体余量是硬约束：点评 Android 当时余量约 1.09MB，候选方案的增量在 194KB 到 2.5MB 之间。</text>
</svg>
