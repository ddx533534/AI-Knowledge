<svg xmlns="http://www.w3.org/2000/svg" width="960" height="505" viewBox="0 0 960 505" role="img" aria-label="等待与通知：通知不是交锁"><rect width="100%" height="100%" fill="#fafbf9"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="30" y="44" font-size="24" fill="#173b30">等待与通知：通知不是交锁</text><rect x="28" y="72" width="904" height="84" rx="4" fill="#fff" stroke="#cad5cf"/><text x="46" y="102" font-size="19" fill="#173b30">A 持有 lock，发现队列为空 → wait</text><text x="46" y="132" font-size="17" fill="#46584f">释放 lock，进入等待；正常返回前必须重新获得它。</text><rect x="28" y="172" width="904" height="84" rx="4" fill="#fff2e9" stroke="#cad5cf"/><text x="46" y="202" font-size="19" fill="#173b30">B 获得 lock → 放元素 → notifyAll → 继续执行</text><text x="46" y="232" font-size="17" fill="#46584f">B 此刻仍持有 lock，A 不能立即进入。</text><rect x="28" y="272" width="904" height="84" rx="4" fill="#fff" stroke="#cad5cf"/><text x="46" y="302" font-size="19" fill="#173b30">B 退出同步块释放 lock → A 与其他线程竞争</text><text x="46" y="332" font-size="17" fill="#46584f">谁先取得锁无公平顺序保证。</text><rect x="28" y="372" width="904" height="84" rx="4" fill="#edf6ef" stroke="#cad5cf"/><text x="46" y="402" font-size="19" fill="#173b30">A 拿到 lock → while 再检查队列</text><text x="46" y="432" font-size="17" fill="#46584f">可能已被别人取空；为空就再次 wait，非空才消费。</text></g></svg>