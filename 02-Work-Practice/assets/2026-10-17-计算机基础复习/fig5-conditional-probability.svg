<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-label="条件概率：筛选已知条件后的范围"><rect width="960" height="430" fill="#fafbf9"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="30" y="43" font-size="24" fill="#173b30">条件概率：分母换成满足已知条件的范围</text><rect x="28" y="74" width="904" height="82" rx="4" fill="#fff" stroke="#cad5cf"/><text x="48" y="106" font-size="20" fill="#173b30">所有三球组合：C(10,3) = 120</text><text x="48" y="136" font-size="17" fill="#46584f">每个具体球组等可能；不是把球色分类当作等可能结果。</text><rect x="28" y="177" width="904" height="82" rx="4" fill="#fff2e9" stroke="#cad5cf"/><text x="48" y="209" font-size="20" fill="#173b30">排除全黑：C(6,3) = 20；条件范围：120 − 20 = 100</text><text x="48" y="239" font-size="17" fill="#46584f">已知至少一个白球，就只在这 100 个球组中计算。</text><rect x="28" y="280" width="904" height="115" rx="4" fill="#edf6ef" stroke="#cad5cf"/><text x="48" y="313" font-size="20" fill="#173b30">其中恰好两个白球：C(4,2) × C(6,1) = 36</text><text x="48" y="347" font-size="22" fill="#176a54">条件概率 = 36 / 100 = 9 / 25</text><text x="48" y="377" font-size="17" fill="#46584f">不是先指定抽走一个白球，再对剩下 9 个球重新抽样。</text></g></svg>