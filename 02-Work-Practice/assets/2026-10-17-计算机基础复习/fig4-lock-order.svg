<svg xmlns="http://www.w3.org/2000/svg" width="960" height="505" viewBox="0 0 960 505" role="img" aria-label="锁顺序：避免这里的循环等待"><rect width="100%" height="100%" fill="#fafbf9"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="30" y="44" font-size="24" fill="#173b30">锁顺序：避免这里的循环等待</text><rect x="28" y="72" width="904" height="84" rx="4" fill="#fff2e9" stroke="#cad5cf"/><text x="46" y="102" font-size="19" fill="#173b30">反向：A 持有锁 1 等锁 2；B 持有锁 2 等锁 1</text><text x="46" y="132" font-size="17" fill="#46584f">双方都不释放，没有退出机制时无法推进。</text><rect x="28" y="172" width="904" height="84" rx="4" fill="#edf6ef" stroke="#cad5cf"/><text x="46" y="202" font-size="19" fill="#173b30">统一：A、B 都先获取锁 1，再获取锁 2</text><text x="46" y="232" font-size="17" fill="#46584f">A 持有锁 1 时，B 等锁 1，不能越过它先拿锁 2。</text><rect x="28" y="272" width="904" height="84" rx="4" fill="#fff" stroke="#cad5cf"/><text x="46" y="302" font-size="19" fill="#173b30">A 取得锁 2 → 完成操作 → 释放两把锁</text><text x="46" y="332" font-size="17" fill="#46584f">B 随后取得锁 1，再取得锁 2。</text><rect x="28" y="372" width="904" height="84" rx="4" fill="#fff" stroke="#cad5cf"/><text x="46" y="402" font-size="19" fill="#173b30">所有相关路径都必须遵守同一个顺序</text><text x="46" y="432" font-size="17" fill="#46584f">存在一条反向获取路径，就仍不能保证避免该循环。</text></g></svg>