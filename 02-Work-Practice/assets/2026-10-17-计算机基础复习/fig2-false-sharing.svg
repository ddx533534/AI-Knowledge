<svg xmlns="http://www.w3.org/2000/svg" width="960" height="405" viewBox="0 0 960 405" role="img" aria-label="伪共享：业务独立，缓存行却共享"><rect width="100%" height="100%" fill="#fafbf9"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="30" y="44" font-size="24" fill="#173b30">伪共享：业务独立，缓存行却共享</text><rect x="28" y="72" width="904" height="84" rx="4" fill="#fff2e9" stroke="#cad5cf"/><text x="46" y="102" font-size="19" fill="#173b30">同一行：[x][y][其他相邻数据]</text><text x="46" y="132" font-size="17" fill="#46584f">核心 A 写 x、核心 B 写 y，可能反复争夺同一行的写权限。</text><rect x="28" y="172" width="904" height="84" rx="4" fill="#edf6ef" stroke="#cad5cf"/><text x="46" y="202" font-size="19" fill="#173b30">分开两行：[x][填充…]    [y][填充…]</text><text x="46" y="232" font-size="17" fill="#46584f">分别写入不同缓存行，减少这两个变量之间的伪共享。</text><rect x="28" y="272" width="904" height="84" rx="4" fill="#fff" stroke="#cad5cf"/><text x="46" y="302" font-size="19" fill="#173b30">依赖关系决定还需要访问谁；内存地址决定属于哪条行</text><text x="46" y="332" font-size="17" fill="#46584f">只读时没有这里的写权限争夺；分行也不能替代业务同步。</text></g></svg>