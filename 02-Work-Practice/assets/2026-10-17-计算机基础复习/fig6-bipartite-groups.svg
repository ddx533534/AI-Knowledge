<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-label="冲突分组是沿关系传播组别"><rect width="960" height="430" fill="#fafbf9"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="30" y="44" font-size="24" fill="#173b30">冲突名单与座位表：一步一步传播组别</text><rect x="28" y="76" width="904" height="82" rx="4" fill="#fff" stroke="#cad5cf"/><text x="48" y="108" font-size="20" fill="#173b30">冲突关系：0—1、1—2；每条关系的两端必须异组</text><text x="48" y="138" font-size="17" fill="#46584f">任选 0 为起点放 A，1 只能 B，2 只能 A。</text><rect x="28" y="178" width="904" height="82" rx="4" fill="#edf6ef" stroke="#cad5cf"/><text x="48" y="210" font-size="20" fill="#173b30">A 组：[0, 2]    B 组：[1] —— 满足已有两条关系</text><text x="48" y="240" font-size="17" fill="#46584f">0、2 没有冲突时可以同组；组只是两个可选容器的名字。</text><rect x="28" y="280" width="904" height="114" rx="4" fill="#fff2e9" stroke="#cad5cf"/><text x="48" y="313" font-size="20" fill="#173b30">若新增 2—0：两端都在 A，发现矛盾</text><text x="48" y="347" font-size="17" fill="#46584f">已分组就检查，不再次递归；未分组才分配并继续遍历。</text><text x="48" y="377" font-size="17" fill="#46584f">双向记录保证从任意端都能找到冲突对象。</text></g></svg>