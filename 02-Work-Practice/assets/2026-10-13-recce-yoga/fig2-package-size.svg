<svg viewBox="0 0 680 240" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <title>Android 包体增量对不上：被写成「增加量」的 489.52KB 其实是旧版 Yoga 的总体积</title>
  <desc>两条中性横条按同一比例画出 yoga 单独打包的压缩前体积，新版 3.2.1 是 428.52KB，旧版 1.18.0 是 489.52KB。下面两组逐项核对：主文档风险栏写的「增加 428KB / 168KB」与新版条等长，标绿；规划下同名文档与上线记录写的「增加 489.52KB / 194KB」与旧版条逐字相同，标红。两份 so 并存时增量应取新版体积，旧版那一行把总体积写成了增加量。</desc>

  <text x="40" y="20" font-size="12" font-weight="500" fill="#1f2328" dominant-baseline="central">包体增量对不上：489.52KB 是旧版总体积</text>
  <text x="40" y="40" font-size="10" fill="#5b6470" dominant-baseline="central">两条横条按同一比例画 yoga 单独打包的压缩前体积，单位 KB</text>

  <text x="40" y="76" font-size="10.5" fill="#1f2328" dominant-baseline="central">新版 Yoga 3.2.1</text>
  <rect x="180" y="63" width="332.6" height="26" rx="4" fill="#fbfcfd" stroke="#d9dde3" stroke-width="0.5"/>
  <text x="520" y="76" font-size="10" fill="#1f2328" dominant-baseline="central">428.52KB</text>

  <text x="40" y="120" font-size="10.5" fill="#1f2328" dominant-baseline="central">旧版 Yoga 1.18.0</text>
  <rect x="180" y="107" width="380" height="26" rx="4" fill="#F1EFE8" stroke="#d9dde3" stroke-width="0.5"/>
  <text x="568" y="120" font-size="10" fill="#1f2328" dominant-baseline="central">489.52KB</text>

  <rect x="40" y="151" width="10" height="10" rx="2" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="58" y="157" font-size="10.5" fill="#1f2328" dominant-baseline="central">主文档 · 五、风险：增加 428KB / 168KB —— 与新版条等长</text>

  <rect x="40" y="173" width="10" height="10" rx="2" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="58" y="179" font-size="10.5" fill="#1f2328" dominant-baseline="central">规划下同名文档与上线记录：增加 489.52KB / 194KB —— 与旧版条逐字相同</text>

  <line x1="40" y1="200" x2="640" y2="200" stroke="#d9dde3" stroke-width="0.5"/>
  <text x="40" y="220" font-size="10" fill="#5b6470" dominant-baseline="central">两份 so 并存时，增量应取新版体积。旧版那一行把「总体积」写成了「增加量」，引用前先确认基线口径。</text>
</svg>
