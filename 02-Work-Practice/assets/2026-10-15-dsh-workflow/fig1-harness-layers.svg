<svg xmlns="http://www.w3.org/2000/svg" width="600" height="655" viewBox="0 0 600 655" role="img" aria-labelledby="fig1-title fig1-desc">
<title id="fig1-title">两层 Harness：各自管什么</title>
<desc id="fig1-desc">上层是研发业务流程的控制职责，下层是模型与工具的通用执行循环。图示职责不代表当前全部约束已经程序实现。</desc>
<defs><marker id="fig1-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#7b8794" stroke-width="1.4"/></marker></defs>
<g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<rect width="600" height="655" fill="#ffffff"/>
<text x="300" y="43" text-anchor="middle" font-size="28" font-weight="600" fill="#1c252e">两层 Harness：各自管什么</text>
<text x="300" y="78" text-anchor="middle" font-size="20" font-weight="400" fill="#606a75">职责定位图 · 业务约束尚未全部补齐</text><rect x="40" y="110" width="520" height="145" rx="12" fill="#fff7ed" stroke="#d59a51" stroke-width="1.5"/><text x="300" y="150" text-anchor="middle" font-size="27" font-weight="600" fill="#965014">你的业务 Harness</text><text x="300" y="190" text-anchor="middle" font-size="24" font-weight="400" fill="#303842">安排步骤 · 审批 · 回退 · 验收</text><text x="300" y="227" text-anchor="middle" font-size="22" font-weight="400" fill="#965014">部分约束仍待程序落实</text><path d="M300 257 V291" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#fig1-arrow)"/><rect x="40" y="300" width="520" height="140" rx="12" fill="#f5f6f8" stroke="#d9dee5" stroke-width="1.5"/><text x="300" y="340" text-anchor="middle" font-size="26" font-weight="600" fill="#303842">底层运行机制（如 Codex）</text><text x="300" y="382" text-anchor="middle" font-size="23" font-weight="400" fill="#303842">模型调用 → 工具执行 → 结果反馈</text><text x="300" y="415" text-anchor="middle" font-size="22" font-weight="400" fill="#606a75">管理会话、工具与运行边界</text><path d="M300 443 V475" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#fig1-arrow)"/><rect x="40" y="485" width="520" height="100" rx="12" fill="#f5f6f8" stroke="#d9dee5" stroke-width="1.5"/><text x="300" y="525" text-anchor="middle" font-size="24" font-weight="600" fill="#303842">模型负责判断，工具负责执行</text><text x="300" y="561" text-anchor="middle" font-size="23" font-weight="400" fill="#303842">多个 Agent 可共用底层机制</text><text x="300" y="625" text-anchor="middle" font-size="24" font-weight="600" fill="#38634b">规则可以确定，实际路径可以动态</text>
</g></svg>