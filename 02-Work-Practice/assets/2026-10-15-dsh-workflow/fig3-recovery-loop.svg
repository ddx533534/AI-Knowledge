<svg xmlns="http://www.w3.org/2000/svg" width="600" height="925" viewBox="0 0 600 925" role="img" aria-labelledby="fig3-title fig3-desc">
<title id="fig3-title">建议的纠错闭环</title>
<desc id="fig3-desc">失败先记录，再选恢复方案；引擎核验后携带反馈修复，再重新验收。额度耗尽时明确停止，不能把未解决的失败直接放行。</desc>
<defs><marker id="fig3-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#7b8794" stroke-width="1.4"/></marker></defs>
<g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<rect width="600" height="925" fill="#ffffff"/>
<text x="300" y="43" text-anchor="middle" font-size="28" font-weight="600" fill="#1c252e">建议的纠错闭环</text>
<text x="300" y="80" text-anchor="middle" font-size="22" font-weight="400" fill="#965014">设计建议 · 尚未落地</text><rect x="40" y="110" width="520" height="105" rx="12" fill="#f5f6f8" stroke="#d9dee5" stroke-width="1.5"/><text x="300" y="150" text-anchor="middle" font-size="26" font-weight="600" fill="#303842">1  保存失败事实</text><text x="300" y="187" text-anchor="middle" font-size="22" font-weight="400" fill="#303842">任务、尝试、版本、预期与实际</text><path d="M300 218 V246" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#fig3-arrow)"/><rect x="40" y="255" width="520" height="105" rx="12" fill="#f5f6f8" stroke="#d9dee5" stroke-width="1.5"/><text x="300" y="295" text-anchor="middle" font-size="26" font-weight="600" fill="#303842">2  选择恢复方案</text><text x="300" y="332" text-anchor="middle" font-size="22" font-weight="400" fill="#303842">明确错误按规则；业务问题由 Agent 分析</text><path d="M300 363 V391" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#fig3-arrow)"/><rect x="40" y="400" width="520" height="105" rx="12" fill="#fff7ed" stroke="#d59a51" stroke-width="1.5"/><text x="300" y="440" text-anchor="middle" font-size="26" font-weight="600" fill="#303842">3  引擎核验方案</text><text x="300" y="477" text-anchor="middle" font-size="22" font-weight="400" fill="#303842">检查目标、审批、材料与剩余预算</text><path d="M300 508 V536" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#fig3-arrow)"/><rect x="40" y="545" width="520" height="105" rx="12" fill="#fff7ed" stroke="#d59a51" stroke-width="1.5"/><text x="300" y="585" text-anchor="middle" font-size="26" font-weight="600" fill="#303842">4  携带反馈修复</text><text x="300" y="622" text-anchor="middle" font-size="22" font-weight="400" fill="#303842">原始输入 + 失败证据 + 修复目标</text><path d="M300 653 V681" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#fig3-arrow)"/><rect x="40" y="690" width="520" height="105" rx="12" fill="#f0f7f2" stroke="#9fb9a9" stroke-width="1.5"/><text x="300" y="730" text-anchor="middle" font-size="26" font-weight="600" fill="#303842">5  重新验收</text><text x="300" y="767" text-anchor="middle" font-size="22" font-weight="400" fill="#303842">针对当前有效版本，检查修复是否有效</text><text x="300" y="854" text-anchor="middle" font-size="23" font-weight="600" fill="#38634b">通过 → 推进；未过 → 在预算内继续</text><text x="300" y="893" text-anchor="middle" font-size="23" font-weight="400" fill="#606a75">额度耗尽或需外部信息 → 明确停下</text>
</g></svg>