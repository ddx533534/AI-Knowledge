<svg xmlns="http://www.w3.org/2000/svg" width="600" height="590" viewBox="0 0 600 590" role="img" aria-labelledby="fig2-title fig2-desc">
<title id="fig2-title">任务跑完 ≠ 验收通过</title>
<desc id="fig2-desc">执行完成、验收通过和流程动作需要分开记录。该图展示建议判定，并不声称当前引擎已经这样处理。</desc>
<defs><marker id="fig2-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#7b8794" stroke-width="1.4"/></marker></defs>
<g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<rect width="600" height="590" fill="#ffffff"/>
<text x="300" y="43" text-anchor="middle" font-size="28" font-weight="600" fill="#1c252e">任务跑完 ≠ 验收通过</text>
<text x="300" y="80" text-anchor="middle" font-size="23" font-weight="400" fill="#606a75">示例：测试跑完，发现 1 项失败</text><rect x="40" y="115" width="520" height="105" rx="12" fill="#f0f7f2" stroke="#9fb9a9" stroke-width="1.5"/><text x="300" y="154" text-anchor="middle" font-size="26" font-weight="600" fill="#38634b">执行情况：已完成</text><text x="300" y="190" text-anchor="middle" font-size="23" font-weight="400" fill="#303842">测试已运行，并返回了结果</text><path d="M300 223 V253" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#fig2-arrow)"/><rect x="40" y="265" width="520" height="105" rx="12" fill="#fcf1ef" stroke="#d7a29b" stroke-width="1.5"/><text x="300" y="304" text-anchor="middle" font-size="26" font-weight="600" fill="#a34338">验收情况：未通过</text><text x="300" y="340" text-anchor="middle" font-size="23" font-weight="400" fill="#303842">报告里仍有 1 项失败</text><path d="M300 373 V403" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#fig2-arrow)"/><rect x="40" y="415" width="520" height="105" rx="12" fill="#fff7ed" stroke="#d59a51" stroke-width="1.5"/><text x="300" y="455" text-anchor="middle" font-size="26" font-weight="600" fill="#965014">流程动作：进入恢复</text><text x="300" y="491" text-anchor="middle" font-size="23" font-weight="400" fill="#303842">携带失败证据，修复后重新验收</text><text x="300" y="560" text-anchor="middle" font-size="22" font-weight="400" fill="#606a75">建议的判定方式 · 三种状态分别记录</text>
</g></svg>