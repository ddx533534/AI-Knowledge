<svg viewBox="0 0 680 452" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <title>六层判断与对应的修法</title>
  <desc>六个横条，从上到下依次是布局引擎、视图树与隐藏语义、属性协议与解析、事件分发与命中、渲染与合成、环境与设备。左列写这层的机制与判据，右列写修在哪、谁修。前三层随引擎与协议升级整批消失，后三层一次只能修一个。</desc>

  <text x="24" y="16" font-size="12" font-weight="500" fill="#1f2328" dominant-baseline="central">六层判断与修法：先认层，再决定在哪修</text>
  <text x="24" y="32" font-size="9" fill="#8a929c" dominant-baseline="central">左列＝这层的机制与判据，右列＝修在哪、谁动手</text>

  <!-- 层 1 -->
  <rect x="24" y="48" width="632" height="56" rx="6" fill="#F7FAF8" stroke="#DCE7E0" stroke-width="0.5"/>
  <rect x="24" y="48" width="3" height="56" rx="1.5" fill="#5FA97B"/>
  <text x="40" y="68" font-size="10" font-weight="500" fill="#1F6B3B" dominant-baseline="central">1　布局引擎（Yoga 版本）</text>
  <text x="40" y="88" font-size="8.5" fill="#5b6470" dominant-baseline="central">引擎停在 ≤1.18；属性写进 yoga 节点这一步本身也有遗漏</text>
  <text x="352" y="66" font-size="8.5" fill="#1F6B3B" dominant-baseline="central">升到自打包 Yoga 3.2.1（1.31 落地、1.32 跟版）</text>
  <text x="352" y="82" font-size="8.5" fill="#5b6470" dominant-baseline="central">加上补 borderWidth 的 left/right/bottom 三边写入</text>
  <text x="352" y="96" font-size="8" fill="#8a929c" dominant-baseline="central">一次解一批，业务代码不改</text>

  <!-- 层 2 -->
  <rect x="24" y="110" width="632" height="56" rx="6" fill="#F7FAF8" stroke="#DCE7E0" stroke-width="0.5"/>
  <rect x="24" y="110" width="3" height="56" rx="1.5" fill="#5FA97B"/>
  <text x="40" y="130" font-size="10" font-weight="500" fill="#1F6B3B" dominant-baseline="central">2　视图树与隐藏语义</text>
  <text x="40" y="150" font-size="8.5" fill="#5b6470" dominant-baseline="central">Android 把 display:none 展开成自身与全部子视图置 0×0</text>
  <text x="352" y="128" font-size="8.5" fill="#1F6B3B" dominant-baseline="central">在被 0 污染的地方加判断：内容尺寸为 0 就跳过</text>
  <text x="352" y="144" font-size="8.5" fill="#5b6470" dominant-baseline="central">过渡期换隐藏方式（高度归零 ＋ 全透明），或共享态存 offset</text>
  <text x="352" y="158" font-size="8" fill="#8a929c" dominant-baseline="central">所有尺寸派生量都会被污染，修在消费端比修在来源端稳</text>

  <!-- 层 3 -->
  <rect x="24" y="172" width="632" height="56" rx="6" fill="#F7FAF8" stroke="#DCE7E0" stroke-width="0.5"/>
  <rect x="24" y="172" width="3" height="56" rx="1.5" fill="#5FA97B"/>
  <text x="40" y="192" font-size="10" font-weight="500" fill="#1F6B3B" dominant-baseline="central">3　属性协议与解析</text>
  <text x="40" y="212" font-size="8.5" fill="#5b6470" dominant-baseline="central">默认值、取值域、单位、参照系四件事各端自定</text>
  <text x="352" y="190" font-size="8.5" fill="#1F6B3B" dominant-baseline="central">四件事逐项对齐：默认值 1.32、补 fit_start/fit_end 取值域</text>
  <text x="352" y="206" font-size="8.5" fill="#5b6470" dominant-baseline="central">px→dp 由 Native 修；类型不解析则在 recce_ui 侧改用 NaN</text>
  <text x="352" y="220" font-size="8" fill="#8a929c" dominant-baseline="central">兜底层能覆盖大部分流量，不必等旧版本流量退完</text>

  <!-- 层 4 -->
  <rect x="24" y="234" width="632" height="56" rx="6" fill="#FDF7F0" stroke="#EFDCC2" stroke-width="0.5"/>
  <rect x="24" y="234" width="3" height="56" rx="1.5" fill="#D9A45C"/>
  <text x="40" y="254" font-size="10" font-weight="500" fill="#8A4B00" dominant-baseline="central">4　事件分发与命中测试</text>
  <text x="40" y="274" font-size="8.5" fill="#5b6470" dominant-baseline="central">原生命中受层级与边界裁剪约束，中间层能把事件截住</text>
  <text x="352" y="252" font-size="8.5" fill="#8A4B00" dominant-baseline="central">TouchDelegate 扩热区，或重写 dispatchTouchEvent（影响面大）</text>
  <text x="352" y="268" font-size="8.5" fill="#5b6470" dominant-baseline="central">根治走框架层：on_touch_end 绕过原生手势，1.35 触摸新架构统一命中</text>
  <text x="352" y="282" font-size="8" fill="#8a929c" dominant-baseline="central">接管命中就得自己补多指、无障碍、焦点这些隐式能力</text>

  <!-- 层 5 -->
  <rect x="24" y="296" width="632" height="56" rx="6" fill="#FDF7F0" stroke="#EFDCC2" stroke-width="0.5"/>
  <rect x="24" y="296" width="3" height="56" rx="1.5" fill="#D9A45C"/>
  <text x="40" y="316" font-size="10" font-weight="500" fill="#8A4B00" dominant-baseline="central">5　渲染与合成</text>
  <text x="40" y="336" font-size="8.5" fill="#5b6470" dominant-baseline="central">差异多是「谁在什么时候算尺寸」，不是画得不一样</text>
  <text x="352" y="314" font-size="8.5" fill="#8A4B00" dominant-baseline="central">先数清每端算尺寸分几步，再看差在哪一步</text>
  <text x="352" y="330" font-size="8.5" fill="#5b6470" dominant-baseline="central">别在系统已算好的决策点上二次覆盖，覆盖就会吃掉 ResizeMode</text>
  <text x="352" y="344" font-size="8" fill="#8a929c" dominant-baseline="central">父级 opacity 属于合成顺序差异，与 RN 一致，结论是不改</text>

  <!-- 层 6 -->
  <rect x="24" y="358" width="632" height="56" rx="6" fill="#FDF5F4" stroke="#E9C0BA" stroke-width="0.5"/>
  <rect x="24" y="358" width="3" height="56" rx="1.5" fill="#C0625A"/>
  <text x="40" y="378" font-size="10" font-weight="500" fill="#A32A1C" dominant-baseline="central">6　环境与设备</text>
  <text x="40" y="398" font-size="8.5" fill="#5b6470" dominant-baseline="central">缓存值、像素密度小数、字体 fallback、ROM 差异</text>
  <text x="352" y="376" font-size="8.5" fill="#A32A1C" dominant-baseline="central">把机型名单换成结构性条件：显式声明字体、清掉尺寸缓存</text>
  <text x="352" y="392" font-size="8.5" fill="#5b6470" dominant-baseline="central">两次 round 作差产生的 1px 只能 hack，已向 RN 提 issue 与 PR</text>
  <text x="352" y="406" font-size="8" fill="#8a929c" dominant-baseline="central">hack 的形态都是「显式声明」，不显式就会换机型复发</text>

  <line x1="24" y1="426" x2="656" y2="426" stroke="#e6e9ed" stroke-width="0.5"/>
  <text x="24" y="440" font-size="8.5" fill="#8a929c" dominant-baseline="central">1 到 3 层的问题随引擎与协议升级整批消失；4 到 6 层的问题一次只能修一个，且修完还要防同一形态复发。</text>
</svg>
