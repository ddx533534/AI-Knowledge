  <title>18 份方案在四个证据维度上的强弱分布</title>
  <desc>十八行四列的矩阵，四个维度依次是文档内有可复核数字、有对照物、风险章节落到动作、有可执行的验收标准。绿格是有，橙格是部分，红格是没有或原文为空。有可复核数字的只有五行：1.28 Yoga 引入的耗时对照、1.31 Android 升 yoga 的包体明细、1.32 SVG 的耗时与包体、1.33 字体加载的缓存耗时、1.35 Android 17 的 DAU 口径。风险章节落到动作的比例也不高，1.29 Lottie、1.30 字体路径、1.31 图片重构、1.32 Image 二期、1.33 文本渐变与安全区域的风险或 todo 章节是空的或只写待定。验收标准较完整的是背景重构、Touch 指针、补属性、差异扫描四份。</desc>

