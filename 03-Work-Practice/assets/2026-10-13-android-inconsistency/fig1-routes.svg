<svg viewBox="0 0 680 384" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <title>三个判断问题落到四条解法通道</title>
  <desc>左列是按顺序问的三个问题，右列是对应的解法通道。换同版本引擎的原生 demo 还能复现，走升级即解；框架侧已写明不改，走换写法；根因没写出来，走自己补定位；有根因但没有版本落点，走先 hack 后等版本。</desc>

  <text x="24" y="16" font-size="12" font-weight="500" fill="#1f2328" dominant-baseline="central">三个问题，四条通道：先问清楚再动手</text>
  <text x="24" y="32" font-size="9" fill="#8a929c" dominant-baseline="central">左列按顺序问，问到哪一条成立就停，对应右列的解法动作</text>

  <!-- 行 1 -->
  <rect x="24" y="52" width="264" height="64" rx="6" fill="#FBFCFD" stroke="#E3E6EA" stroke-width="0.5"/>
  <text x="40" y="72" font-size="9.5" font-weight="500" fill="#1f2328" dominant-baseline="central">① 换一份同一版本引擎的原生 demo，</text>
  <text x="40" y="88" font-size="9.5" font-weight="500" fill="#1f2328" dominant-baseline="central">　　还能复现吗？</text>
  <text x="40" y="104" font-size="8" fill="#8a929c" dominant-baseline="central">布局、属性、事件类问题先走这一步</text>
  <line x1="288" y1="84" x2="336" y2="84" stroke="#C7CDD4" stroke-width="0.8"/>
  <path d="M336 84 l-6 -3 v6 z" fill="#C7CDD4"/>
  <text x="312" y="78" font-size="8" fill="#5b6470" text-anchor="middle" dominant-baseline="central">能</text>

  <rect x="340" y="52" width="316" height="64" rx="6" fill="#F7FAF8" stroke="#DCE7E0" stroke-width="0.5"/>
  <rect x="340" y="52" width="3" height="64" rx="1.5" fill="#5FA97B"/>
  <text x="356" y="74" font-size="9.5" font-weight="500" fill="#1F6B3B" dominant-baseline="central">通道 1　升级即解</text>
  <text x="356" y="92" font-size="8.5" fill="#5b6470" dominant-baseline="central">升 Recce Native SDK / wasm 到指定版本</text>
  <text x="356" y="106" font-size="8.5" fill="#5b6470" dominant-baseline="central">业务代码一行不改；1.31 与 1.32 两次跟 Yoga 解掉一批</text>

  <!-- 行 2 -->
  <rect x="24" y="128" width="264" height="64" rx="6" fill="#FBFCFD" stroke="#E3E6EA" stroke-width="0.5"/>
  <text x="40" y="148" font-size="9.5" font-weight="500" fill="#1f2328" dominant-baseline="central">② 框架侧是不是已经写明「不改」？</text>
  <text x="40" y="166" font-size="8.5" fill="#5b6470" dominant-baseline="central">判据：与 RN 一致，或 Android 原生即如此</text>
  <text x="40" y="180" font-size="8" fill="#8a929c" dominant-baseline="central">这一条最容易白等版本</text>
  <line x1="288" y1="160" x2="336" y2="160" stroke="#C7CDD4" stroke-width="0.8"/>
  <path d="M336 160 l-6 -3 v6 z" fill="#C7CDD4"/>
  <text x="312" y="154" font-size="8" fill="#5b6470" text-anchor="middle" dominant-baseline="central">是</text>

  <rect x="340" y="128" width="316" height="64" rx="6" fill="#F4F8FD" stroke="#CFE0F0" stroke-width="0.5"/>
  <rect x="340" y="128" width="3" height="64" rx="1.5" fill="#5B8FC7"/>
  <text x="356" y="150" font-size="9.5" font-weight="500" fill="#1B4F82" dominant-baseline="central">通道 2　换写法</text>
  <text x="356" y="168" font-size="8.5" fill="#5b6470" dominant-baseline="central">照第 3 章改业务代码，不要等版本</text>
  <text x="356" y="182" font-size="8.5" fill="#5b6470" dominant-baseline="central">父级 opacity、placeholder 折行、scroll_view 拦截 click</text>

  <!-- 行 3 -->
  <rect x="24" y="204" width="264" height="72" rx="6" fill="#FBFCFD" stroke="#E3E6EA" stroke-width="0.5"/>
  <text x="40" y="224" font-size="9.5" font-weight="500" fill="#1f2328" dominant-baseline="central">③ 根因写出来了吗？</text>
  <text x="40" y="242" font-size="8.5" fill="#5b6470" dominant-baseline="central">没写 → 下路；写了但没有版本落点 → 上路</text>
  <text x="40" y="258" font-size="8" fill="#8a929c" dominant-baseline="central">这一问决定「先补定位」还是「先上 hack」</text>
  <line x1="288" y1="216" x2="336" y2="216" stroke="#C7CDD4" stroke-width="0.8"/>
  <path d="M336 216 l-6 -3 v6 z" fill="#C7CDD4"/>
  <text x="312" y="210" font-size="8" fill="#5b6470" text-anchor="middle" dominant-baseline="central">有根因</text>

  <rect x="340" y="204" width="316" height="32" rx="6" fill="#FDF7F0" stroke="#EFDCC2" stroke-width="0.5"/>
  <rect x="340" y="204" width="3" height="32" rx="1.5" fill="#D9A45C"/>
  <text x="356" y="214" font-size="9" font-weight="500" fill="#8A4B00" dominant-baseline="central">通道 3　先 hack，后等版本</text>
  <text x="356" y="228" font-size="8" fill="#5b6470" dominant-baseline="central">先用第 3 章的写法顶上，同时把版本推进排期</text>

  <rect x="340" y="242" width="316" height="34" rx="6" fill="#FDF5F4" stroke="#E9C0BA" stroke-width="0.5"/>
  <rect x="340" y="242" width="3" height="34" rx="1.5" fill="#C0625A"/>
  <text x="356" y="253" font-size="9" font-weight="500" fill="#A32A1C" dominant-baseline="central">通道 4　自己补定位</text>
  <text x="356" y="267" font-size="8" fill="#5b6470" dominant-baseline="central">最小复现 → 读源码 → 给两条带代价的路</text>

  <line x1="24" y1="296" x2="656" y2="296" stroke="#e6e9ed" stroke-width="0.5"/>
  <text x="24" y="312" font-size="9" fill="#1f2328" font-weight="500" dominant-baseline="central">一条能带走的判断：升级版本是唯一能一次解掉一批问题的杠杆。</text>
  <text x="24" y="330" font-size="8.5" fill="#5b6470" dominant-baseline="central">1.31 与 1.32 两次跟 Yoga，一次消化掉 absolute 无法隐藏、三边 borderWidth 撑不起视图、display:none 与 absolute 共存的性能问题；</text>
  <text x="24" y="346" font-size="8.5" fill="#5b6470" dominant-baseline="central">1.32 同一轮又修掉 AlignSelf 相反、ResizeMode 系列、visible_area_change 数据异常。收益来自引擎本身，不是某一个属性。</text>
  <text x="24" y="368" font-size="8.5" fill="#8a929c" dominant-baseline="central">反面同样成立：只等版本、不补定位，缺口会一直挂在「只有现象」那一档里，谁也不知道它缺的是哪一步。</text>
</svg>
