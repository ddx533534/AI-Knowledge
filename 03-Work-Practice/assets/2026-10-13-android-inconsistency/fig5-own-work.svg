<svg viewBox="0 0 680 424" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <title>本人撰写的 8 份排查文档：分布、三次源码级定位与两处结论修正</title>
  <desc>上排两张卡片是 8 份排查文档的两个时间窗口，2025 年 1 月四份、2025 年 11 到 12 月四份，全部挂在问题文档下面。下排五行，三行绿的是把现象追到具体源码行为的三次定位，两行橙的是修正既有结论的地方。</desc>

  <text x="24" y="16" font-size="12" font-weight="500" fill="#1f2328" dominant-baseline="central">八份排查文档补上的东西：三次追到源码，两处改写既有结论</text>
  <text x="24" y="32" font-size="9" fill="#8a929c" dominant-baseline="central">绿＝把现象追到具体源码行为，橙＝修正了父文档已有的结论</text>

  <!-- 左卡片 -->
  <rect x="24" y="48" width="300" height="100" rx="8" fill="#FBFCFD" stroke="#E3E6EA" stroke-width="0.5"/>
  <text x="40" y="66" font-size="9.5" font-weight="500" fill="#1f2328" dominant-baseline="central">2025 年 1 月　4 份</text>
  <text x="40" y="84" font-size="8" fill="#5b6470" dominant-baseline="central">《Android 子元素定位溢出父元素时无法点击》</text>
  <text x="40" y="100" font-size="8" fill="#5b6470" dominant-baseline="central">《ScrollView 多次调用 scroll_to 动画失效》</text>
  <text x="40" y="116" font-size="8" fill="#5b6470" dominant-baseline="central">《Android ScrollView(Horizontal) 隐藏后位置被重置》</text>
  <text x="40" y="132" font-size="8" fill="#5b6470" dominant-baseline="central">《Android 元素 absolute 定位无法隐藏》</text>

  <!-- 右卡片 -->
  <rect x="356" y="48" width="300" height="100" rx="8" fill="#FBFCFD" stroke="#E3E6EA" stroke-width="0.5"/>
  <text x="372" y="66" font-size="9.5" font-weight="500" fill="#1f2328" dominant-baseline="central">2025 年 11 – 12 月　4 份</text>
  <text x="372" y="84" font-size="8" fill="#5b6470" dominant-baseline="central">《Android 图形按比例缩放后边缘像素渲染不全》</text>
  <text x="372" y="100" font-size="8" fill="#5b6470" dominant-baseline="central">《自测用例》（挂在同一问题下）</text>
  <text x="372" y="116" font-size="8" fill="#5b6470" dominant-baseline="central">《Android 边框宽度无法撑起视图》</text>
  <text x="372" y="132" font-size="8" fill="#5b6470" dominant-baseline="central">《Android 小米 K80 机型 1px 像素差》</text>

  <!-- 行 1 -->
  <rect x="24" y="186" width="632" height="34" rx="6" fill="#F7FAF8" stroke="#DCE7E0" stroke-width="0.5"/>
  <rect x="24" y="186" width="3" height="34" rx="1.5" fill="#5FA97B"/>
  <text x="40" y="198" font-size="9" fill="#1F6B3B" dominant-baseline="central">滚动位置重置：不是隐藏方式的锅，是 ScrollView 自己存的位置被自己清掉了</text>
  <text x="40" y="212" font-size="8" fill="#8a929c" dominant-baseline="central">滚动位置存在 onLayoutChange 的修正里：内容高被置 0 时 maxScrollY 也变 0，于是判定「当前位置越界」把记录改写成 0；HScrollView 连记录都没有</text>

  <!-- 行 2 -->
  <rect x="24" y="226" width="632" height="34" rx="6" fill="#F7FAF8" stroke="#DCE7E0" stroke-width="0.5"/>
  <rect x="24" y="226" width="3" height="34" rx="1.5" fill="#5FA97B"/>
  <text x="40" y="238" font-size="9" fill="#1F6B3B" dominant-baseline="central">连续 scroll_to 动画失效：系统对高频滚动有降级分支，间隔不足就退化成直接跳</text>
  <text x="40" y="252" font-size="8" fill="#8a929c" dominant-baseline="central">smoothScrollBy 里距上次滚动不足 250ms 时中止当前动画并走 scrollBy，表现上就是 animated 被当成 false；给了缩短间隔与抄 RN 插值器两条路</text>

  <!-- 行 3 -->
  <rect x="24" y="266" width="632" height="34" rx="6" fill="#F7FAF8" stroke="#DCE7E0" stroke-width="0.5"/>
  <rect x="24" y="266" width="3" height="34" rx="1.5" fill="#5FA97B"/>
  <text x="40" y="278" font-size="9" fill="#1F6B3B" dominant-baseline="central">溢出父元素点不到：事件自上而下分发，中间那层判定子树不含触点就不再往下走</text>
  <text x="40" y="292" font-size="8" fill="#8a929c" dominant-baseline="central">蓝色块先收到事件，判定子块范围不含触点，于是红色块根本没被分发到；方案是 TouchDelegate 扩热区或重写分发与拦截，两者都要改 Recce UI</text>

  <!-- 行 4 -->
  <rect x="24" y="306" width="632" height="34" rx="6" fill="#FDF7F0" stroke="#EFDCC2" stroke-width="0.5"/>
  <rect x="24" y="306" width="3" height="34" rx="1.5" fill="#D9A45C"/>
  <text x="40" y="318" font-size="9" fill="#8A4B00" dominant-baseline="central">修正一：父文档把滚动位置重置归因于「双端处理 display:none 的方式不一致」，排查文档推翻</text>
  <text x="40" y="332" font-size="8" fill="#8a929c" dominant-baseline="central">改用 ScrollView 与 HScrollView 自身的保存逻辑解释，两个平台的差异只是让这个逻辑被触发到；这条是 45 篇里唯一一处公开改写结论</text>

  <!-- 行 5 -->
  <rect x="24" y="346" width="632" height="34" rx="6" fill="#FDF7F0" stroke="#EFDCC2" stroke-width="0.5"/>
  <rect x="24" y="346" width="3" height="34" rx="1.5" fill="#D9A45C"/>
  <text x="40" y="358" font-size="9" fill="#8A4B00" dominant-baseline="central">修正二：absolute 定位无法隐藏，根因不在属性映射，在借来的引擎版本</text>
  <text x="40" y="372" font-size="8" fill="#8a929c" dominant-baseline="central">用同一段代码在 1.18 以下与 3.2.1 两版 engine 上对照，前者黑块仍有宽高、后者没有，结论改成升级引擎而不是改属性写法</text>

  <line x1="24" y1="392" x2="656" y2="392" stroke="#e6e9ed" stroke-width="0.5"/>
  <text x="24" y="406" font-size="8.5" fill="#8a929c" dominant-baseline="central">另外两次：小米机型的 1px 差确认 RN 用同一套算法，已向 RN 提 issue 与 PR；ResizeMode 一侧另附了一份自测用例。</text>
  <text x="24" y="418" font-size="8.5" fill="#8a929c" dominant-baseline="central">八份都给了两条带代价的路，所以能直接进第 2.2 节按取舍挑；父目录里另有 8 篇连根因都没有写。</text>
</svg>
