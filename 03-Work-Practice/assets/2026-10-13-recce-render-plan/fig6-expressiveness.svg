<svg viewBox="0 0 680 408" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <title>2026 规划里高级表现力七项能力在 Recce、MRN、RN 三侧的支持情况</title>
  <desc>七行五列的矩阵。列依次是优先级、能力、Recce 是否支持、MRN 是否支持、RN 是否支持。P0 的 SVG 图片、BoxShadow 阴影、蒙层-文本渐变三项 Recce 已支持，MRN 与 RN 也支持；P1 的基础点击能力 Recce 已支持，复杂手势能力 Recce 未支持而 MRN 与 RN 支持；P2 的高级动画能力只有 RN 支持；P3 的高性能列表只有 RN 支持，且原文注明 RN 没有原生实现、只有 JS 侧封装。Recce 一列用橙色底表示自研。图底说明剩下的三项在 RN 侧分别由 gesture-handler、reanimated 和 FlatList / SectionList 承担，要补的不是属性而是一整套运行时。</desc>

  <text x="24" y="16" font-size="12" font-weight="500" fill="#1f2328" dominant-baseline="central">从 Recce 视角看：先问 RN 有没有，再问自己差多少</text>

  <rect x="24" y="30" width="602" height="28" rx="6" fill="#f2f4f7" stroke="#d9dde3" stroke-width="0.5"/>
  <text x="32" y="44" font-size="10" font-weight="500" fill="#5b6470" dominant-baseline="central">优先级</text>
  <text x="88" y="44" font-size="10" font-weight="500" fill="#5b6470" dominant-baseline="central">能力</text>
  <rect x="310" y="32" width="96" height="24" rx="4" fill="#FDEDE0"/>
  <text x="358" y="44" font-size="10" font-weight="500" fill="#A05A00" text-anchor="middle" dominant-baseline="central">Recce</text>
  <text x="454" y="44" font-size="10" font-weight="500" fill="#5b6470" text-anchor="middle" dominant-baseline="central">MRN</text>
  <text x="552" y="44" font-size="10" font-weight="500" fill="#5b6470" text-anchor="middle" dominant-baseline="central">RN</text>

  <line x1="80" y1="58" x2="80" y2="290" stroke="#e3e6ea" stroke-width="0.5"/>
  <line x1="310" y1="58" x2="310" y2="290" stroke="#e3e6ea" stroke-width="0.5"/>
  <line x1="406" y1="58" x2="406" y2="290" stroke="#e3e6ea" stroke-width="0.5"/>
  <line x1="502" y1="58" x2="502" y2="290" stroke="#e3e6ea" stroke-width="0.5"/>

  <rect x="310" y="58" width="96" height="232" fill="#FDF7F0" opacity="0.55"/>

  <rect x="30" y="62" width="34" height="16" rx="4" fill="#FDEDE0"/>
  <text x="47" y="70" font-size="9.5" font-weight="500" fill="#A05A00" text-anchor="middle" dominant-baseline="central">P0</text>
  <text x="88" y="70" font-size="10" fill="#1f2328" dominant-baseline="central">SVG 图片能力</text>
  <text x="358" y="70" font-size="11" fill="#1a7f37" text-anchor="middle" dominant-baseline="central">✓</text>
  <text x="454" y="70" font-size="11" fill="#1a7f37" text-anchor="middle" dominant-baseline="central">✓</text>
  <text x="552" y="70" font-size="11" fill="#1a7f37" text-anchor="middle" dominant-baseline="central">✓</text>

  <rect x="30" y="95" width="34" height="16" rx="4" fill="#FDEDE0"/>
  <text x="47" y="103" font-size="9.5" font-weight="500" fill="#A05A00" text-anchor="middle" dominant-baseline="central">P0</text>
  <text x="88" y="103" font-size="10" fill="#1f2328" dominant-baseline="central">BoxShadow 阴影</text>
  <text x="358" y="103" font-size="11" fill="#1a7f37" text-anchor="middle" dominant-baseline="central">✓</text>
  <text x="454" y="103" font-size="11" fill="#1a7f37" text-anchor="middle" dominant-baseline="central">✓</text>
  <text x="552" y="103" font-size="11" fill="#1a7f37" text-anchor="middle" dominant-baseline="central">✓</text>

  <rect x="30" y="128" width="34" height="16" rx="4" fill="#FDEDE0"/>
  <text x="47" y="136" font-size="9.5" font-weight="500" fill="#A05A00" text-anchor="middle" dominant-baseline="central">P0</text>
  <text x="88" y="136" font-size="10" fill="#1f2328" dominant-baseline="central">蒙层 - 文本渐变</text>
  <text x="358" y="136" font-size="11" fill="#1a7f37" text-anchor="middle" dominant-baseline="central">✓</text>
  <text x="454" y="136" font-size="11" fill="#1a7f37" text-anchor="middle" dominant-baseline="central">✓</text>
  <text x="552" y="136" font-size="11" fill="#1a7f37" text-anchor="middle" dominant-baseline="central">✓</text>

  <rect x="30" y="161" width="34" height="16" rx="4" fill="#FDEDE0"/>
  <text x="47" y="169" font-size="9.5" font-weight="500" fill="#A05A00" text-anchor="middle" dominant-baseline="central">P1</text>
  <text x="88" y="169" font-size="10" fill="#1f2328" dominant-baseline="central">基础点击能力</text>
  <text x="358" y="169" font-size="11" fill="#1a7f37" text-anchor="middle" dominant-baseline="central">✓</text>
  <text x="454" y="169" font-size="11" fill="#1a7f37" text-anchor="middle" dominant-baseline="central">✓</text>
  <text x="552" y="169" font-size="11" fill="#1a7f37" text-anchor="middle" dominant-baseline="central">✓</text>

  <rect x="30" y="194" width="34" height="16" rx="4" fill="#f2f4f7"/>
  <text x="47" y="202" font-size="9.5" font-weight="500" fill="#5b6470" text-anchor="middle" dominant-baseline="central">P1</text>
  <text x="88" y="202" font-size="10" fill="#1f2328" dominant-baseline="central">复杂手势能力</text>
  <text x="358" y="202" font-size="11" fill="#C0392B" text-anchor="middle" dominant-baseline="central">✗</text>
  <text x="454" y="202" font-size="11" fill="#1a7f37" text-anchor="middle" dominant-baseline="central">✓</text>
  <text x="552" y="202" font-size="11" fill="#1a7f37" text-anchor="middle" dominant-baseline="central">✓</text>

  <rect x="30" y="227" width="34" height="16" rx="4" fill="#f2f4f7"/>
  <text x="47" y="235" font-size="9.5" font-weight="500" fill="#5b6470" text-anchor="middle" dominant-baseline="central">P2</text>
  <text x="88" y="235" font-size="10" fill="#1f2328" dominant-baseline="central">高级动画能力</text>
  <text x="358" y="235" font-size="11" fill="#C0392B" text-anchor="middle" dominant-baseline="central">✗</text>
  <text x="454" y="235" font-size="11" fill="#C0392B" text-anchor="middle" dominant-baseline="central">✗</text>
  <text x="552" y="235" font-size="11" fill="#1a7f37" text-anchor="middle" dominant-baseline="central">✓</text>

  <rect x="30" y="260" width="34" height="16" rx="4" fill="#f2f4f7"/>
  <text x="47" y="268" font-size="9.5" font-weight="500" fill="#5b6470" text-anchor="middle" dominant-baseline="central">P3</text>
  <text x="88" y="265" font-size="10" fill="#1f2328" dominant-baseline="central">高性能列表</text>
  <text x="358" y="268" font-size="11" fill="#C0392B" text-anchor="middle" dominant-baseline="central">✗</text>
  <text x="454" y="268" font-size="11" fill="#C0392B" text-anchor="middle" dominant-baseline="central">✗</text>
  <rect x="522" y="259" width="34" height="18" rx="4" fill="#EAF7EE"/>
  <text x="539" y="268" font-size="11" fill="#1a7f37" text-anchor="middle" dominant-baseline="central">✓</text>

  <rect x="24" y="304" width="632" height="88" rx="8" fill="#fbfcfd" stroke="#d9dde3" stroke-width="0.5"/>
  <text x="40" y="324" font-size="10.5" font-weight="500" fill="#1f2328" dominant-baseline="central">前四行和后三行不是一类东西</text>
  <text x="40" y="344" font-size="9.5" fill="#5b6470" dominant-baseline="central">前四项补的是属性或系统级能力，落地路径清楚：定义属性、三端各实现一遍、写用例回归。</text>
  <text x="40" y="362" font-size="9.5" fill="#5b6470" dominant-baseline="central">后三项在 RN 侧分别由 react-native-gesture-handler、react-native-reanimated 和 FlatList / SectionList 承担，</text>
  <text x="40" y="380" font-size="9.5" fill="#5b6470" dominant-baseline="central">原文还写明高性能列表「没有原生实现，只有 js 侧封装，这块 React Native 是个短板」。</text>
</svg>
