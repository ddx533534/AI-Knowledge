let selected=null, visible=[], visibleEdges=[], drag=null;
const $=id=>document.getElementById(id);
function element(tag,attrs={},text){const el=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))el.setAttribute(k,v);if(text!==undefined)el.textContent=text;return el;}
function relativeLink(path){return '../'+path.split('/').map(encodeURIComponent).join('/');}
function addLink(label,path){const a=document.createElement('a');a.textContent=label+' · '+path;a.href=relativeLink(path);$('links').append(a);}
function select(id){selected=id;const n=byId.get(id);if(!n)return;
 $('detail-title').textContent=n.title;$('detail-text').textContent=n.kind==='document'?'归档文档；归档时间不等于事实核实时间。':`类型：${types[n.type]||n.type}；核实状态：${statuses[n.status]||n.status}`;
 $('links').replaceChildren();if(n.kind==='document'){addLink(n.title,n.artifact||n.path);}else{addLink('知识节点',n.path);for(const docId of new Set((n.sources||[]).map(s=>s.document_id))){const doc=byId.get('doc:'+docId);if(doc)addLink(doc.title,doc.artifact||doc.path);}}
 $('metadata').textContent=n.kind==='document'?`来源项目：${n.project}\n来源路径：${n.source_path}\n归档时间：${n.captured_at}\nSHA-256：${n.sha256}`:(n.sources||[]).map((s,i)=>`证据 ${i+1}：${byId.get('doc:'+s.document_id)?.title||s.document_id}\n定位：${s.locator}`).join('\n\n');
 const relations=data.edges.filter(e=>e.source===id||e.target===id);$('relations').replaceChildren();
 const ul=document.createElement('ul');for(const e of relations){const li=document.createElement('li');const target=byId.get(e.source===id?e.target:e.source);const button=document.createElement('button');button.textContent=(e.source===id?'→ ':'← ')+e.label+'：'+target.title;button.onclick=()=>select(target.id);li.append(button);const p=document.createElement('p');p.textContent=e.explanation;li.append(p);ul.append(li);} $('relations').append(ul);
 $('list').value=id;draw();

function arrange(){positions.clear();const groups=[visible.filter(n=>n.kind==='knowledge'),visible.filter(n=>n.kind==='document')];
 groups.forEach((members,g)=>members.forEach((n,i)=>{const a=2*Math.PI*i/Math.max(members.length,1)-Math.PI/2;const radius=members.length===1?0:(g===0?180:270);positions.set(n.id,{x:500+radius*Math.cos(a)+(members.length===1?(g===0?-160:160):0),y:325+radius*Math.sin(a)});}));
}
function render(){const q=$('search').value.toLocaleLowerCase(),mode=$('mode').value;
 visible=data.nodes.filter(n=>(mode==='all'||n.kind===mode)&&[n.title,n.type,n.project,...(n.tags||[])].filter(Boolean).join(' ').toLocaleLowerCase().includes(q));
 const ids=new Set(visible.map(n=>n.id));visibleEdges=data.edges.filter(e=>ids.has(e.source)&&ids.has(e.target));
 $('list').replaceChildren();for(const n of visible){const opt=document.createElement('option');opt.value=n.id;opt.textContent=n.title;$('list').append(opt);} if(selected)$('list').value=selected;

function draw(){for(const name of ['edges','labels','nodes'])$(name).replaceChildren();
 for(const e of visibleEdges){const a=positions.get(e.source),b=positions.get(e.target);if(!a||!b)continue;const line=element('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,class:'edge'+(e.type==='evidence'?' evidence':''),'marker-end':e.type==='evidence'?'':'url(#arrow)'});line.append(element('title',{},e.explanation));$('edges').append(line);$('labels').append(element('text',{x:(a.x+b.x)/2,y:(a.y+b.y)/2-7,'text-anchor':'middle',class:'edge-label'},e.label));}
 for(const n of visible){const p=positions.get(n.id);const g=element('g',{transform:`translate(${p.x},${p.y})`,class:'node'+(n.id===selected?' selected':''),tabindex:'0',role:'button','aria-label':n.title});g.append(element('circle',{r:n.kind==='knowledge'?15:11,fill:n.kind==='knowledge'?'#277c9d':'#e2a653'}));g.append(element('text',{y:31,'text-anchor':'middle'},n.title.length>22?n.title.slice(0,22)+'…':n.title));g.append(element('title',{},n.title));g.onclick=()=>select(n.id);g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(n.id);}};g.onpointerdown=e=>{if(e.button!==0)return;drag=n.id;$('graph').setPointerCapture(e.pointerId);};$('nodes').append(g);}
}
$('graph').onpointermove=e=>{if(!drag)return;const pt=$('graph').createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const p=pt.matrixTransform($('graph').getScreenCTM().inverse());positions.set(drag,{x:Math.max(25,Math.min(975,p.x)),y:Math.max(25,Math.min(610,p.y))});draw();};
