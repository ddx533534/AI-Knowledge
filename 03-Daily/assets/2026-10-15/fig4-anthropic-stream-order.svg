<svg viewBox="0 0 680 320" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Anthropic 两个 SDK 同日放宽流式事件顺序，并默认加上 tracing</title>
  <desc>TypeScript SDK 0.134.0 和 Python SDK 1.14.0 都在 2026-10-14 改了同一处：message_start 之前到达的事件不再抛 Unexpected event order，未知事件类型也不再被丢掉，改成原样交给调用方。同一个版本给 API 调用、流式响应和工具运行加上了 OpenTelemetry span，只有应用注册过 tracer provider 时才产生，可以用参数或环境变量整体关掉。</desc>

  <rect x="24" y="28" width="300" height="112" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="44" y="52" font-size="12.5" font-weight="500" fill="#633806" dominant-baseline="central">改之前</text>
  <text x="44" y="76" font-size="11.5" fill="#854F0B" dominant-baseline="central">message_start 之前来的事件</text>
  <text x="44" y="94" font-size="11.5" fill="#854F0B" dominant-baseline="central">直接抛 Unexpected event order</text>
  <text x="44" y="118" font-size="11.5" fill="#854F0B" dominant-baseline="central">没见过的类型，丢掉</text>

  <rect x="356" y="28" width="300" height="112" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="376" y="52" font-size="12.5" font-weight="500" fill="#27500A" dominant-baseline="central">改之后</text>
  <text x="376" y="76" font-size="11.5" fill="#3B6D11" dominant-baseline="central">早到的事件照样 yield 出来</text>
  <text x="376" y="94" font-size="11.5" fill="#3B6D11" dominant-baseline="central">不再抛错</text>
  <text x="376" y="118" font-size="11.5" fill="#3B6D11" dominant-baseline="central">未知类型原样透传</text>

  <line x1="326" y1="84" x2="354" y2="84" stroke="#888780" stroke-width="1"/>
  <path d="M354 84 l-7 -4 l0 8 z" fill="#888780"/>

  <rect x="24" y="158" width="632" height="46" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="44" y="174" font-size="11.5" fill="#0C447C" dominant-baseline="central">TypeScript sdk-v0.134.0：tolerate unknown event types / stop throwing "Unexpected event order" / yield events</text>
  <text x="44" y="192" font-size="11.5" fill="#0C447C" dominant-baseline="central">Python v1.14.0：pass unknown event types through / stop raising "Unexpected event order"</text>

  <rect x="24" y="220" width="632" height="76" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="44" y="240" font-size="12" font-weight="500" fill="#2C2C2A" dominant-baseline="central">同一版加上的 OpenTelemetry</text>
  <text x="44" y="262" font-size="11.5" fill="#444441" dominant-baseline="central">API 调用、流式响应、工具运行各出一个 span。应用没注册 tracer provider 就一个都不产生</text>
  <text x="44" y="282" font-size="11.5" fill="#444441" dominant-baseline="central">TS 侧新增依赖 @opentelemetry/api ^1.4.1；可用 openTelemetry: false 或 ANTHROPIC_OPEN_TELEMETRY=false 关掉</text>
</svg>
