<svg viewBox="0 0 680 428" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>assistant-ui 里模型产出到界面的两条路</title>
  <desc>上面一条路是模型直接写 HTML 或 SVG，代码流进一个独立 origin 的 iframe，按块到达就地改 DOM，脚本等写完整了再按顺序跑一次。下面一条路是模型对自家组件目录打 JSONL 的 JSON Patch，不经过 iframe，用你自己的组件渲染。两条路的入口互不 import，用测试强制边界。React Native 上 spec 这一路通过包导出里的 react-native 条件解析到原生构建。</desc>

  <text x="24" y="26" font-size="12" font-weight="500" fill="#2C2C2A">两条路，各管一种产出</text>

  <rect x="24" y="40" width="180" height="60" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="114" y="60" text-anchor="middle" font-size="12" font-weight="500" fill="#633806" dominant-baseline="central">模型写 HTML / SVG</text>
  <text x="114" y="80" text-anchor="middle" font-size="11.5" fill="#854F0B" dominant-baseline="central">一整段代码</text>

  <line x1="206" y1="70" x2="242" y2="70" stroke="#888780" stroke-width="1"/>
  <path d="M242 70 l-7 -4 l0 8 z" fill="#888780"/>

  <rect x="244" y="40" width="200" height="60" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="344" y="60" text-anchor="middle" font-size="12" font-weight="500" fill="#0C447C" dominant-baseline="central">Safe Content Frame</text>
  <text x="344" y="80" text-anchor="middle" font-size="11.5" fill="#185FA5" dominant-baseline="central">独立 origin 的 iframe</text>

  <line x1="446" y1="70" x2="482" y2="70" stroke="#888780" stroke-width="1"/>
  <path d="M482 70 l-7 -4 l0 8 z" fill="#888780"/>

  <rect x="484" y="40" width="172" height="60" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="570" y="60" text-anchor="middle" font-size="12" font-weight="500" fill="#2C2C2A" dominant-baseline="central">分块到达，就地改</text>
  <text x="570" y="80" text-anchor="middle" font-size="11.5" fill="#444441" dominant-baseline="central">脚本写完整了跑一次</text>

  <rect x="24" y="128" width="180" height="60" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="114" y="148" text-anchor="middle" font-size="12" font-weight="500" fill="#633806" dominant-baseline="central">模型写 JSONL patch</text>
  <text x="114" y="168" text-anchor="middle" font-size="11.5" fill="#854F0B" dominant-baseline="central">每行一条 JSON Patch</text>

  <line x1="206" y1="158" x2="242" y2="158" stroke="#888780" stroke-width="1"/>
  <path d="M242 158 l-7 -4 l0 8 z" fill="#888780"/>

  <rect x="244" y="128" width="200" height="60" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="344" y="148" text-anchor="middle" font-size="12" font-weight="500" fill="#27500A" dominant-baseline="central">你定义的组件目录</text>
  <text x="344" y="168" text-anchor="middle" font-size="11.5" fill="#3B6D11" dominant-baseline="central">不进 iframe</text>

  <line x1="446" y1="158" x2="482" y2="158" stroke="#888780" stroke-width="1"/>
  <path d="M482 158 l-7 -4 l0 8 z" fill="#888780"/>

  <rect x="484" y="128" width="172" height="60" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="570" y="148" text-anchor="middle" font-size="12" font-weight="500" fill="#2C2C2A" dominant-baseline="central">你自己的组件渲染</text>
  <text x="570" y="168" text-anchor="middle" font-size="11.5" fill="#444441" dominant-baseline="central">设计系统不变</text>

  <rect x="24" y="204" width="632" height="52" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="44" y="222" font-size="11.5" fill="#2C2C2A" dominant-baseline="central">两条路的入口互不 import：只渲染 HTML 的应用不会打进 spec 的代码，反过来也一样。</text>
  <text x="44" y="242" font-size="11.5" fill="#444441" dominant-baseline="central">仓库里用 src/bundle-boundary.test.ts 把这条边界钉住。</text>

  <text x="24" y="284" font-size="12" font-weight="500" fill="#444441">跨到 React Native 靠的是包的导出条件</text>

  <rect x="24" y="298" width="632" height="46" rx="10" fill="#FFFFFF" stroke="#C9C7BE" stroke-width="0.5"/>
  <text x="44" y="321" font-size="11.5" fill="#2C2C2A" dominant-baseline="central">generative-frame/spec/react 与 /spec/assistant-ui 在 exports 里各有一条 "react-native" 分支，指向 .native 构建</text>

  <rect x="24" y="354" width="632" height="60" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="44" y="374" font-size="11.5" font-weight="500" fill="#0C447C" dominant-baseline="central">RN 侧的 Metro 集成：@assistant-ui/metro 0.0.17</text>
  <text x="44" y="394" font-size="11.5" fill="#185FA5" dominant-baseline="central">metro.config.js 套一层 withAui，把 "use generative" 的工具定义（schema、服务端 execute、客户端 render 在同一个文件）</text>
  <text x="44" y="410" font-size="11.5" fill="#185FA5" dominant-baseline="central">编成设备端要的那份。Expo 和裸 RN 都能用</text>
</svg>
