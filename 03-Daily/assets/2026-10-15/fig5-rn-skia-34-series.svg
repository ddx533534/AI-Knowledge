<svg viewBox="0 0 680 372" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>React Native Skia 在 10 月 11 日到 14 日连发五个版本</title>
  <desc>v3.4.0 在 10 月 11 日把 Skia Graphite 和 Dawn 的支持扩到 tvOS；v3.4.1 在 10 月 12 日补依赖；v3.4.2 在 10 月 13 日丢掉 Graphite 拒收的录制、把 Canvas ref 句柄只建一次；v3.4.3 和 v3.4.4 在 10 月 14 日共享 WebGL context、修 context 注册。同一窗口里 Flutter 在 10 月 14 日打出 3.50.0-0.1.pre 的 beta tag。</desc>

  <line x1="60" y1="250" x2="640" y2="250" stroke="#C9C7BE" stroke-width="1"/>

  <text x="60" y="272" font-size="11" fill="#888780" text-anchor="middle">10-11</text>
  <text x="205" y="272" font-size="11" fill="#888780" text-anchor="middle">10-12</text>
  <text x="350" y="272" font-size="11" fill="#888780" text-anchor="middle">10-13</text>
  <text x="495" y="272" font-size="11" fill="#888780" text-anchor="middle">10-14</text>
  <text x="625" y="272" font-size="11" fill="#888780" text-anchor="middle">10-15</text>

  <line x1="60" y1="246" x2="60" y2="254" stroke="#C9C7BE" stroke-width="1"/>
  <line x1="205" y1="246" x2="205" y2="254" stroke="#C9C7BE" stroke-width="1"/>
  <line x1="350" y1="246" x2="350" y2="254" stroke="#C9C7BE" stroke-width="1"/>
  <line x1="495" y1="246" x2="495" y2="254" stroke="#C9C7BE" stroke-width="1"/>

  <rect x="24" y="28" width="632" height="46" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="44" y="44" font-size="11.5" font-weight="500" fill="#0C447C" dominant-baseline="central">v3.4.0 · 10-11</text>
  <text x="44" y="62" font-size="11.5" fill="#185FA5" dominant-baseline="central">support tvOS for Skia Graphite and Dawn</text>

  <rect x="24" y="84" width="632" height="46" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="44" y="100" font-size="11.5" font-weight="500" fill="#2C2C2A" dominant-baseline="central">v3.4.1 · 10-12</text>
  <text x="44" y="118" font-size="11.5" fill="#444441" dominant-baseline="central">补上漏掉的 tvOS 依赖包</text>

  <rect x="24" y="140" width="632" height="46" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="44" y="156" font-size="11.5" font-weight="500" fill="#2C2C2A" dominant-baseline="central">v3.4.2 · 10-13</text>
  <text x="44" y="174" font-size="11.5" fill="#444441" dominant-baseline="central">丢掉 Graphite 拒收的录制，不再重排队（#4197）；Canvas ref 句柄只建一次（#4215）</text>

  <rect x="24" y="196" width="632" height="46" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="44" y="212" font-size="11.5" font-weight="500" fill="#27500A" dominant-baseline="central">v3.4.3 与 v3.4.4 · 10-14</text>
  <text x="44" y="230" font-size="11.5" fill="#3B6D11" dominant-baseline="central">多个 surface 共用一份 WebGL context（#4221）；修 context 注册（#4242）</text>

  <rect x="24" y="290" width="632" height="70" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="44" y="310" font-size="12" font-weight="500" fill="#633806" dominant-baseline="central">同一窗口里的另一条线：Flutter 3.50 进了 beta</text>
  <text x="44" y="330" font-size="11.5" fill="#854F0B" dominant-baseline="central">flutter/flutter 在 10-14 打出 3.50.0-0.1.pre，release 正文只有一行「Bump engine.version for 3.50 beta release」</text>
  <text x="44" y="348" font-size="11.5" fill="#854F0B" dominant-baseline="central">网上流传的 Impeller 收尾、Wasm 转正这些说法，官方那份 release 页面里没有，当未核实</text>
</svg>
