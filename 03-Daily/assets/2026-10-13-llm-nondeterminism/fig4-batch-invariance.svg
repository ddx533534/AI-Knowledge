<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 366" width="680" height="366" role="img">
  <rect x="0" y="0" width="680" height="366" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="679" height="365" rx="6" fill="none" stroke="#e5e7eb"/>

  <text x="40" y="34" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#8a929b">同一个矩阵乘，算一行和整批算完再取一行，结果对不上 —— 这就是不具 batch 不变性</text>

  <rect x="32" y="50" width="298" height="248" rx="6" fill="#fbfbfc" stroke="#e5e7eb"/>
  <text x="181" y="72" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#1c1f24">单独算第 1 行</text>

  <rect x="60" y="104" width="242" height="34" rx="4" fill="#eef3f8" stroke="#2f5d8a"/>
  <text x="181" y="126" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#2f5d8a">第 1 行</text>

  <line x1="181" y1="146" x2="181" y2="166" stroke="#8a929b" stroke-width="1.2"/>
  <path d="M181 170l-4-6h8z" fill="#8a929b"/>

  <rect x="60" y="174" width="242" height="44" rx="4" fill="#ffffff" stroke="#d5d9df"/>
  <text x="181" y="201" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#1c1f24">(1 × 4096) × (4096 × 4096)</text>

  <line x1="181" y1="218" x2="181" y2="238" stroke="#8a929b" stroke-width="1.2"/>
  <path d="M181 242l-4-6h8z" fill="#8a929b"/>

  <rect x="60" y="246" width="242" height="34" rx="4" fill="#eef3f8" stroke="#2f5d8a"/>
  <text x="181" y="268" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#2f5d8a">结果 R₁</text>

  <rect x="350" y="50" width="298" height="248" rx="6" fill="#fbfbfc" stroke="#e5e7eb"/>
  <text x="499" y="72" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#1c1f24">整批一起算，再取第 1 行</text>

  <rect x="378" y="88" width="242" height="26" rx="4" fill="#faf1e8" stroke="#c2761a"/>
  <text x="499" y="106" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#a8641a">第 1 行</text>
  <rect x="378" y="116" width="242" height="26" rx="4" fill="#f2f3f5" stroke="#e5e7eb"/>
  <text x="499" y="134" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#8a929b">第 2 行</text>
  <rect x="378" y="144" width="242" height="26" rx="4" fill="#f2f3f5" stroke="#e5e7eb"/>
  <text x="499" y="162" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#8a929b">… 第 2048 行</text>

  <line x1="499" y1="174" x2="499" y2="194" stroke="#8a929b" stroke-width="1.2"/>
  <path d="M499 198l-4-6h8z" fill="#8a929b"/>

  <rect x="378" y="202" width="242" height="30" rx="4" fill="#ffffff" stroke="#d5d9df"/>
  <text x="499" y="222" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#1c1f24">(2048 × 4096) × (4096 × 4096)</text>

  <line x1="499" y1="238" x2="499" y2="250" stroke="#8a929b" stroke-width="1.2"/>
  <path d="M499 254l-4-6h8z" fill="#8a929b"/>

  <rect x="378" y="258" width="242" height="30" rx="4" fill="#faf1e8" stroke="#c2761a"/>
  <text x="499" y="278" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#a8641a">结果 R₂</text>

  <text x="340" y="322" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#b3402f">R₁ ≠ R₂，最大绝对差 1669.25</text>
  <text x="340" y="348" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#8a929b">两次各自都是 run-to-run 确定的：同一个脚本重跑多少遍，结果都不变</text>
</svg>
