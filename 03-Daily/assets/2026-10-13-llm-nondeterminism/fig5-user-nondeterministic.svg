<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 272" width="680" height="272" role="img">
  <rect x="0" y="0" width="680" height="272" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="679" height="271" rx="6" fill="none" stroke="#e5e7eb"/>

  <text x="40" y="34" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#8a929b">单个用户视角：他自己的请求固定不变，但「同时还有谁在问」每次都不一样</text>

  <rect x="40" y="56" width="180" height="60" rx="4" fill="#ffffff" stroke="#d5d9df"/>
  <text x="130" y="80" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#1c1f24">我的请求</text>
  <text x="130" y="100" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8a929b">每次一字不差</text>

  <rect x="228" y="56" width="180" height="60" rx="4" fill="#faf1e8" stroke="#c2761a"/>
  <text x="318" y="80" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#a8641a">此刻的服务负载</text>
  <text x="318" y="100" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#a8641a">用户既看不到也控制不了</text>

  <line x1="228" y1="124" x2="408" y2="124" stroke="#c9ced6" stroke-width="1"/>
  <line x1="317" y1="124" x2="317" y2="132" stroke="#8a929b" stroke-width="1.2"/>
  <path d="M317 136l-4-6h8z" fill="#8a929b"/>

  <rect x="228" y="140" width="180" height="46" rx="4" fill="#ffffff" stroke="#d5d9df"/>
  <text x="318" y="160" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1c1f24">前向计算</text>
  <text x="318" y="178" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8a929b">按当时的 batch 大小切成 kernel</text>

  <line x1="416" y1="163" x2="446" y2="163" stroke="#8a929b" stroke-width="1.2"/>
  <path d="M450 163l-6-4v8z" fill="#8a929b"/>

  <rect x="454" y="140" width="186" height="46" rx="4" fill="#fae9e6" stroke="#b3402f"/>
  <text x="547" y="160" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#b3402f">我的输出</text>
  <text x="547" y="178" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#b3402f">跟着别人的负载变</text>

  <line x1="40" y1="206" x2="640" y2="206" stroke="#e5e7eb" stroke-width="1"/>

  <text x="40" y="234" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" fill="#4a5158">把「kernel 不具不变性的那个维度（batch 大小）」和「这个维度本身的不确定性（服务器负载）」</text>
  <text x="40" y="256" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" fill="#4a5158">串起来，就得到一个不确定的系统。CPU、TPU 上的推理服务同样有这个来源。</text>
</svg>
