<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="680" height="340" role="img">
  <rect x="0" y="0" width="680" height="340" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="679" height="339" rx="6" fill="none" stroke="#e5e7eb"/>

  <text x="40" y="34" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#8a929b">四个核心各算出一份部分和，都要累加到同一个元素上；硬件只保证都加进去，不保证先后</text>

  <text x="52" y="66" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#1c1f24">执行 1：完成的先后顺序</text>
  <rect x="40" y="78" width="272" height="204" rx="6" fill="#fbfbfc" stroke="#e5e7eb"/>
  <g font-family="Menlo, Consolas, monospace" font-size="14">
    <rect x="56" y="94" width="240" height="34" rx="4" fill="#ffffff" stroke="#d5d9df"/>
    <text x="70" y="116" fill="#1c1f24">核心 3 的部分和</text>
    <rect x="56" y="136" width="240" height="34" rx="4" fill="#ffffff" stroke="#d5d9df"/>
    <text x="70" y="158" fill="#1c1f24">核心 1 的部分和</text>
    <rect x="56" y="178" width="240" height="34" rx="4" fill="#ffffff" stroke="#d5d9df"/>
    <text x="70" y="200" fill="#1c1f24">核心 0 的部分和</text>
    <rect x="56" y="220" width="240" height="34" rx="4" fill="#ffffff" stroke="#d5d9df"/>
    <text x="70" y="242" fill="#1c1f24">核心 2 的部分和</text>
  </g>
  <text x="180" y="272" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#2f5d8a">累加结果 A</text>

  <text x="396" y="66" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#1c1f24">执行 2：完成的先后顺序</text>
  <rect x="384" y="78" width="272" height="204" rx="6" fill="#fbfbfc" stroke="#e5e7eb"/>
  <g font-family="Menlo, Consolas, monospace" font-size="14">
    <rect x="400" y="94" width="240" height="34" rx="4" fill="#ffffff" stroke="#d5d9df"/>
    <text x="414" y="116" fill="#1c1f24">核心 0 的部分和</text>
    <rect x="400" y="136" width="240" height="34" rx="4" fill="#ffffff" stroke="#d5d9df"/>
    <text x="414" y="158" fill="#1c1f24">核心 2 的部分和</text>
    <rect x="400" y="178" width="240" height="34" rx="4" fill="#ffffff" stroke="#d5d9df"/>
    <text x="414" y="200" fill="#1c1f24">核心 3 的部分和</text>
    <rect x="400" y="220" width="240" height="34" rx="4" fill="#ffffff" stroke="#d5d9df"/>
    <text x="414" y="242" fill="#1c1f24">核心 1 的部分和</text>
  </g>
  <text x="520" y="272" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#b3402f">累加结果 B</text>

  <text x="340" y="272" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#b3402f">≠</text>

  <text x="340" y="314" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#8a929b">每个核心贡献的都是同一批数值，只是顺序不同 —— 这叫 run-to-run 不确定性</text>
</svg>
