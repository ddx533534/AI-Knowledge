<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 348" width="680" height="348" role="img">
  <rect x="0" y="0" width="680" height="348" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="679" height="347" rx="6" fill="none" stroke="#e5e7eb"/>

  <text x="40" y="34" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#8a929b">同一个推理服务，两种说法同时成立 —— 差别只在把「并发负载」算不算成输入</text>

  <rect x="30" y="50" width="300" height="232" rx="6" fill="#fbfbfc" stroke="#e5e7eb"/>
  <text x="180" y="72" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#2f5d8a">服务端视角：确定</text>

  <rect x="48" y="88" width="264" height="48" rx="4" fill="#ffffff" stroke="#d5d9df"/>
  <text x="180" y="109" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#1c1f24">同一组用户请求</text>
  <text x="180" y="127" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8a929b">完全一致，含并发请求</text>

  <line x1="180" y1="136" x2="180" y2="156" stroke="#8a929b" stroke-width="1.2"/>
  <path d="M180 160l-4-6h8z" fill="#8a929b"/>

  <rect x="48" y="162" width="264" height="44" rx="4" fill="#ffffff" stroke="#d5d9df"/>
  <text x="180" y="189" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#1c1f24">前向计算</text>

  <line x1="180" y1="206" x2="180" y2="226" stroke="#8a929b" stroke-width="1.2"/>
  <path d="M180 230l-4-6h8z" fill="#8a929b"/>

  <rect x="48" y="232" width="264" height="38" rx="4" fill="#eef3f8" stroke="#c9d7e5"/>
  <text x="180" y="256" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#2f5d8a">每次跑出来的输出完全一样</text>

  <rect x="350" y="50" width="300" height="232" rx="6" fill="#fbfbfc" stroke="#e5e7eb"/>
  <text x="500" y="72" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#b3402f">用户视角：不确定</text>

  <rect x="368" y="88" width="264" height="48" rx="4" fill="#ffffff" stroke="#d5d9df"/>
  <text x="500" y="109" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#1c1f24">我的请求（固定不变）</text>
  <text x="500" y="127" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#c2761a">＋ 恰好同时在线的其他用户（每次不同）</text>

  <line x1="500" y1="136" x2="500" y2="156" stroke="#8a929b" stroke-width="1.2"/>
  <path d="M500 160l-4-6h8z" fill="#8a929b"/>

  <rect x="368" y="162" width="264" height="44" rx="4" fill="#ffffff" stroke="#d5d9df"/>
  <text x="500" y="189" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#1c1f24">前向计算（按当前 batch 大小切分）</text>

  <line x1="500" y1="206" x2="500" y2="226" stroke="#8a929b" stroke-width="1.2"/>
  <path d="M500 230l-4-6h8z" fill="#8a929b"/>

  <rect x="368" y="232" width="264" height="38" rx="4" fill="#faf1e8" stroke="#e3c9a8"/>
  <text x="500" y="256" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#a8641a">输出随当时的 batch 大小改变</text>

  <text x="340" y="322" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#8a929b">核函数对 batch 大小不具不变性 × 负载本身不定 = 整个系统对用户而言不确定</text>
</svg>
