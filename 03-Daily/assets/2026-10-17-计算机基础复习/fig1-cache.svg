<svg xmlns="http://www.w3.org/2000/svg" width="960" height="405" viewBox="0 0 960 405" role="img" aria-label="缓存行：首次访问加载邻近元素"><rect width="100%" height="100%" fill="#fafbf9"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="30" y="44" font-size="24" fill="#173b30">缓存行：首次访问加载邻近元素</text><rect x="28" y="72" width="904" height="84" rx="4" fill="#fff" stroke="#cad5cf"/><text x="46" y="102" font-size="19" fill="#173b30">假设：64 字节一行，8 字节一个元素，起始地址对齐</text><text x="46" y="132" font-size="17" fill="#46584f">缓存开始为空，忽略预取和其他访问导致的替换。</text><rect x="28" y="172" width="904" height="84" rx="4" fill="#edf6ef" stroke="#cad5cf"/><text x="46" y="202" font-size="19" fill="#173b30">a[0] 未命中 → 加载 a[0]～a[7]</text><text x="46" y="232" font-size="17" fill="#46584f">a[1]～a[7] 命中：1 次未命中，7 次命中。</text><rect x="28" y="272" width="904" height="84" rx="4" fill="#edf6ef" stroke="#cad5cf"/><text x="46" y="302" font-size="19" fill="#173b30">a[8] 未命中 → 加载 a[8]～a[15]</text><text x="46" y="332" font-size="17" fill="#46584f">a[9]～a[15] 命中；前 16 次合计 2 次未命中、14 次命中。</text></g></svg>