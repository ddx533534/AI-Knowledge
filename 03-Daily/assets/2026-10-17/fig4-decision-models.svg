<svg viewBox="0 0 680 392" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>同一件分类任务，生成模型和决策模型走的路不一样</title>
  <desc>左边是现在常见的做法：用生成模型做分类，模型逐个 token 生成文本，输出 token 照常计费，拿到文本之后再解析成标签，还要校 schema，格式不对就报错。右边是决策模型的做法：一次调用直接返回校准过的概率，零生成 token，所以只按输入计费。决策模型的问题只有三种：Noul 是是非题、返回 0 到 1 之间的概率，官方举的例子是「Is this message spam?」可能返回 0.92；Choice 是在一组无序类别里挑一个、返回命名选项上的概率分布；Score 是在一个有序量表上打分、返回按概率加权的位置。官方的边界是一句话：答案是 N 个已知选项里的一个就用决策模型，答案要新写一段内容就继续用生成模型。托管模型是 d1 与 d1-ultra，都吃文本加图片，走 Liquid API、OpenRouter 与 Vercel AI Gateway；开放权重是 d1-3B（3.1B）与 d1-omni-600M（587M，另吃最长 30 秒音频）。</desc>

  <text x="24" y="26" font-size="13" font-weight="500" fill="#2C2C2A">同一件分类任务，两条路</text>

  <rect x="24" y="40" width="308" height="126" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="40" y="62" font-size="12" font-weight="500" fill="#633806">用生成模型做分类</text>
  <text x="40" y="88" font-size="11.5" fill="#633806">模型逐个 token 生成文本</text>
  <text x="40" y="106" font-size="11" fill="#854F0B">输出 token 照常计费，哪怕答案只有一个词</text>
  <text x="40" y="130" font-size="11.5" fill="#633806">把文本解析成标签</text>
  <text x="40" y="148" font-size="11.5" fill="#633806">再校一遍 schema</text>
  <text x="40" y="164" font-size="11" fill="#854F0B">格式不合法就报错，而且不确定度拿不到</text>

  <rect x="348" y="40" width="308" height="126" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="364" y="62" font-size="12" font-weight="500" fill="#085041">用决策模型做同一件事</text>
  <text x="364" y="88" font-size="11.5" fill="#085041">一次调用返回校准过的概率</text>
  <text x="364" y="106" font-size="11" fill="#0F6E56">零生成 token，所以只按输入计费</text>
  <text x="364" y="130" font-size="11.5" fill="#085041">答案天然带概率，不用另想办法估</text>
  <text x="364" y="148" font-size="11.5" fill="#085041">答案一定符合问题类型</text>
  <text x="364" y="164" font-size="11" fill="#0F6E56">原始说法：a single call with zero generated tokens</text>

  <rect x="24" y="182" width="200" height="122" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="40" y="204" font-size="12" font-weight="500" fill="#0C447C">Noul</text>
  <text x="40" y="222" font-size="10.5" fill="#185FA5">是非题</text>
  <text x="40" y="244" font-size="11" fill="#0C447C">返回 0 到 1 之间的概率</text>
  <text x="40" y="268" font-size="10.5" fill="#185FA5">官方例子：“Is this message</text>
  <text x="40" y="284" font-size="10.5" fill="#185FA5">spam?” 可能返回 0.92</text>

  <rect x="240" y="182" width="200" height="122" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="256" y="204" font-size="12" font-weight="500" fill="#0C447C">Choice</text>
  <text x="256" y="222" font-size="10.5" fill="#185FA5">一组无序类别里挑一个</text>
  <text x="256" y="244" font-size="11" fill="#0C447C">返回命名选项上的概率分布</text>
  <text x="256" y="268" font-size="10.5" fill="#185FA5">分类、路由、ticket 分派</text>
  <text x="256" y="284" font-size="10.5" fill="#185FA5">都是这个形状</text>

  <rect x="456" y="182" width="200" height="122" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="472" y="204" font-size="12" font-weight="500" fill="#0C447C">Score</text>
  <text x="472" y="222" font-size="10.5" fill="#185FA5">有序量表上打分</text>
  <text x="472" y="244" font-size="11" fill="#0C447C">返回按概率加权的位置</text>
  <text x="472" y="268" font-size="10.5" fill="#185FA5">紧急度、质量打分、</text>
  <text x="472" y="284" font-size="10.5" fill="#185FA5">替掉 LLM-as-judge</text>

  <rect x="24" y="318" width="632" height="60" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="40" y="340" font-size="12" font-weight="500" fill="#2C2C2A">官方自己划的线：答案是 N 个已知选项里的一个就用它，答案要新写一段内容就继续用生成模型</text>
  <text x="40" y="362" font-size="11" fill="#444441">托管的是 d1 与 d1-ultra，吃文本加图片，走 Liquid API、OpenRouter 与 Vercel AI Gateway</text>
  <text x="40" y="376" font-size="11" fill="#5F5E5A">开放权重是 d1-3B 3.1B 与 d1-omni-600M 587M，后者另外吃最长 30 秒音频</text>
</svg>
