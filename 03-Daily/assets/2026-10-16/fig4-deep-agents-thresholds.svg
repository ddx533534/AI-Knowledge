<svg viewBox="0 0 680 356" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Deep Agents 把上下文什么时候搬走写成了三个阈值</title>
  <desc>LangChain 在 2026-10-14 的文章里写了三个数字。工具结果超过大约 20,000 tokens，完整结果先写到 /large_tool_results/ 下按 tool_call_id 命名的文件，模型只看到首尾几行的预览。人类消息的门槛更高，超过 50,000 tokens 的粘贴内容写到 /conversation_history/ 下。上下文用量到 85% 时，旧消息压成摘要，用量回落。五种技术分别是卸载、摘要、技能、子智能体和长期记忆，其中子智能体任务小、边界清楚，可以跑更便宜的模型并且并行。</desc>

  <text x="24" y="30" font-size="13" font-weight="500" fill="#2C2C2A">Deep Agents 的三个阈值，2026-10-14</text>

  <rect x="24" y="48" width="632" height="62" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="40" y="70" font-size="12" font-weight="500" fill="#27500A">工具结果超过 约 20,000 tokens</text>
  <text x="40" y="92" font-size="11.5" fill="#3B6D11">完整结果先写到 /large_tool_results/{tool_call_id}，模型只看到首尾几行拼成的预览</text>

  <rect x="24" y="122" width="632" height="62" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="40" y="144" font-size="12" font-weight="500" fill="#0C447C">人类消息超过 50,000 tokens</text>
  <text x="40" y="166" font-size="11.5" fill="#185FA5">粘贴的长文本同样处理，门槛更高，写到 /conversation_history/ 下</text>

  <rect x="24" y="196" width="632" height="62" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="40" y="218" font-size="12" font-weight="500" fill="#633806">上下文用量到 85%</text>
  <text x="40" y="240" font-size="11.5" fill="#854F0B">旧消息压成摘要，用量回落；检查发生在每次模型调用之前</text>

  <text x="24" y="284" font-size="12" font-weight="500" fill="#444441">五种技术，一个目的：把上下文搬出活动窗口，但不删掉</text>

  <rect x="24" y="298" width="122" height="42" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="85" y="322" text-anchor="middle" font-size="11.5" fill="#2C2C2A">卸载</text>
  <rect x="154" y="298" width="122" height="42" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="215" y="322" text-anchor="middle" font-size="11.5" fill="#2C2C2A">摘要</text>
  <rect x="284" y="298" width="122" height="42" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="345" y="322" text-anchor="middle" font-size="11.5" fill="#2C2C2A">技能</text>
  <rect x="414" y="298" width="122" height="42" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="475" y="322" text-anchor="middle" font-size="11.5" fill="#2C2C2A">子智能体</text>
  <rect x="544" y="298" width="112" height="42" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="600" y="322" text-anchor="middle" font-size="11.5" fill="#2C2C2A">长期记忆</text>
</svg>
