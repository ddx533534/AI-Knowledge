<svg viewBox="0 0 680 330" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>流式期间模型入参上屏的三处改动</title>
  <desc>三处改动都在解决同一个问题：模型还没写完结构化数据时，界面要不要等。Vercel AI SDK 的 ai@7.0.142 给流式入参打上 inputEncoding 为 text 的标记，界面不用先解析 JSON 就能边流边显示，最终发给模型的入参仍然是 JSON。assistant-ui 的 generative-frame 0.0.6 加了 resolveSpec，把一个 spec 和当前状态解析成渲染器真正要画的那棵元素树。openui 的 react-headless 0.18.1 在工具结果到达之前，先把攒着的 assistant 更新 flush 出去。</desc>

  <text x="24" y="30" font-size="13" font-weight="500" fill="#2C2C2A">模型还没写完的时候，界面要不要等</text>

  <rect x="24" y="48" width="632" height="60" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="40" y="70" font-size="11.5" fill="#2C2C2A">原来的做法：入参是一段 JSON，没闭合就解析不出来，界面只能等到整段流完才敢画第一笔</text>
  <text x="40" y="90" font-size="11.5" fill="#444441">等的时间就是用户看着空白的时间</text>

  <rect x="24" y="126" width="200" height="126" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="40" y="150" font-size="12" font-weight="500" fill="#0C447C">标上编码</text>
  <text x="40" y="174" font-size="11.5" fill="#185FA5">ai@7.0.142</text>
  <text x="40" y="196" font-size="11" fill="#185FA5">inputEncoding: 'text'</text>
  <text x="40" y="218" font-size="11" fill="#185FA5">界面不用解析 JSON 就能</text>
  <text x="40" y="234" font-size="11" fill="#185FA5">边流边显示</text>

  <rect x="240" y="126" width="200" height="126" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="256" y="150" font-size="12" font-weight="500" fill="#27500A">先出元素树</text>
  <text x="256" y="174" font-size="11.5" fill="#3B6D11">generative-frame 0.0.6</text>
  <text x="256" y="196" font-size="11" fill="#3B6D11">resolveSpec(spec, state)</text>
  <text x="256" y="218" font-size="11" fill="#3B6D11">把 spec 加当前状态解析成</text>
  <text x="256" y="234" font-size="11" fill="#3B6D11">渲染器要画的那棵树</text>

  <rect x="456" y="126" width="200" height="126" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="472" y="150" font-size="12" font-weight="500" fill="#633806">提前发出去</text>
  <text x="472" y="174" font-size="11.5" fill="#854F0B">react-headless 0.18.1</text>
  <text x="472" y="196" font-size="11" fill="#854F0B">工具结果没到之前</text>
  <text x="472" y="218" font-size="11" fill="#854F0B">先把攒着的 assistant</text>
  <text x="472" y="234" font-size="11" fill="#854F0B">更新 flush 出去</text>

  <rect x="24" y="268" width="632" height="48" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="40" y="288" font-size="11.5" fill="#2C2C2A">三条合起来是一件事：中间产物单独有一个能显示的形态，不必等到它变成最终结构</text>
  <text x="40" y="306" font-size="11.5" fill="#444441">写成 JSON 的最终入参没有变，变的是它在路上长什么样</text>
</svg>
