<svg viewBox="0 0 680 250" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>agent-device 让智能体跑一圈的回路</title>
  <desc>先打开应用拿到交互元素快照和 @ref，再用 ref 操作并等界面安静下来，命令会回一段和操作前的树做对比的差异，差异里带新的 ref，接着验证目标状态，最后关闭会话。ref 只在最新一次输出里有效，带 ~sN 的说明它来自第 N 次快照。</desc>

  <rect x="24" y="40" width="116" height="76" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="82" y="62" text-anchor="middle" font-size="12" font-weight="500" fill="#27500A" dominant-baseline="central">打开</text>
  <text x="82" y="84" text-anchor="middle" font-size="11" fill="#3B6D11" dominant-baseline="central">open，直接拿回</text>
  <text x="82" y="100" text-anchor="middle" font-size="11" fill="#3B6D11" dominant-baseline="central">初始快照</text>

  <rect x="153" y="40" width="116" height="76" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="211" y="62" text-anchor="middle" font-size="12" font-weight="500" fill="#0C447C" dominant-baseline="central">读界面</text>
  <text x="211" y="84" text-anchor="middle" font-size="11" fill="#185FA5" dominant-baseline="central">snapshot -i</text>
  <text x="211" y="100" text-anchor="middle" font-size="11" fill="#185FA5" dominant-baseline="central">每行带一个 @ref</text>

  <rect x="282" y="40" width="116" height="76" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="340" y="62" text-anchor="middle" font-size="12" font-weight="500" fill="#633806" dominant-baseline="central">动手</text>
  <text x="340" y="84" text-anchor="middle" font-size="11" fill="#854F0B" dominant-baseline="central">press 或 fill</text>
  <text x="340" y="100" text-anchor="middle" font-size="11" fill="#854F0B" dominant-baseline="central">加 --settle</text>

  <rect x="411" y="40" width="116" height="76" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="469" y="62" text-anchor="middle" font-size="12" font-weight="500" fill="#0C447C" dominant-baseline="central">收差异</text>
  <text x="469" y="84" text-anchor="middle" font-size="11" fill="#185FA5" dominant-baseline="central">和动手前的树比</text>
  <text x="469" y="100" text-anchor="middle" font-size="11" fill="#185FA5" dominant-baseline="central">差异里带新 ref</text>

  <rect x="540" y="40" width="116" height="76" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="598" y="62" text-anchor="middle" font-size="12" font-weight="500" fill="#27500A" dominant-baseline="central">验证收尾</text>
  <text x="598" y="84" text-anchor="middle" font-size="11" fill="#3B6D11" dominant-baseline="central">wait 或 is</text>
  <text x="598" y="100" text-anchor="middle" font-size="11" fill="#3B6D11" dominant-baseline="central">然后 close</text>

  <line x1="142" y1="78" x2="151" y2="78" stroke="#888780" stroke-width="1"/>
  <path d="M151 78 l-6 -3.5 l0 7 z" fill="#888780"/>
  <line x1="271" y1="78" x2="280" y2="78" stroke="#888780" stroke-width="1"/>
  <path d="M280 78 l-6 -3.5 l0 7 z" fill="#888780"/>
  <line x1="400" y1="78" x2="409" y2="78" stroke="#888780" stroke-width="1"/>
  <path d="M409 78 l-6 -3.5 l0 7 z" fill="#888780"/>
  <line x1="529" y1="78" x2="538" y2="78" stroke="#888780" stroke-width="1"/>
  <path d="M538 78 l-6 -3.5 l0 7 z" fill="#888780"/>

  <rect x="24" y="144" width="632" height="86" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="44" y="168" font-size="12.5" font-weight="500" fill="#2C2C2A" dominant-baseline="central">ref 是短命的，这一点在文档里反复强调</text>
  <text x="44" y="192" font-size="11.5" fill="#444441" dominant-baseline="central">界面一变，旧 ref 就不作数；要去差异里拿新的，别拿上一轮的接着用</text>
  <text x="44" y="212" font-size="11.5" fill="#444441" dominant-baseline="central">像 @e12~s4 这样的写法，是说这个 ref 由第 4 次快照生成，操作前会做一次校验</text>
</svg>
