<svg xmlns="http://www.w3.org/2000/svg" width="960" height="428" viewBox="0 0 960 428" role="img" aria-label="同一把锁要覆盖读取、修改和写回"><rect width="100%" height="100%" fill="#fafbf9"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="32" y="46" font-size="24" fill="#172b25">同一把锁要覆盖读取、修改和写回</text><rect x="28" y="76" width="904" height="88" rx="4" fill="#fff3eb" stroke="#cad5cf"/><text x="48" y="107" font-size="19" fill="#183e31">锁外先读：线程 A 保存 old = 5；线程 B 也保存 old = 5</text><text x="48" y="139" font-size="17" fill="#44564e">随后各自拿锁写入 old + 1，最终可能为 6。</text><rect x="28" y="182" width="904" height="88" rx="4" fill="#edf6ef" stroke="#cad5cf"/><text x="48" y="213" font-size="19" fill="#183e31">正确：线程 A 拿锁 → 读 5 → 写 6 → 释放锁</text><text x="48" y="245" font-size="17" fill="#44564e">线程 B 随后拿同一把锁 → 读 6 → 写 7 → 释放锁。</text><rect x="28" y="288" width="904" height="88" rx="4" fill="#ffffff" stroke="#cad5cf"/><text x="48" y="319" font-size="19" fill="#183e31">局部变量可以使用；关键是读取发生在哪里</text><text x="48" y="351" font-size="17" fill="#44564e">volatile 不会自动更新已经复制到 old 的数值。</text></g></svg>