<svg xmlns="http://www.w3.org/2000/svg" width="960" height="534" viewBox="0 0 960 534" role="img" aria-label="事务：原子性与隔离性回答不同问题"><rect width="100%" height="100%" fill="#fafbf9"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="32" y="46" font-size="24" fill="#172b25">事务：原子性与隔离性回答不同问题</text><rect x="28" y="76" width="904" height="88" rx="4" fill="#ffffff" stroke="#cad5cf"/><text x="48" y="107" font-size="19" fill="#183e31">原子性：事务内的修改整体提交，或整体撤销</text><text x="48" y="139" font-size="17" fill="#44564e">A 扣款后回滚，扣款修改不保留。</text><rect x="28" y="182" width="904" height="88" rx="4" fill="#fff3eb" stroke="#cad5cf"/><text x="48" y="213" font-size="19" fill="#183e31">脏读：B 看到了 A 尚未提交的修改</text><text x="48" y="245" font-size="17" fill="#44564e">例如看到余额 50，但 A 随后回滚，实际余额仍为 150。</text><rect x="28" y="288" width="904" height="88" rx="4" fill="#ffffff" stroke="#cad5cf"/><text x="48" y="319" font-size="19" fill="#183e31">不可重复读：B 同一事务内，同一行前后值不同</text><text x="48" y="351" font-size="17" fill="#44564e">第一次余额 150；A 提交扣款；第二次余额 50。</text><rect x="28" y="394" width="904" height="88" rx="4" fill="#ffffff" stroke="#cad5cf"/><text x="48" y="425" font-size="19" fill="#183e31">幻读：B 同一事务内，相同条件的匹配集合变化</text><text x="48" y="457" font-size="17" fill="#44564e">第一次符合条件的账户 3 个；A 插入并提交；第二次 4 个。</text></g></svg>