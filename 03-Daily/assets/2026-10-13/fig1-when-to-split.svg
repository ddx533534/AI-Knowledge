<svg viewBox="0 0 680 254" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>任务形状决定该不该拆成子智能体</title>
  <desc>子任务各走各的、互相不共享上下文时适合拆开；子任务互相依赖、要共享同一份上下文时不该拆；中间路是写入保持单线程，其他智能体只做审阅、顾问、路由。</desc>
  <rect x="40" y="44" width="290" height="118" rx="12" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="60" y="70" font-size="13" font-weight="500" fill="#27500A" dominant-baseline="central">该拆：子任务各走各的</text>
  <text x="60" y="102" font-size="12" fill="#3B6D11" dominant-baseline="central">并行搜资料、多路径调研</text>
  <text x="60" y="126" font-size="12" fill="#3B6D11" dominant-baseline="central">互相不共享同一份上下文</text>

  <rect x="350" y="44" width="290" height="118" rx="12" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="370" y="70" font-size="13" font-weight="500" fill="#791F1F" dominant-baseline="central">不该拆：子任务互相依赖</text>
  <text x="370" y="102" font-size="12" fill="#A32D2D" dominant-baseline="central">写代码、全栈应用这种</text>
  <text x="370" y="126" font-size="12" fill="#A32D2D" dominant-baseline="central">要共享同一份上下文</text>

  <rect x="40" y="182" width="600" height="52" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="340" y="208" text-anchor="middle" font-size="12" fill="#444441" dominant-baseline="central">中间路：写入保持单线程，别的智能体只做审阅、顾问、路由</text>
</svg>
